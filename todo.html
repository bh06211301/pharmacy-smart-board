<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>業務待辦清單</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg:#f5f6fa;--white:#fff;--surface2:#f0f2f8;--border:#e4e7f0;
  --accent:#3b6ef5;--accent-light:#eef2ff;
  --green:#12b76a;--green-light:#ecfdf5;
  --orange:#f79009;--orange-light:#fffaeb;
  --red:#f04438;--red-light:#fef3f2;
  --gray:#6b7280;--gray-light:#f9fafb;
  --text:#101828;--text2:#344054;--muted:#667085;--muted2:#98a2b3;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 8px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.06);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-name{font-size:15px;font-weight:700}.brand-name span{color:var(--accent)}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px}
.nav-back:hover{color:var(--text)}

/* MAIN */
.main{max-width:600px;margin:0 auto;padding:16px}

/* ADD AREA */
.add-area{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.add-row{display:flex;gap:8px;align-items:flex-start}
.add-input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Inter',sans-serif;background:var(--white);color:var(--text);outline:none;resize:none;min-height:44px;line-height:1.4}
.add-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,110,245,.1)}
.add-input::placeholder{color:var(--muted2)}
.add-controls{display:flex;gap:8px;align-items:center;margin-top:10px}
.priority-sel{padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;color:var(--text2);background:var(--white);outline:none;cursor:pointer;flex-shrink:0}
.priority-sel:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#2a5ce8}
.btn-ghost{background:var(--white);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface2)}

/* FILTERS */
.filters{display:flex;gap:6px;margin-bottom:14px}
.filter-btn{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:var(--white);color:var(--muted);border:1px solid var(--border);transition:all .15s;font-family:'Inter',sans-serif}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-count{display:inline-block;background:rgba(255,255,255,.25);border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;margin-left:4px}
.filter-btn:not(.active) .filter-count{background:var(--accent-light);color:var(--accent)}

/* TODO LIST */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);box-shadow:var(--shadow);transition:all .15s}
.todo-item.done{opacity:.55;background:var(--surface2)}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:12px;transition:all .15s}
.todo-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.todo-body{flex:1;min-width:0}
.todo-text{font-size:14px;font-weight:500;line-height:1.45;color:var(--text);word-break:break-word}
.todo-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
.priority-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.priority-high{background:var(--red-light);color:var(--red)}
.priority-medium{background:var(--orange-light);color:var(--orange)}
.priority-low{background:var(--green-light);color:var(--green)}
.todo-date{font-size:11px;color:var(--muted2)}
.todo-del{width:30px;height:30px;border-radius:6px;border:none;background:transparent;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .13s;margin-top:-2px}
.todo-del:hover{background:var(--red-light);color:var(--red)}

/* STATES */
.state-box{text-align:center;padding:40px 20px;color:var(--muted)}
.state-icon{font-size:40px;margin-bottom:12px}
.state-title{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:4px}
.state-sub{font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:1000;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand">
    <div class="brand-icon">📋</div>
    <div class="brand-name">業務<span>待辦</span></div>
  </div>
  <a class="nav-back" href="https://bh06211301.github.io/pharmacy-smart-board/">← 返回主頁</a>
</nav>

<div class="main">

  <!-- 新增區 -->
  <div class="add-area">
    <div class="add-row">
      <textarea class="add-input" id="addInput" placeholder="輸入待辦事項（Enter 送出）" rows="2"></textarea>
    </div>
    <div class="add-controls">
      <select class="priority-sel" id="prioritySel">
        <option value="high">🔴 高優先</option>
        <option value="medium" selected>🟡 中優先</option>
        <option value="low">🟢 低優先</option>
      </select>
      <button class="btn btn-primary" id="addBtn" onclick="addTodo()">＋ 新增</button>
    </div>
  </div>

  <!-- Filter -->
  <div class="filters">
    <button class="filter-btn active" id="f-active" onclick="setFilter('active')">未完成 <span class="filter-count" id="cnt-active">0</span></button>
    <button class="filter-btn" id="f-all" onclick="setFilter('all')">全部 <span class="filter-count" id="cnt-all">0</span></button>
    <button class="filter-btn" id="f-done" onclick="setFilter('done')">已完成 <span class="filter-count" id="cnt-done">0</span></button>
  </div>

  <!-- 清單 -->
  <div class="todo-list" id="todoList">
    <div class="state-box">
      <div class="state-icon">⏳</div>
      <div class="state-title">載入中...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://still-meadow-0efd.bh06211301.workers.dev';
let todos = [];
let currentFilter = 'active';

// ── 載入 ──────────────────────────────────────
async function loadTodos() {
  try {
    const res = await fetch(`${WORKER}/todos`);
    const data = await res.json();
    todos = data.todos || [];
    render();
  } catch(e) {
    document.getElementById('todoList').innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-title">載入失敗</div>
        <div class="state-sub">請確認網路連線後重新整理</div>
      </div>`;
  }
}

// ── 新增 ──────────────────────────────────────
async function addTodo() {
  const input = document.getElementById('addInput');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }

  const priority = document.getElementById('prioritySel').value;
  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '新增中...';

  try {
    const res = await fetch(`${WORKER}/todos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'addTodo', text, priority })
    });
    const data = await res.json();
    if (data.ok) {
      todos.unshift({ id: data.id, text, priority, done: false, createdAt: new Date().toISOString() });
      input.value = '';
      currentFilter = 'active';
      render();
      toast('已新增待辦');
    } else {
      toast('新增失敗：' + (data.error || '未知錯誤'));
    }
  } catch(e) {
    toast('網路錯誤，請重試');
  } finally {
    btn.disabled = false;
    btn.textContent = '＋ 新增';
  }
}

// ── 切換完成 ──────────────────────────────────
async function toggleTodo(id) {
  const todo = todos.find(t => t.id === id);
  if (!todo) return;
  const newDone = !todo.done;
  todo.done = newDone;
  render();

  try {
    await fetch(`${WORKER}/todos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'toggleTodo', id, done: newDone })
    });
  } catch(e) {
    todo.done = !newDone;
    render();
    toast('更新失敗');
  }
}

// ── 刪除 ──────────────────────────────────────
async function deleteTodo(id) {
  const todo = todos.find(t => t.id === id);
  if (!todo) return;
  if (!confirm(`確定刪除「${todo.text}」？`)) return;

  todos = todos.filter(t => t.id !== id);
  render();

  try {
    await fetch(`${WORKER}/todos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteTodo', id })
    });
    toast('已刪除');
  } catch(e) {
    await loadTodos();
    toast('刪除失敗');
  }
}

// ── Filter ────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  ['active','all','done'].forEach(k => {
    document.getElementById('f-' + k).classList.toggle('active', k === f);
  });
  render();
}

// ── 渲染 ──────────────────────────────────────
function render() {
  const active = todos.filter(t => !t.done);
  const done   = todos.filter(t => t.done);

  document.getElementById('cnt-all').textContent    = todos.length;
  document.getElementById('cnt-active').textContent = active.length;
  document.getElementById('cnt-done').textContent   = done.length;

  let list;
  if (currentFilter === 'active')    list = active;
  else if (currentFilter === 'done') list = done;
  else                                list = todos;

  const container = document.getElementById('todoList');

  if (list.length === 0) {
    const msgs = {
      active: ['✅', '沒有待辦事項', '新增一件事吧！'],
      done:   ['🎉', '還沒有完成的項目', '努力打勾吧！'],
      all:    ['📋', '清單是空的', '新增第一件待辦吧！'],
    };
    const [icon, title, sub] = msgs[currentFilter];
    container.innerHTML = `<div class="state-box"><div class="state-icon">${icon}</div><div class="state-title">${title}</div><div class="state-sub">${sub}</div></div>`;
    return;
  }

  const priorityLabel = { high: '高優先', medium: '中優先', low: '低優先' };
  const priorityClass = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };

  container.innerHTML = list.map(t => {
    const date = t.createdAt ? new Date(t.createdAt).toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' }) : '';
    return `
    <div class="todo-item${t.done ? ' done' : ''}" id="item-${t.id}">
      <div class="todo-check${t.done ? ' checked' : ''}" onclick="toggleTodo('${t.id}')">
        ${t.done ? '✓' : ''}
      </div>
      <div class="todo-body">
        <div class="todo-text">${escHtml(t.text)}</div>
        <div class="todo-meta">
          <span class="priority-badge ${priorityClass[t.priority] || 'priority-medium'}">${priorityLabel[t.priority] || '中優先'}</span>
          ${date ? `<span class="todo-date">${date}</span>` : ''}
        </div>
      </div>
      <button class="todo-del" onclick="deleteTodo('${t.id}')" title="刪除">×</button>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Enter 送出（Shift+Enter 換行）
document.getElementById('addInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTodo(); }
});

loadTodos();
</script>
</body>
</html>
