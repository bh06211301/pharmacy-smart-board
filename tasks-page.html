<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務投入 — 藥局 SmartRoute</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg:#f5f6fa;--white:#fff;--surface2:#f0f2f8;--border:#e4e7f0;
  --accent:#3b6ef5;--accent-light:#eef2ff;
  --green:#12b76a;--green-light:#ecfdf5;
  --orange:#f79009;--orange-light:#fffaeb;
  --red:#f04438;--red-light:#fef3f2;
  --purple:#7c3aed;--purple-light:#f5f3ff;
  --teal:#0891b2;--teal-light:#ecfeff;
  --text:#101828;--text2:#344054;--muted:#667085;--muted2:#98a2b3;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 8px rgba(16,24,40,.1),0 2px 4px rgba(16,24,40,.06);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover:not(:disabled){background:#2a5ce8}
.btn-ai{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}.btn-ai:hover:not(:disabled){opacity:.9}
.btn-ghost{background:var(--white);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover:not(:disabled){background:var(--surface2)}
.btn-sm{padding:6px 12px;font-size:12px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:16px 18px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge-blue{background:var(--accent-light);color:var(--accent)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.loading-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;margin-bottom:8px}

#map-container{width:100%;height:400px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);position:relative;background:#e8f0fe}
#gmap{width:100%;height:100%}
.map-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#e8f0fe;font-size:13px;color:var(--muted);z-index:10}

.area-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.area-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:5px}
.area-tab:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.area-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.area-tab .cnt{font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.25)}
.area-tab:not(.active) .cnt{background:var(--surface2);color:var(--muted)}

.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.ph-card{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;transition:all .15s;background:var(--white);box-shadow:var(--shadow);position:relative}
.ph-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.ph-card.selected,.ph-card.in-task{border-color:var(--accent);background:var(--accent-light)}
.ph-card-check{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;font-weight:700}
.ph-card.in-task .ph-card-check{display:flex}
.ph-card-id{font-size:10px;font-weight:700;color:var(--accent);margin-bottom:3px}
.ph-card-name{font-size:13px;font-weight:600;margin-bottom:2px}
.ph-card-addr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-card-doc{font-size:11px;color:var(--text2);margin-top:3px}

.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;background:var(--white);box-shadow:var(--shadow)}
.task-seq{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:600}
.task-meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-del{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;flex-shrink:0}
.task-del:hover{background:var(--red-light);color:var(--red)}

.route-result{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:var(--radius);padding:16px;margin-top:12px}
.route-stop{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--border);background:var(--white)}
.route-stop:first-child{border-top:none}
.stop-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:13px;font-weight:600}
.stop-detail{font-size:11px;color:var(--muted);margin-top:1px}
.stop-dist{font-size:11px;font-weight:700;color:var(--accent);flex-shrink:0;margin-top:2px}
.dist-row{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 44px;font-size:11px;color:var(--muted)}
.dist-line{flex:1;border-top:1px dashed var(--border)}

/* 費用卡 */
.cost-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-top:12px}
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.cost-row:last-child{border-bottom:none;font-weight:700;font-size:14px;color:var(--accent)}
.cost-label{color:var(--text2)}
.cost-val{font-weight:600}

.type-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.type-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2);transition:all .15s}
.type-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}

/* 起終點標示 */
.endpoint-marker{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600}
.ep-start{background:var(--green-light);color:var(--green)}
.ep-end{background:var(--orange-light);color:var(--orange)}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

<script>
// ★ 設定區 ★
const WORKER = 'https://still-meadow-0efd.bh06211301.workers.dev';
const GMAPS_KEY = 'AIzaSyBp-5PjGecwMsv-Ug5O__RAf-RzOwOqA3o';

// 固定起終點
const ORIGIN_ADDR = '新北市汐止區湖東街五巷25號';
const ORIGIN_LABEL = '🏢 公司（汐止）';
const DEST_ADDR = '台北市內湖區南京東路六段350之7號';
const DEST_LABEL = '🏠 家（內湖）';

// Honda Fit 油耗設定
const KM_PER_LITER = 24;       // 每公升跑 24km
const GAS_PRICE = 32;          // 每公升油價（元）
const HIGHWAY_RATE = 1.3;      // 高速公路費用：每公里約 1.3 元
const HW_FREE_KM = 20;         // eTag 每日免費 20 公里優惠
const HW_RATIO = 0.3;          // 估算約 30% 路程走高速

let pharmacies = [];
let tasks = [];
let selectedType = 'visit';
let activeArea = 'all';
let map = null;
let markers = [];
let infoWindow = null;
let routeResult = null;
let directionsRenderer = null;
</script>

<div style="padding:20px;max-width:1400px;margin:0 auto">

  <!-- 頂部 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div>
      <div style="font-size:18px;font-weight:700">📥 任務投入 — 今日路線規劃</div>
      <div style="font-size:13px;color:var(--muted);margin-top:3px">從地圖或地區列表選擇藥局，計算最短路線與行車費用</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="clearAllTasks()">清空任務</button>
      <button class="btn btn-ai" id="route-btn" onclick="calcRoute()" disabled>
        🗺️ 計算最短路線（<span id="task-count">0</span> 站）
      </button>
    </div>
  </div>

  <!-- 起終點提示 -->
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <div class="endpoint-marker ep-start">🏢 出發：新北市汐止區湖東街五巷25號</div>
    <div style="font-size:18px;color:var(--muted2)">→</div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);align-self:center">途經各藥局</div>
    <div style="font-size:18px;color:var(--muted2)">→</div>
    <div class="endpoint-marker ep-end">🏠 終點：台北市內湖區南京東路六段350之7號</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start">

    <!-- 左側 -->
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- 地圖 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">🗺️ 藥局地圖</div>
          <div style="display:flex;align-items:center;gap:10px">
            <div style="display:flex;gap:10px;font-size:11px">
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#3b6ef5;display:inline-block"></span>未加入</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#12b76a;display:inline-block"></span>已加入</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#f04438;display:inline-block"></span>逾期</span>
            </div>
            <span class="badge badge-blue" id="map-count">載入中...</span>
          </div>
        </div>
        <div class="card-body" style="padding:12px">
          <div id="map-container">
            <div class="map-loading" id="map-loading">
              <span class="spinner" style="width:24px;height:24px;border-width:3px"></span>
              <div>地圖載入中...</div>
            </div>
            <div id="gmap"></div>
          </div>
        </div>
      </div>

      <!-- 地區 + 藥局格 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📍 依地區選擇藥局</div>
          <input id="ph-search" placeholder="搜尋名稱或地址..."
            style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;outline:none;width:200px"
            oninput="renderGrid()">
        </div>
        <div class="card-body">
          <!-- 拜訪類型 -->
          <div style="margin-bottom:10px">
            <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">加入類型</div>
            <div class="type-btns">
              <div class="type-btn active" onclick="setType('visit',this)">🔄 例行拜訪</div>
              <div class="type-btn" onclick="setType('new',this)">🆕 新開藥局</div>
              <div class="type-btn" onclick="setType('dad',this)">👨‍⚕️ 爸爸老客戶</div>
              <div class="type-btn" onclick="setType('deliver',this)">📦 自送出貨</div>
            </div>
          </div>
          <!-- 地區 Tab -->
          <div class="area-tabs" id="area-tabs">
            <div class="area-tab active" onclick="setArea('all',this)">
              全部 <span class="cnt" id="cnt-all">0</span>
            </div>
          </div>
          <!-- 藥局格 -->
          <div class="ph-grid" id="ph-grid">
            <div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--muted)">
              <span class="spinner" style="width:18px;height:18px;border-width:2px"></span>
              <div style="margin-top:8px;font-size:12px">載入藥局中...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側 -->
    <div style="display:flex;flex-direction:column;gap:12px;position:sticky;top:20px">

      <!-- 任務清單 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 今日任務</div>
          <span class="badge badge-blue" id="task-badge">0 家</span>
        </div>
        <div style="padding:10px 12px;max-height:280px;overflow-y:auto" id="task-list">
          <div style="text-align:center;padding:20px 0;color:var(--muted);font-size:12px">
            <div style="font-size:22px;margin-bottom:6px">👆</div>點地圖或藥局卡片加入
          </div>
        </div>
      </div>

      <!-- 路線計算結果 -->
      <div id="route-output"></div>

    </div>
  </div>
</div>

<script>
// ══════════════════════════════
// 載入藥局
// ══════════════════════════════
async function loadData() {
  try {
    const res = await fetch(WORKER + '/pharmacies');
    const d = await res.json();
    pharmacies = d.pharmacies || d.data || [];
    buildAreaTabs();
    renderGrid();
    document.getElementById('map-count').textContent = pharmacies.length + ' 家';
    initMap();
  } catch(e) {
    document.getElementById('ph-grid').innerHTML =
      `<div style="grid-column:1/-1;color:var(--red);font-size:13px;padding:16px">❌ 載入失敗：${e.message}</div>`;
  }
}

// ══════════════════════════════
// 地區 Tabs — 修正：同時比對 district 和 city+district
// ══════════════════════════════
function getDistrict(p) {
  // Worker 回傳的欄位是 district（行政區）
  return p.district || p.area || '';
}

function buildAreaTabs() {
  const areaCounts = {};
  pharmacies.forEach(p => {
    const d = getDistrict(p);
    if (d) areaCounts[d] = (areaCounts[d] || 0) + 1;
  });

  const priority = ['汐止區','板橋區','新莊區','三重區','中和區','永和區','新店區','土城區','蘆洲區','內湖區','南港區','信義區'];
  const sorted = [
    ...priority.filter(a => areaCounts[a]),
    ...Object.keys(areaCounts).filter(a => !priority.includes(a)).sort()
  ];

  document.getElementById('cnt-all').textContent = pharmacies.length;
  const tabsEl = document.getElementById('area-tabs');

  sorted.forEach(area => {
    const tab = document.createElement('div');
    tab.className = 'area-tab';
    tab.innerHTML = `${area} <span class="cnt">${areaCounts[area]}</span>`;
    tab.onclick = () => setArea(area, tab);
    tabsEl.appendChild(tab);
  });
}

function setArea(area, el) {
  activeArea = area;
  document.querySelectorAll('.area-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
  if (area !== 'all' && map) focusArea(area);
}

function setType(type, el) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

// ══════════════════════════════
// 藥局格
// ══════════════════════════════
function renderGrid() {
  const kw = (document.getElementById('ph-search').value || '').toLowerCase();
  let list = pharmacies;

  if (activeArea !== 'all') {
    list = list.filter(p => getDistrict(p) === activeArea);
  }
  if (kw) {
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(kw) ||
      (p.id||'').toLowerCase().includes(kw) ||
      (p.address||'').toLowerCase().includes(kw)
    );
  }

  const grid = document.getElementById('ph-grid');
  if (!list.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--muted);font-size:12px">此地區無藥局資料</div>`;
    return;
  }

  grid.innerHTML = list.slice(0, 80).map(p => {
    const inTask = tasks.some(t => t.id === p.id);
    return `<div class="ph-card ${inTask?'in-task':''}" onclick="togglePharmacy('${p.id}')">
      <div class="ph-card-check">✓</div>
      <div class="ph-card-id">${p.id}</div>
      <div class="ph-card-name">${p.name}</div>
      <div class="ph-card-addr" title="${p.address||''}">${p.address||''}</div>
      <div class="ph-card-doc">👤 ${p.pharmacist||'—'}</div>
    </div>`;
  }).join('');

  if (list.length > 80) {
    grid.innerHTML += `<div style="grid-column:1/-1;font-size:11px;color:var(--muted);padding:6px;text-align:center">顯示前80筆，共${list.length}筆，請搜尋縮小範圍</div>`;
  }
}

// ══════════════════════════════
// 加入 / 移除任務
// ══════════════════════════════
function togglePharmacy(id) {
  const p = pharmacies.find(x => x.id === id);
  if (!p) return;
  const idx = tasks.findIndex(t => t.id === id);
  if (idx >= 0) {
    tasks.splice(idx, 1);
    toast(`已移除：${p.name}`);
  } else {
    tasks.push({ id:p.id, name:p.name, address:p.address, lat:p.lat, lng:p.lng, pharmacist:p.pharmacist, type:selectedType });
    toast(`✅ 加入：${p.name}`);
  }
  renderGrid(); renderTasks(); updateMapMarkers(); updateRouteBtn();
}

function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  renderGrid(); renderTasks(); updateMapMarkers(); updateRouteBtn();
}

function clearAllTasks() {
  tasks = [];
  if (directionsRenderer) directionsRenderer.setMap(null);
  renderGrid(); renderTasks(); updateMapMarkers(); updateRouteBtn();
  document.getElementById('route-output').innerHTML = '';
  toast('已清空任務');
}

// ══════════════════════════════
// 任務清單
// ══════════════════════════════
const typeColor = { visit:'var(--accent)', new:'var(--purple)', dad:'var(--teal)', deliver:'var(--green)' };
const typeLabel = { visit:'🔄 例行', new:'🆕 新藥局', dad:'👨‍⚕️ 爸爸', deliver:'📦 自送' };

function renderTasks() {
  const el = document.getElementById('task-list');
  document.getElementById('task-badge').textContent = tasks.length + ' 家';
  if (!tasks.length) {
    el.innerHTML = `<div style="text-align:center;padding:20px 0;color:var(--muted);font-size:12px"><div style="font-size:22px;margin-bottom:6px">👆</div>點地圖或藥局卡片加入</div>`;
    return;
  }
  el.innerHTML = tasks.map((t,i) => `
    <div class="task-item">
      <div class="task-seq" style="background:${typeColor[t.type]||'var(--accent)'}">${i+1}</div>
      <div class="task-info">
        <div class="task-name">${t.name} <span style="font-size:10px;color:var(--muted)">${t.id}</span></div>
        <div class="task-meta">${t.address||''}</div>
        <span class="badge" style="background:${typeColor[t.type]}22;color:${typeColor[t.type]};font-size:10px;margin-top:3px;display:inline-block">${typeLabel[t.type]}</span>
      </div>
      <button class="task-del" onclick="removeTask('${t.id}')">✕</button>
    </div>`).join('');
}

function updateRouteBtn() {
  const btn = document.getElementById('route-btn');
  document.getElementById('task-count').textContent = tasks.length;
  btn.disabled = tasks.length === 0;
}

// ══════════════════════════════
// Google Maps
// ══════════════════════════════
function initMap() {
  if (typeof google === 'undefined') return;
  document.getElementById('map-loading').style.display = 'none';

  // 以汐止公司為中心
  map = new google.maps.Map(document.getElementById('gmap'), {
    center: { lat: 25.065, lng: 121.658 },
    zoom: 11,
    mapTypeControl: false,
    streetViewControl: false,
    styles: [{ featureType:'poi', elementType:'labels', stylers:[{visibility:'off'}] }]
  });
  infoWindow = new google.maps.InfoWindow();
  directionsRenderer = new google.maps.DirectionsRenderer({
    suppressMarkers: false,
    polylineOptions: { strokeColor:'#3b6ef5', strokeWeight:4, strokeOpacity:.8 }
  });
  directionsRenderer.setMap(map);
  renderMapMarkers();
}

function renderMapMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
  const validPh = pharmacies.filter(p => p.lat && p.lng);
  validPh.forEach(p => {
    const inTask = tasks.some(t => t.id === p.id);
    const marker = new google.maps.Marker({
      position: { lat: parseFloat(p.lat), lng: parseFloat(p.lng) },
      map,
      title: p.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: inTask ? 9 : 6,
        fillColor: inTask ? '#12b76a' : '#3b6ef5',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 1.5,
      }
    });
    marker.addListener('click', () => {
      const isIn = tasks.some(t => t.id === p.id);
      infoWindow.setContent(`
        <div style="font-family:Inter,sans-serif;padding:4px;min-width:170px">
          <div style="font-size:11px;font-weight:700;color:#3b6ef5;margin-bottom:3px">${p.id}</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:2px">${p.name}</div>
          <div style="font-size:11px;color:#667085;margin-bottom:4px">${p.address||''}</div>
          <div style="font-size:11px;margin-bottom:8px">👤 ${p.pharmacist||'—'}</div>
          <button onclick="window.togglePharmacy('${p.id}')"
            style="width:100%;padding:7px;border:none;border-radius:6px;
              background:${isIn?'#fef3f2':'#3b6ef5'};color:${isIn?'#f04438':'#fff'};
              font-size:12px;font-weight:600;cursor:pointer">
            ${isIn ? '✕ 從任務移除' : '＋ 加入任務'}
          </button>
        </div>`);
      infoWindow.open(map, marker);
    });
    markers.push(marker);
  });
}

function updateMapMarkers() {
  const validPh = pharmacies.filter(p => p.lat && p.lng);
  markers.forEach((marker, i) => {
    const p = validPh[i];
    if (!p) return;
    const inTask = tasks.some(t => t.id === p.id);
    marker.setIcon({
      path: google.maps.SymbolPath.CIRCLE,
      scale: inTask ? 9 : 6,
      fillColor: inTask ? '#12b76a' : '#3b6ef5',
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 1.5,
    });
  });
}

function focusArea(area) {
  const list = pharmacies.filter(p => getDistrict(p) === area && p.lat && p.lng);
  if (!list.length || !map) return;
  const bounds = new google.maps.LatLngBounds();
  list.forEach(p => bounds.extend({ lat: parseFloat(p.lat), lng: parseFloat(p.lng) }));
  map.fitBounds(bounds, 80);
}

// ══════════════════════════════
// 路線計算 + 費用估算
// ══════════════════════════════
async function calcRoute() {
  if (!tasks.length) return;
  const btn = document.getElementById('route-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 計算中...';

  const output = document.getElementById('route-output');
  output.innerHTML = `<div class="card"><div class="card-body">
    <div class="loading-line" style="width:50%"></div>
    <div class="loading-line" style="width:75%"></div>
    <div class="loading-line" style="width:40%"></div>
  </div></div>`;

  try {
    const directionsService = new google.maps.DirectionsService();
    if (directionsRenderer) directionsRenderer.setMap(null);
    directionsRenderer = new google.maps.DirectionsRenderer({
      polylineOptions: { strokeColor:'#3b6ef5', strokeWeight:4, strokeOpacity:.8 }
    });
    directionsRenderer.setMap(map);

    const waypoints = tasks.map(t => ({ location: t.address, stopover: true }));

    const result = await new Promise((resolve, reject) => {
      directionsService.route({
        origin: ORIGIN_ADDR,
        destination: DEST_ADDR,
        waypoints,
        optimizeWaypoints: true,
        travelMode: google.maps.TravelMode.DRIVING,
        drivingOptions: { departureTime: new Date(), trafficModel: 'bestguess' }
      }, (res, status) => {
        if (status === 'OK') resolve(res);
        else reject(new Error('路線計算失敗：' + status));
      });
    });

    const order = result.routes[0].waypoint_order;
    const legs = result.routes[0].legs;

    // 重排任務順序（依 Google 最佳化結果）
    const reordered = order.map(i => tasks[i]);

    // 計算總距離 / 時間
    let totalDist = 0, totalTime = 0;
    legs.forEach(leg => { totalDist += leg.distance.value; totalTime += leg.duration.value; });

    routeResult = { reordered, legs, totalDist, totalTime };
    renderRouteResult(reordered, legs, totalDist, totalTime);
    directionsRenderer.setDirections(result);
    map.fitBounds(result.routes[0].bounds, 60);
    toast('✅ 最短路線計算完成！');
  } catch(e) {
    output.innerHTML = `<div class="card"><div class="card-body" style="color:var(--red);font-size:13px">❌ ${e.message}</div></div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `🗺️ 計算最短路線（<span id="task-count">${tasks.length}</span> 站）`;
  }
}

function renderRouteResult(stops, legs, totalDist, totalTime) {
  const km = totalDist / 1000;
  const hr = Math.floor(totalTime / 3600);
  const min = Math.floor((totalTime % 3600) / 60);
  const timeStr = hr > 0 ? `${hr} 小時 ${min} 分` : `${min} 分鐘`;

  // 費用計算
  const fuelUsed = km / KM_PER_LITER;
  const fuelCost = Math.round(fuelUsed * GAS_PRICE);
  // 高速公路費：估算走高速的公里數，扣掉 eTag 每日免費 20km
  const hwKm = km * HW_RATIO;
  const hwChargeable = Math.max(0, hwKm - HW_FREE_KM);
  const hwCost = Math.round(hwChargeable * HIGHWAY_RATE);
  const totalCost = fuelCost + hwCost;

  let html = `<div class="route-result">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px">✦ 最短路線</span>
      <span style="font-size:13px;font-weight:700">${km.toFixed(1)} km · ${timeStr}</span>
    </div>
    <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px">`;

  // 出發點
  html += `<div class="route-stop" style="background:var(--green-light)">
    <div class="stop-num" style="background:var(--green)">🏢</div>
    <div class="stop-info">
      <div class="stop-name">出發：公司</div>
      <div class="stop-detail">${ORIGIN_ADDR}</div>
    </div>
  </div>
  <div class="dist-row"><div class="dist-line"></div><span style="flex-shrink:0">${legs[0]?.distance?.text||''} · ${legs[0]?.duration?.text||''}</span><div class="dist-line"></div></div>`;

  // 中途各站
  stops.forEach((s, i) => {
    const col = typeColor[s.type] || 'var(--accent)';
    const leg = legs[i + 1];
    html += `<div class="route-stop">
      <div class="stop-num" style="background:${col}">${i+1}</div>
      <div class="stop-info">
        <div class="stop-name">${s.name} <span style="font-size:10px;color:var(--muted)">${s.id}</span></div>
        <div class="stop-detail">${s.address||''}</div>
      </div>
    </div>`;
    if (leg) {
      html += `<div class="dist-row"><div class="dist-line"></div><span style="flex-shrink:0">${leg.distance.text} · ${leg.duration.text}</span><div class="dist-line"></div></div>`;
    }
  });

  // 終點
  html += `<div class="route-stop" style="background:var(--orange-light)">
    <div class="stop-num" style="background:var(--orange)">🏠</div>
    <div class="stop-info">
      <div class="stop-name">終點：家</div>
      <div class="stop-detail">${DEST_ADDR}</div>
    </div>
  </div></div>`;

  // 費用估算
  html += `<div class="cost-card">
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">💰 今日行車費用估算</div>
    <div class="cost-row">
      <span class="cost-label">總距離</span>
      <span class="cost-val">${km.toFixed(1)} km</span>
    </div>
    <div class="cost-row">
      <span class="cost-label">⛽ 油費（${GAS_PRICE}元/公升 × ${fuelUsed.toFixed(2)}公升）</span>
      <span class="cost-val">約 $${fuelCost}</span>
    </div>
    <div class="cost-row">
      <span class="cost-label">🛣️ 高速公路費（走高速約 ${hwKm.toFixed(1)} km，免費 20km 後剩 ${hwChargeable.toFixed(1)} km）</span>
      <span class="cost-val">${hwCost > 0 ? '約 $'+hwCost : '✅ 免費（含優惠）'}</span>
    </div>
    <div class="cost-row">
      <span class="cost-label">今日總花費</span>
      <span class="cost-val" style="color:var(--accent);font-size:15px">約 $${totalCost}</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">
      Honda Fit · ${KM_PER_LITER} km/L · 油價 ${GAS_PRICE} 元/L · eTag 每日免費 20 km
    </div>
  </div>`;

  // 按鈕
  html += `<div style="display:flex;gap:10px;margin-top:12px">
    <button class="btn btn-primary" onclick="confirmRoute()">✓ 確認今日行程</button>
    <button class="btn btn-ghost btn-sm" onclick="openNav()">🗺️ 開啟導航</button>
  </div></div>`;

  document.getElementById('route-output').innerHTML = html;
}

function confirmRoute() {
  if (!routeResult) return;
  localStorage.setItem('todayRoute', JSON.stringify(routeResult.reordered));
  toast('✅ 今日行程已確認！');
}

function openNav() {
  if (!routeResult) return;
  const stops = routeResult.reordered;
  const o = encodeURIComponent(ORIGIN_ADDR);
  const d = encodeURIComponent(DEST_ADDR);
  const waypts = stops.map(s => encodeURIComponent(s.address)).join('/');
  window.open(`https://www.google.com/maps/dir/${o}/${waypts}/${d}`, '_blank');
}

// ══════════════════════════════
// Toast
// ══════════════════════════════
function toast(msg) {
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#101828;color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;font-family:Inter,sans-serif';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.transform = 'translateY(0)'; el.style.opacity = '1';
  setTimeout(() => { el.style.transform = 'translateY(80px)'; el.style.opacity = '0'; }, 2800);
}

};

</script>
