  return Math.max(...row.purposes.map(purposeStayMin_));
}

// 自動預選拜訪目的（使用者可以改）：正式客戶→例行拜訪；新店→新店開發；送貨來源→送貨；
// 寄賣待整理/該對帳/事項文字含「請款」的待追蹤→對帳請款；符合多條就全部預選。
function autoPreselectPurposes_(row) {
  const rec = (planData?.recommended || []).find(x => x.id === row.id);
  const preset = new Set();
  if (rec?.type === 'customer') preset.add('例行拜訪');
  if (rec?.type === 'new-store') preset.add('新店開發');
  if (row.typeTags.includes('送貨')) preset.add('送貨');
  if (rec && consignmentBadge(rec).triggered) preset.add('對帳請款');
  if (row.typeTags.includes('寄賣對帳')) preset.add('對帳請款');
  if (row.typeTags.includes('待追蹤')) {
    const a = anchors.find(x => x.id === row.id && x.source === '待追蹤');
    if (a?.item && String(a.item).includes('請款')) preset.add('對帳請款');
  }
  if (!preset.size) preset.add('例行拜訪'); // 保底，不要有列完全沒有目的
  row.purposes = [...preset];
}

// 「這站要做的事」自動組合：寄賣→對帳N張$金額；送貨→送貨（目前沒有單日訂單金額可用，
// 業務親送自動進錨點時 worker.js 沒有附金額，要顯示金額得先補後端欄位，階段一先不做）；
// 負責人是老爸的店→帳單還老爸／收款交老爸；待追蹤→事項第一行。符合多條就全部列出來。
function buildAutoTask_(row) {
  const parts = [];
  const rec = (planData?.recommended || []).find(x => x.id === row.id);
  if (rec) {
    const cb = consignmentBadge(rec);
    if (cb.triggered) {
      if (rec.consignmentStaleCount > 0) parts.push(`對帳 ${rec.consignmentStaleCount} 張 $${(rec.consignmentStaleTotal || 0).toLocaleString()}`);
      else if (rec.isContracted) parts.push(`對帳 $${(rec.consignmentAllTotal || 0).toLocaleString()}`);
    }
  }
  if (row.typeTags.includes('送貨')) parts.push('送貨');
  if (isDadStore(row.id)) parts.push('帳單還老爸、收款交老爸');
  if (row.typeTags.includes('待追蹤')) {
    const a = anchors.find(x => x.id === row.id && x.source === '待追蹤');
    if (a?.item) parts.push(String(a.item).split('\n')[0]);
  }
  return parts.join('、');
}

// 店家規則狀態：先查 planData.recommended 有沒有現成的 ruleStatus（/api/plan 已經附帶，絕大多數
// 情況走這裡，不用再打一次 API）；找不到（例如手動加入的老爸/新竹/不拜訪客戶，這些被 /api/plan
// 排除在推薦清單外）才打 /api/store 拿該店的規則清單自己算一次——不能直接當「可以去」，否則漏掉
// 真的有規則衝突的店。查詢失敗時明確標「未知」，不偽裝成「可以去」。
const ruleStatusFallbackCache_ = {};
const WEEKDAY_NAMES_TL_ = ['日', '一', '二', '三', '四', '五', '六'];
function matchesWeekdayClient_(weekdaysStr, planDate) {
  if (!weekdaysStr) return false;
  return String(weekdaysStr).split(/[、,]/).map(s => s.trim()).includes(WEEKDAY_NAMES_TL_[planDate.getDay()]);
}
function matchesMonthDayClient_(monthDaysStr, planDate) {
  if (!monthDaysStr) return false;
  const m = String(monthDaysStr).match(/^(\d+)\s*-\s*(\d+)$/);
  if (!m) return false;
  const day = planDate.getDate();
  return day >= parseInt(m[1], 10) && day <= parseInt(m[2], 10);
}
function evalRuleStatusClient_(rules, planDate) {
  const matched = rules.filter(r => {
    if (!r.weekdays && !r.monthDays) return true;
    return matchesWeekdayClient_(r.weekdays, planDate) || matchesMonthDayClient_(r.monthDays, planDate);
  });
  if (!matched.length) return { status: '可以去', rules: [] };
  if (matched.some(r => r.action === '擋住')) return { status: '擋住', rules: matched.map(r => r.note).filter(Boolean) };
  if (matched.some(r => r.action === '自動調整')) return { status: '自動調整', rules: matched.map(r => r.note).filter(Boolean) };
  return { status: '提醒', rules: matched.map(r => r.note).filter(Boolean) };
}
async function resolveRuleStatus_(id) {
  const rec = (planData?.recommended || []).find(x => x.id === id);
  if (rec?.ruleStatus) return rec.ruleStatus;
  if (ruleStatusFallbackCache_[id]) return ruleStatusFallbackCache_[id];
  try {
    const data = await get('/api/store?id=' + encodeURIComponent(id));
    const planDateObj = new Date(getPlanDate().replace(/-/g, '/'));
    const status = evalRuleStatusClient_(data.rules || [], planDateObj);
    ruleStatusFallbackCache_[id] = status;
    return status;
  } catch (e) {
    console.warn('店家規則狀態查詢失敗，標記為未知（不當成可以去）', id, e);
    return { status: '未知', rules: [] };
  }
}

async function buildTodayListRow_(id) {
  const ph = (allPharmaciesCache || []).find(p => p.id === id);
  const rec = (planData?.recommended || []).find(x => x.id === id);
  const anchor = anchors.find(a => a.id === id);
  const row = {
    id,
    name: ph?.name || rec?.name || anchor?.name || id,
    address: ph?.address || rec?.address || '',
    typeTags: [],
    purposes: [], purposesTouched: false,
    otherPurposeText: '', purposeNote: '',
    manualStayMin: null,
    autoTask: '', ruleStatus: null,
    arrival: null, locateMethod: null,
  };
  await refreshTodayListRowMeta_(row);
  return row;
}
async function refreshTodayListRowMeta_(row) {
  row.typeTags = todayListTypeTags_(row.id);
  row.ruleStatus = await resolveRuleStatus_(row.id);
  row.autoTask = buildAutoTask_(row);
  if (!row.purposesTouched) autoPreselectPurposes_(row);
}

// ①②欄任何變動後都呼叫這支，把 anchors∪selectedCol2Ids 合成一次今日清單——同一家店同時出現在
// ①②欄只留一列（用店家代號去重，規格提到的「新開店家沒代號用地址判斷」在目前所有加入①②欄的
// 路徑裡都一定會帶 id，沒有真的會發生的 id-less 情況，先不多寫一套用不到的分支；如果之後有新的
// 「直接輸入店名/地址、完全不經過既有清單」的加入方式，要在這裡補上地址去重）。
//
// 2026-11-08 修正：這支內部有好幾個 await（buildTodayListRow_/refreshTodayListRowMeta_），toggleCol2
// 又是 fire-and-forget 呼叫（不 await，因為它自己不是 async），連續快速勾多個②欄 checkbox 時會疊出
// 多個還在跑的 syncTodayList_() 同時讀寫同一份 todayList，互相蓋掉彼此的結果（實際症狀：拖曳/目的/
// 備註/停留分鐘存檔後重新整理對不起來，而且同一次操作送出兩次內容不一致的存檔，GAS 的
// clientUpdatedAt 衝突判斷因此被觸發）。改成用一條 Promise 佇列把所有呼叫序列化，不管呼叫端是否
// await，同一時間永遠只有一個真正在跑，下一個等上一個完全做完才開始——呼叫端的寫法完全不用改。
let syncTodayListQueue_ = Promise.resolve();
function syncTodayList_() {
  const run = syncTodayListQueue_.then(() => syncTodayListImpl_());
  syncTodayListQueue_ = run.catch(e => console.error('syncTodayList_ 失敗（佇列繼續往下走）', e));
  return run;
}
async function syncTodayListImpl_() {
  const desiredIds = new Set([...anchors.map(a => a.id), ...selectedCol2Ids]);
  todayList = todayList.filter(row => desiredIds.has(row.id));

  const existingIds = new Set(todayList.map(r => r.id));
  const orderedCandidateIds = [...anchors.map(a => a.id), ...selectedCol2Ids];
  const seen = new Set();
  for (const id of orderedCandidateIds) {
    if (seen.has(id) || existingIds.has(id)) continue;
    seen.add(id);
    todayList.push(await buildTodayListRow_(id));
  }
  for (const row of todayList) {
    if (!seen.has(row.id)) await refreshTodayListRowMeta_(row); // 新列剛 build 過，不用重算一次
  }

  invalidateRouteIfStopsChanged_();
  recomputeTodayListTimes_();
}

function todayListBillingTotal_() {
  let total = 0;
  todayList.forEach(row => {
    const rec = (planData?.recommended || []).find(x => x.id === row.id);
    if (!rec) return;
    const cb = consignmentBadge(rec);
    if (!cb.triggered) return;
    total += rec.consignmentStaleCount > 0 ? (rec.consignmentStaleTotal || 0) : (rec.consignmentAllTotal || 0);
  });
  return total;
}

function renderTodayListSummary_() {
  const el = document.getElementById('today-list-summary');
  if (!el) return;
  if (!todayList.length) { el.innerHTML = '<div class="empty-hint">還沒有任何店家</div>'; return; }
  const counts = {};
  todayList.forEach(row => row.typeTags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const countsText = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join('・');
  const billingTotal = todayListBillingTotal_();
  const orderLabel = orderMode === 'route' ? '依路線順序' : orderMode === 'manual' ? '順序已手動調整' : '未排序';
  // 不在這裡重算——recomputeTodayListTimes_() 已經算過一次並存進 lastComputedFinishMin_，
  // 這裡只負責顯示，避免跟那支各自算一次、萬一邏輯以後分岔就兜不起來。
  const finishText = lastComputedFinishMin_ != null ? fmtMin(lastComputedFinishMin_) : '—（按計算路線）';
  el.innerHTML = `
    <span><strong>${todayList.length} 家</strong>${countsText ? '｜' + escapeHtml(countsText) : ''}${lastRouteTotalKm != null ? `・${lastRouteTotalKm} km` : ''}</span>
    ${billingTotal ? `<span>預估對帳 $${billingTotal.toLocaleString()}</span>` : ''}
    <span>出發 <input type="time" class="tl-depart-input" id="depart-time-input" data-action="depart-time-input" value="${fmtMin(departMin)}"></span>
    <span>預估收工 ${finishText}</span>
    <span class="tl-order-mode">（${orderLabel}）</span>`;
}

function ruleConflictHtml_(row) {
  if (!row.ruleStatus) return '';
  if (row.ruleStatus.status === '擋住') {
    return `<div class="tl-rule-conflict">⛔ 規則衝突：${row.ruleStatus.rules.map(escapeHtml).join('；') || '店家規則禁止今天拜訪'}</div>`;
  }
  if (row.ruleStatus.status === '提醒' || row.ruleStatus.status === '自動調整') {
    return `<div class="tl-rule-note">⚠ ${row.ruleStatus.rules.map(escapeHtml).join('；')}</div>`;
  }
  if (row.ruleStatus.status === '未知') {
    return `<div class="tl-rule-note">規則狀態查詢失敗，請自行確認是否可以拜訪</div>`;
  }
  return '';
}

function todayListRowHtml_(row, index) {
  const seqLabel = orderMode === 'unordered' ? String(index + 1) : `#${index + 1}`;
  const arrivalText = row.arrival ? fmtMin(row.arrival) : (orderMode === 'unordered' ? '未排序' : '—');
  const stayMin = effectiveStayMin_(row);
  const hasOther = row.purposes.includes('其他');
  return `<div class="tl-row${row.ruleStatus?.status === '擋住' ? ' rule-blocked' : ''}" draggable="true" data-tl-id="${escapeHtml(row.id)}">
    <div class="tl-row-top">
      <span class="tl-seq">${seqLabel}</span>
      <span class="tl-name">${escapeHtml(row.name)}</span>
      <span class="tl-tags">${row.typeTags.map(t => `<span class="tl-tag">${escapeHtml(t)}</span>`).join('')}</span>
      <button class="tl-remove" data-action="remove-today" data-id="${escapeHtml(row.id)}" title="移除（同步取消①②欄勾選）">✕</button>
    </div>
    <div class="tl-purposes">
      ${VISIT_PURPOSES.map(p => `<label class="tl-purpose-chip${row.purposes.includes(p.key) ? ' checked' : ''}">
        <input type="checkbox" data-action="toggle-tl-purpose" data-id="${escapeHtml(row.id)}" data-purpose="${escapeHtml(p.key)}" ${row.purposes.includes(p.key) ? 'checked' : ''}>${escapeHtml(p.key)}
      </label>`).join('')}
    </div>
    ${hasOther ? `<input type="text" class="tl-other-text" data-action="tl-other-text" data-id="${escapeHtml(row.id)}" placeholder="其他：請輸入" value="${escapeHtml(row.otherPurposeText)}">` : ''}
    <input type="text" class="tl-note" data-action="tl-note" data-id="${escapeHtml(row.id)}" placeholder="目的備註（例如帶新品試用包）" value="${escapeHtml(row.purposeNote)}">
    ${row.autoTask ? `<div class="tl-auto-task">${escapeHtml(row.autoTask)}</div>` : ''}
    ${ruleConflictHtml_(row)}
    <div class="tl-row-bottom">
      <span>停留 <input type="number" class="tl-stay-input" min="5" step="5" data-action="tl-stay-min" data-id="${escapeHtml(row.id)}" value="${stayMin}">分</span>
      ${row.locateMethod ? `<span class="tl-method${row.locateMethod === 'name' ? ' by-name' : ''}">用${locateMethodLabel_(row.locateMethod)}定位</span>` : ''}
      <span class="tl-arrival">${arrivalText}</span>
    </div>
  </div>`;
}

function renderTodayList_() {
  renderTodayListSummary_();
  const root = document.getElementById('today-list-root');
  const confirmBtn = document.getElementById('btn-confirm-route');
  // 2026-11-06：「確定今天的行程」不綁計算路線成不成功——按下＝立即存檔並標這天已確定，
  // 有清單就能按，不用先算過路線。
  if (confirmBtn) confirmBtn.style.display = todayList.length ? '' : 'none';
  if (root) {
    if (!todayList.length) root.innerHTML = '<div class="empty-hint">在第①②欄選好店家後，這裡會立即出現清單</div>';
    else root.innerHTML = todayList.map((row, i) => todayListRowHtml_(row, i)).join('');
  }
  // 2026-11-06：單一存檔觸發點——所有會改到今日清單內容的路徑最終都會呼叫 renderTodayList_()，
  // 不用在每個改動的地方各自補一次「存檔」呼叫、容易漏掉。唯一要排除的是「剛從伺服器讀進來、
  // 還原畫面」這個情境（restoreTodayPlanState_／applyTodayPlanRows_ 會用 pushSuppressAutoSave_
  // 關掉），否則每次開頁都會立刻多打一次一模一樣的存檔請求。
  if (suppressAutoSaveDepth_ === 0) scheduleTodayPlanSave_();
}

// ══════════════════════════════
// 今日清單階段二：存進「今日行程」表（debounce 2 秒），不再是純前端易失狀態
// ══════════════════════════════
function parseHHMM_(s) {
  const m = String(s || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
}

// 這一列在「今日行程」表要記成哪個「來源」（單一值，不是畫面上可複選的「類型」標籤）：
// 在①（anchors）就用那個錨點自己的來源字串對應的類別；不然就是②欄使用者自己勾的
// （2026-11-19 修#3/#4 之後，「選這區」只給建議，不會自動勾進②，所以不會再是「選區」這個值——
// 保留讀取舊資料時的相容性見 applyTodayPlanRows_，但這裡只負責存新資料，不用再分流）。
function todayListRowSource_(id) {
  const anchor = anchors.find(a => a.id === id);
  if (anchor) return anchorSourceTag_(anchor.source);
  return '第②欄';
}
// 金額只有寄賣/合約對帳有（跟 todayListBillingTotal_／buildAutoTask_ 同一套算法）；送貨目前沒有
// 單日訂單金額可用（見 buildAutoTask_ 註解），留空不是漏填。
function todayListRowAmount_(row) {
  const rec = (planData?.recommended || []).find(x => x.id === row.id);
  if (!rec) return '';
  const cb = consignmentBadge(rec);
  if (!cb.triggered) return '';
  return rec.consignmentStaleCount > 0 ? (rec.consignmentStaleTotal || 0) : (rec.consignmentAllTotal || 0);
}
// 「其他」這個目的如果有自填文字，存成「其他:xxx」（docs/今日清單_規格.md B0 的格式），
// 不是另外存一個獨立欄位——還原時 applyTodayPlanRows_ 會反過來拆解。
function todayListRowToPayload_(row, index) {
  const purposesOut = row.purposes.map(p => (p === '其他' && row.otherPurposeText) ? `其他:${row.otherPurposeText}` : p);
  return {
    seq: index + 1, storeId: row.id, name: row.name, address: row.address || '',
    types: row.typeTags, purposes: purposesOut, purposeNote: row.purposeNote || '',
    autoTask: row.autoTask || '', amount: todayListRowAmount_(row),
    stayMin: effectiveStayMin_(row), stayManual: row.manualStayMin != null,
    arrival: row.arrival != null ? fmtMin(row.arrival) : '',
    source: todayListRowSource_(row.id),
    confirmed: dayConfirmed, status: row.status || '待去', note: '',
  };
}
// 「移除」標記列：被①的✕拿掉的系統自動項目，不是今日清單目前的一員，只帶最基本的欄位讓
// GAS 整天覆蓋時不會把這個標記洗掉（見 removeTodayListRow_／removedAnchorMarkers_ 註解）。
function todayListRemovedRowPayload_(m) {
  return {
    seq: '', storeId: m.storeId, name: m.name || '', address: '',
    types: [], purposes: [], purposeNote: '', autoTask: '', amount: '',
    stayMin: '', stayManual: false, arrival: '',
    source: m.source || '錨點', confirmed: dayConfirmed, status: '移除', note: '',
  };
}

// 2026-11-19：field-sync-status（原「送到外勤模式」按鈕的位置）跟 today-save-status 共用同一個
// 存檔狀態機——這天的「今日行程」表存檔完成＝field-v2 讀得到最新資料，不是兩件事，不要另外維護
// 一套獨立的「有沒有送到外勤模式」狀態，徒增兜不起來的風險。
function renderTodaySaveStatus_(state) {
  const el = document.getElementById('today-save-status');
  const fieldEl = document.getElementById('field-sync-status');
  const now = new Date();
  const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  if (el) {
    el.classList.toggle('error', state === 'error');
    el.classList.toggle('dirty', state === 'dirty');
    if (state === 'dirty') { el.textContent = '未存檔'; el.onclick = null; }
    else if (state === 'saving') { el.textContent = '存檔中…'; el.onclick = null; }
    else if (state === 'saved') { el.textContent = `已存檔 ${hhmm}`; el.onclick = null; }
    else if (state === 'conflict') { el.textContent = '外勤模式有更新，合併中…'; el.onclick = null; }
    else if (state === 'error') { el.textContent = '⚠ 存檔失敗，點此重試'; el.onclick = () => flushTodayPlanSave_(); }
  }
  if (fieldEl) {
    fieldEl.classList.toggle('error', state === 'error');
    fieldEl.classList.toggle('dirty', state === 'dirty');
    if (state === 'dirty') { fieldEl.textContent = '尚未同步到外勤模式'; fieldEl.onclick = null; }
    else if (state === 'saving') { fieldEl.textContent = '同步外勤模式中…'; fieldEl.onclick = null; }
    else if (state === 'saved') { fieldEl.textContent = `已同步到外勤模式 ${hhmm}`; fieldEl.onclick = null; }
    else if (state === 'conflict') { fieldEl.textContent = '外勤模式有更新，合併中…'; fieldEl.onclick = null; }
    else if (state === 'error') { fieldEl.textContent = '⚠ 同步外勤模式失敗，點此重試'; fieldEl.onclick = () => flushTodayPlanSave_(); }
  }
}

// delayMs：預設 2000（既有行為不變，renderTodayList_ 結尾呼叫的就是這個預設值）。
// 2026-11-19 修（目的備註／其他文字原本完全沒有存檔路徑）：文字欄位逐字輸入要用短一點的
// debounce（見 setTodayNote_/setTodayOtherText_ 帶 800），不然等 2 秒使用者還在打字就先存一次
// 沒意義；這支本身只標記 dirty＋更新存檔狀態字，不呼叫 renderTodayList_()，不會重畫輸入框、
// 不會打斷游標——跟其他呼叫端（checkbox/停留分鐘/拖曳）共用同一顆 todaySaveTimer_，沿用既有
// 「單一在途保護」機制，沒有另開一套。
function scheduleTodayPlanSave_(delayMs) {
  todayPlanDirty_ = true;
  clearTimeout(todaySaveTimer_);
  renderTodaySaveStatus_('dirty');
  todaySaveTimer_ = setTimeout(() => { flushTodayPlanSave_(); }, delayMs || 2000);
}

// 2026-11-08：切頁/換日期/visibilitychange(hidden)/pagehide 前都要呼叫這支，立刻送出還沒存的
// 變更，不等 2 秒 debounce——實測抓到：①按✕移除某店後立刻切到本週，debounce 還沒跑完那次移除
// 就遺失了。已經有一次存檔在跑時沿用同一個 promise，不疊加送出第二次（疊加送出會造成兩次
// 存檔用不同的 clientUpdatedAt 互相衝突，見 syncTodayList_ 併發問題的教訓）。
// opts.useKeepalive：pagehide/visibilitychange(hidden) 這類「頁面可能馬上被砍掉」的時機用，
// fetch 用 keepalive:true 確保請求能在頁面卸載後繼續送完，但也因此沒辦法等/讀回應。
// 2026-11-19（修#1）：已經有存檔在跑時，不是單純回傳舊的 promise 就結束——如果這次呼叫是
// 因為「存檔送出之後、回應回來之前」又發生了新的離散動作（todayPlanDirty_ 這時會是 true，
// 因為 scheduleTodayPlanSave_ 剛被那個新動作重新標記過），要記下 todaySavePending_，等這次
// 存檔做完（.finally）立刻用當下最新的 todayList 補存一次，不會把那個新動作吞掉不管。
function flushTodayPlanSave_(opts) {
  clearTimeout(todaySaveTimer_);
  if (todaySavePromise_) {
    // 2026-11-19 修正（寫測試 harness 時抓到的真實邊界案例）：這裡原本是「todayPlanDirty_ 當下
    // 是 true 才記 pending」，但 todayPlanDirty_ 是共用的單一旗標——在途的那次存檔完成時，
    // 它的成功處理一律把 todayPlanDirty_ 設回 false，不管這段等待期間是不是又有新的離散動作
    // 進來過。如果用「當下的 dirty 值」判斷要不要補存，那個新動作有可能在存檔完成的那一刻
    // 被 dirty=false 蓋過去，變成「明明有新變動，卻沒有被送出」。所以只要「存檔進行中又被
    // 呼叫一次 flush」這件事本身發生，就記 pending——不管那一刻 dirty 是 true 是 false，
    // 都當作「可能有新東西，保險起見結束後再送一次」。多送一次內容相同的存檔是浪費但無害
    // （伺服器端整天覆蓋本來就是可重複執行的），比漏送掉一次異動安全得多。
    todaySavePending_ = true;
    return todaySavePromise_;
  }
  if (!todayPlanDirty_) return Promise.resolve();
  todaySavePromise_ = saveTodayPlanNow_(opts).finally(() => {
    todaySavePromise_ = null;
    if (todaySavePending_) {
      todaySavePending_ = false;
      todayPlanDirty_ = true; // 強制視為未存檔：剛才在途的存檔完成時可能已經把這個旗標清成
                               // false，但 pending 本身就代表「有別的呼叫端在等這次結束後補存」，
                               // 不能讓它被 dirty===false 擋下來、真正補送不出去。
      flushTodayPlanSave_(); // 補存：讀的是此刻的 todayList/lastTodayPlanUpdatedAt_，不是舊快照
    }
  });
  return todaySavePromise_;
}

// retryCount：衝突合併後的重試次數（見 mergeConflictAndRetry_），一般呼叫端不用帶。
async function saveTodayPlanNow_(opts, retryCount) {
  clearTimeout(todaySaveTimer_);
  renderTodaySaveStatus_('saving');
  const rows = todayList.map((row, i) => todayListRowToPayload_(row, i))
    .concat(removedAnchorMarkers_.map(todayListRemovedRowPayload_));
  const payload = { date: getPlanDate(), rows, clientUpdatedAt: lastTodayPlanUpdatedAt_ };
  if (TEST_MODE) payload.sheetName = '今日行程_TEST'; // 測試模式只寫測試分頁，不碰正式「今日行程」表
  if (opts && opts.useKeepalive) {
    // 2026-11-19（修#2）：原本 fetch(...) 完全沒人接，非同步失敗（請求送出後網路中斷/被瀏覽器
    // 丟棄）會變成沒人處理的 rejected promise，使用者毫無所覺，而且當時 todayPlanDirty_ 已經
    // 被清成 false，之後也不會再補存。現在分兩層判斷：
    //   - fetch() 這個呼叫本身同步丟錯（例如 URL 建構失敗）→ 請求根本沒送出，dirty 保持 true。
    //   - fetch() 呼叫本身沒丟錯（瀏覽器已經收下這個 keepalive 請求，放進背景佇列）→ 視為
    //     「確定送出」，dirty 才清成 false——跟原本「已經盡力送出，不能無限期卡住 UI」的精神一致，
    //     只是把「送出」跟「呼叫 fetch() 沒有同步出錯」這兩件事分清楚，不是無條件清。
    //   - 之後如果這個 fetch 的 promise 真的非同步 reject（送出後才失敗），接 .catch() 印出來；
    //     如果頁面這時候還活著（例如只是切到背景分頁，不是真的要關掉/F5），順便把 dirty 改回
    //     true、畫面改回「未存檔」，讓使用者切回分頁時至少看得到，下次有動作就會自然重試。
    let dispatched = false;
    try {
      fetch(WORKER + '/api/today-plan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload), keepalive: true,
      }).catch(e => {
        console.warn('keepalive 存檔的請求送出後失敗（頁面可能已經卸載，這裡的補救未必還能被看到）', e);
        todayPlanDirty_ = true;
        renderTodaySaveStatus_('error');
      });
      dispatched = true;
    } catch (e) {
      console.warn('keepalive 存檔送出失敗（fetch() 呼叫本身就丟錯，請求從未送出）', e);
    }
    if (dispatched) todayPlanDirty_ = false; // 只有確定送出去了才清，呼叫本身失敗則保持 dirty
    return;
  }
  try {
    const resp = await post('/api/today-plan', payload);
    if (resp.conflict) {
      await mergeConflictAndRetry_(resp.rows || [], retryCount || 0);
      return;
    }
    // GAS/Worker 回 200 但內容是 {success:false,...} 或 {error:...}（例如 action 不認得、GAS 端拒絕寫入）
    // 時，post() 本身不會丟例外（HTTP 狀態是 200），這裡要自己判斷，不然會誤顯示「已存檔」。
    if (!resp.success) throw new Error(resp.error || '存檔失敗（伺服器回應沒有 success）');
    lastTodayPlanUpdatedAt_ = resp.updatedAt || lastTodayPlanUpdatedAt_;
    captureSyncedIds_(); // 修#3：這次成功存檔的內容就是新的同步基準
    todayPlanDirty_ = false;
    renderTodaySaveStatus_('saved');
  } catch (e) {
    console.error('今日行程存檔失敗', e);
    renderTodaySaveStatus_('error'); // todayPlanDirty_ 保持 true，之後還會再試一次（點擊重試/下次切頁flush）
  }
}

// 2026-11-19（修#3）：conflict 代表「試算表上這天的資料比我這次存檔的基準更新」（通常是
// field-v2 改過某一列的狀態，見調查報告 §3(b)）——原本直接拿伺服器的 resp.rows 整包蓋過
// 本地畫面，使用者剛做的那個動作（這次存檔想寫入、但被拒絕的內容）就這樣悄悄消失。
// 改成：先用 lastSyncedIds_（上次確認跟伺服器同步時的基準）跟目前 todayList 的 id 比對，
// 算出「使用者這段時間自己新增/移除了哪些」，套用伺服器版本之後再把這些重新合併回去，
// 然後拿新的基準（伺服器剛回的 updatedAt）重新存一次——最多重試 MAX_CONFLICT_RETRY_ 次，
// 每次都還是衝突才真的放棄，顯示明顯的錯誤提示讓使用者自己決定。
// 2026-11-19 補（修#3 欄位層級）：上面那段只處理「店家增減」，對「本地跟伺服器都存在的店」是
// 整列信任伺服器版本——這會把使用者剛改的目的/備註/其他文字/手動停留分鐘蓋掉（見上次回報
// 的已知限制）。現在對這種「兩邊都有」的店，逐欄位比對本地目前值跟 lastSyncedFields_ 快照：
// 本地沒改（跟快照一樣）就沿用伺服器剛套用的值；本地改過（跟快照不一樣）就在套用伺服器版本
// 之後把本地值補回去，不管伺服器那邊是否也改了同一欄位都以本地（使用者剛輸入的）為準——如果
// 伺服器那邊也真的改了同一欄位，另外 console.warn 記錄，不要悄悄蓋過去沒有留痕跡。
// 狀態（待去/已到/完成/跳過）跟預計到達刻意不比較、永遠用伺服器剛套用的值——那兩個是外勤模式
// 在改的，本地的「狀態」欄位只是上次讀到的舊快照，拿本地去蓋伺服器才是真正的資料遺失。
const MAX_CONFLICT_RETRY_ = 2;
async function mergeConflictAndRetry_(serverRows, retryCount) {
  renderTodaySaveStatus_('conflict');
  const localIds = new Set(todayList.map(r => r.id));
  const addedLocallyIds = [...localIds].filter(id => !lastSyncedIds_.has(id));
  const removedLocallyIds = [...lastSyncedIds_].filter(id => !localIds.has(id));
  const overlapIds_ = [...localIds].filter(id => lastSyncedIds_.has(id)); // 兩邊都存在的店
  // 連同這些列目前的完整畫面狀態（目的/備註/手動停留分鐘…）一起留著，合併回去時直接拿這份用，
  // 不是只記 id、之後用預設值重建一次（否則使用者剛改的備註/目的會在合併後消失）。
  const addedRowsSnapshot = addedLocallyIds.map(id => todayList.find(r => r.id === id)).filter(Boolean);
  const removedMarkersSnapshot = removedAnchorMarkers_.slice(); // 這次原本要一起送出的「移除」標記

  // 「兩邊都存在」的店：先記住合併前的同步基準快照跟本地目前值，等 applyTodayPlanRows_ 套用完
  // 伺服器版本之後才能比較「本地改過哪些欄位」跟「伺服器是不是也改了」。
  const preMergeSyncedFields_ = new Map(overlapIds_.map(id => [id, lastSyncedFields_.get(id)]));
  // id -> { changed: Set(改過的欄位名), purposes/purposeNote/otherPurposeText/manualStayMin/
  //          purposesTouched（本地目前值，合併後只用 changed 裡列到的那幾個欄位去覆蓋）, snapshot }
  const localFieldEdits_ = new Map();
  overlapIds_.forEach(id => {
    const localRow = todayList.find(r => r.id === id);
    const synced = preMergeSyncedFields_.get(id);
    if (!localRow || !synced) return; // 找不到快照（理論上不會，防禦性略過，交給伺服器版本）
    const current = snapshotRowFields_(localRow);
    const changed = diffFields_(current, synced);
    if (changed.size) {
      localFieldEdits_.set(id, {
        changed,
        purposes: localRow.purposes.slice(), purposeNote: localRow.purposeNote,
        otherPurposeText: localRow.otherPurposeText, manualStayMin: localRow.manualStayMin,
        purposesTouched: localRow.purposesTouched, snapshot: current,
      });
    }
  });

  pushSuppressAutoSave_(); // 合併過程不要讓中間任何一次 render 誤觸發 debounce 存檔，最後我們自己決定何時存
  try {
    await applyTodayPlanRows_(serverRows); // 先套用伺服器現在的版本當新基準（內部會重設 lastSyncedIds_/lastSyncedFields_）

    addedRowsSnapshot.forEach(row => {
      if (todayList.some(r => r.id === row.id)) return; // 伺服器版本剛好也有，不用再補
      todayList.push(row);
      if (!anchors.some(a => a.id === row.id)) selectedCol2Ids.add(row.id); // 不是錨點來源就補回②欄確認狀態
    });
    removedLocallyIds.forEach(id => {
      const ai = anchors.findIndex(a => a.id === id);
      if (ai >= 0) anchors.splice(ai, 1);
      selectedCol2Ids.delete(id);
      todayList = todayList.filter(r => r.id !== id);
    });
    removedMarkersSnapshot.forEach(m => {
      if (!removedAnchorMarkers_.some(x => x.storeId === m.storeId)) removedAnchorMarkers_.push(m);
    });

    // 欄位層級合併：把使用者這段時間真的改過的欄位逐一補回去——只動 edit.changed 裡列到的
    // 那幾個欄位，其他欄位維持 applyTodayPlanRows_ 剛套用的伺服器值，不是整列四個欄位一起蓋
    // （例如本地只改了備註，伺服器同一列改了手動停留分鐘，合併後備註用本地、停留分鐘用伺服器，
    // 不會因為備註不同就連同沒改過的停留分鐘也一起用舊的本地值蓋掉伺服器剛更新的結果）。
    // 狀態／預計到達完全不在 edit.changed 可能的範圍內，不會被這裡動到。
    localFieldEdits_.forEach((edit, id) => {
      const row = todayList.find(r => r.id === id);
      if (!row) return; // overlap id 理論上套用後一定還在，防禦性略過
      const serverNow = snapshotRowFields_(row);
      const synced = preMergeSyncedFields_.get(id);
      // 只針對「本地改過的那幾個欄位」檢查伺服器是否也改了同一欄位——本地沒動過的欄位本來
      // 就不會進到這個迴圈的覆蓋動作，伺服器改不改都不算衝突，不用警告。
      const changedByServerToo_ = synced ? [...edit.changed].filter(key => serverNow[key] !== synced[key]) : [];
      if (changedByServerToo_.length) {
        // 本地跟伺服器在同一次同步間都改了同一個欄位——以本地（使用者剛輸入的）為準，
        // 但留下痕跡，不要悄悄蓋過去，方便事後追查是不是真的漏掉了伺服器那邊的異動。
        console.warn(
          `合併衝突：「${row.name || id}」的 ${changedByServerToo_.join('、')} 欄位在本地跟伺服器都改過，以本地（使用者剛輸入的）為準`,
          { id, fields: changedByServerToo_, local: edit.snapshot, server: serverNow }
        );
      }
      if (edit.changed.has('purposes')) {
        row.purposes = edit.purposes;
        row.purposesTouched = edit.purposesTouched; // 只在 purposes 真的被本地覆蓋時才一併帶回
      }
      if (edit.changed.has('purposeNote')) row.purposeNote = edit.purposeNote;
      if (edit.changed.has('otherPurposeText')) row.otherPurposeText = edit.otherPurposeText;
      if (edit.changed.has('manualStayMin')) row.manualStayMin = edit.manualStayMin;
    });

    renderAnchors(); renderRecommend(); renderSuggest();
    if (viewMode === 'map') renderMap();
    recomputeTodayListTimes_();
  } finally {
    popSuppressAutoSave_();
  }

  if (retryCount >= MAX_CONFLICT_RETRY_) {
    todayPlanDirty_ = true;
    renderTodaySaveStatus_('error');
    toast(`外勤模式有更新，已合併你剛才的變更，但重試 ${MAX_CONFLICT_RETRY_} 次後仍衝突，請點擊存檔狀態重試`, 6000);
    return;
  }

  toast('外勤模式有更新，已合併你剛才的變更', 4000);
  todayPlanDirty_ = true;
  await saveTodayPlanNow_(undefined, retryCount + 1); // 用合併後、剛從伺服器拿到的新基準重新存檔
}

// 點導覽列連結／換日期前呼叫：有未存變更就先 flush，最多等 8 秒；逾時或失敗都照常導覽
// （留 console.warn），不能讓使用者被卡在原地動彈不得。2026-11-09：原本5秒，實測GAS單次
// 回應偶爾就要5秒左右（這張表剛啟用、流量還不穩），拉寬到8秒給緩衝空間。
async function flushBeforeNavigate_() {
  if (!todayPlanDirty_ && !todaySavePromise_) return;
  try {
    await Promise.race([
      flushTodayPlanSave_(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('存檔逾時(8秒)')), 8000)),
    ]);
  } catch (e) {
    console.warn('切頁前存檔沒能在時限內完成，照常跳頁', e);
  }
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('#app-nav a[href]');
  if (!a) return;
  if (!todayPlanDirty_ && !todaySavePromise_) return; // 沒有要存的，讓連結照正常方式導覽
  e.preventDefault();
  const href = a.href;
  flushBeforeNavigate_().then(() => { location.href = href; });
}, true);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushTodayPlanSave_({ useKeepalive: true });
});
window.addEventListener('pagehide', () => { flushTodayPlanSave_({ useKeepalive: true }); });

// 2026-11-19（修#2）：F5／關閉分頁本來完全沒有攔截，只能靠 pagehide 之後的 keepalive 盡力送出
// （調查報告 §3(a) 確認過這段跟重新整理的 GET 之間有競態）。加 beforeunload：還有未存的變更
// 或正在存檔中，就跳出瀏覽器原生的「確定要離開？」提示，給使用者機會按取消、等存檔做完再走——
// 不是取代 keepalive 這個最後手段，是在那之前多一道「使用者自己決定要不要等」的機會。
// 瀏覽器基於安全理由不給自訂提示文字，e.returnValue 只是觸發機制，不是真的會顯示這段文字。
window.addEventListener('beforeunload', (e) => {
  if (!todayPlanDirty_ && !todaySavePromise_) return;
  e.preventDefault();
  e.returnValue = '今日清單還有變更尚未存檔完成，確定要離開嗎？';
});

// 系統自動帶入的項目（送貨/待追蹤/本週排/寄賣對帳）被①的✕拿掉時記在這裡（見 removeTodayListRow_），
// 下次存檔要把它們也送出去（狀態=移除），不然 GAS 整天覆蓋會把之前存的「移除」標記一起洗掉，
// 等於使用者按過的✕又在下次重新整理時復活。每次還原/衝突重整都會用伺服器的權威資料整組換新，
// 不是累加——見 applyTodayPlanRows_。
let removedAnchorMarkers_ = [];
// 跟 worker.js 的 TODAY_PLAN_ANCHOR_SOURCES_、gas-backend/PlannerSetup.js 的
// PLANNER_TODAY_PLAN_SOURCES 同一組「錨點類」來源值（沒有共用模組，三處各自維護同一份常數）。
const TODAY_PLAN_ANCHOR_SOURCES_ = ['錨點', '送貨', '待追蹤', '本週排', '寄賣對帳'];

// 把一組「今日行程」列（API 回來的英文鍵物件，不管是 /api/plan 的 todayPlanRows+
// todayPlanRemovedIds、/api/today-plan 的 rows，還是存檔衝突回傳的 rows，三處欄名都一致）套回
// 畫面狀態：selectedCol2Ids／todayList 每列的目的/備註/手動停留/到達時間/
// 順序／removedAnchorMarkers_。跟 syncTodayList_() 不一樣的地方：這支是「用伺服器的資料蓋過
// 畫面」（初次還原、衝突重新整理都是這個情境），不是「畫面變動後重新合成」。
// allRows 可能混著狀態＝「移除」的列（衝突回傳就是整包都有）——這些不是活躍的今日清單項目，
// 先濾掉再處理，另外收進 removedAnchorMarkers_。
async function applyTodayPlanRows_(allRows) {
  const rows = allRows.filter(r => r.status !== '移除');
  removedAnchorMarkers_ = allRows.filter(r => r.status === '移除')
    .map(r => ({ storeId: r.storeId, name: r.name, source: r.source }));

  // 2026-11-19：'選區' 這個來源值是舊版「選這區自動勾選」留下的既有資料（修#3/#4 之前存進
  // 「今日行程」表的列），不是前端的新邏輯會再產生——但既有資料裡這些列本來就是使用者確認過
  // 要去的店（即使當初是系統幫忙勾的），還原時一樣要算進 selectedCol2Ids，不能把舊資料憑空丟掉。
  selectedCol2Ids = new Set();
  rows.forEach(r => {
    if (!r.storeId) return;
    if (r.source === '第②欄' || r.source === '選區') selectedCol2Ids.add(r.storeId);
  });
  lastTodayPlanUpdatedAt_ = rows.reduce((max, r) => (r.updatedAt && (!max || r.updatedAt > max)) ? r.updatedAt : max, null);
  dayConfirmed = rows.some(r => r.confirmed);

  // 「建議」清單只跟目前選區＋目前已確認清單有關，不是存檔欄位——selectedCol2Ids 剛還原完成，
  // 現在才能正確排除掉已經確認的店，不會讓剛讀回來的確認項目又被標成「建議」。
  recomputeRegionSuggestions_();
  renderRegionOverview();

  pushSuppressAutoSave_();
  try {
    await syncTodayList_(); // 用剛還原好的 anchors/selectedCol2Ids 建出基本列（自動預選目的、規則狀態…）
    const byId = {}; rows.forEach(r => { if (r.storeId) byId[r.storeId] = r; });
    todayList.forEach(row => {
      const r = byId[row.id];
      if (!r) return;
      if (r.purposes && r.purposes.length) {
        row.purposesTouched = true;
        row.purposes = r.purposes.map(p => p.startsWith('其他:') ? '其他' : p);
        const otherEntry = r.purposes.find(p => p.startsWith('其他:'));
        row.otherPurposeText = otherEntry ? otherEntry.slice(3) : '';
      }
      row.purposeNote = r.purposeNote || '';
      if (r.stayManual && r.stayMin) row.manualStayMin = parseInt(r.stayMin, 10) || null;
      row.arrival = parseHHMM_(r.arrival);
      row.status = r.status || '待去';
    });
    const seqOf = id => { const r = byId[id]; return r && r.seq != null ? (parseInt(r.seq, 10) || 9999) : 9999; };
    todayList.sort((a, b) => seqOf(a.id) - seqOf(b.id));
    renderRecommend(); // ②欄checkbox的勾選狀態要重畫才看得到還原結果
    // 這個 renderTodayList_() 一定要在還是「關閉自動存檔」的狀態下呼叫，不然還原剛讀進來的
    // 資料就會立刻觸發一次存檔（重寫一份內容完全相同的資料，浪費又多餘）。
    renderTodayList_();
  } finally {
    popSuppressAutoSave_();
  }
  // 修#3：這裡剛套用完「伺服器現在的版本」，此刻 todayList 的 id 集合就是新的同步基準——
  // 不管是開頁還原還是衝突合併呼叫這支，都要在這裡重新記一次，下次衝突才能正確分辨
  // 「使用者這段時間又自己新增/移除了哪些」。
  captureSyncedIds_();
}

// 開頁/切日期：還原②勾選（含選區自動勾）、拜訪目的、目的備註、手動停留分鐘、拖曳後的順序、
// 出發時間——全部從 planData.todayPlanRows（今日行程表）跟 KV 的 savedDepartMin/savedOrderMode
// 還原，不再是空的（2026-11-06 之前的已知問題：今天頁切到本週再回來，這些全部會遺失）。
async function restoreTodayPlanState_(plan) {
  pushSuppressAutoSave_();
  try {
    todayList = [];
    orderMode = 'unordered';
    lastRouteLegMinutes = null; lastRouteResolvedIds = null; lastRouteStopIds = null; lastRouteTotalKm = null;
    window._confirmedRoute = null;
    departMin = typeof plan.savedDepartMin === 'number' ? plan.savedDepartMin : START_MIN;
    // 2026-11-19 修正：savedRegion 現在 worker.js 兩邊都會讀寫了（POST handleSavePlan 已補上
    // `if (region) existing.region = region;`），但 KV 裡的值完全是「上次送進去是什麼就是什麼」，
    // 不會跟著 planner-config.js 的 regionGroups 定義同步檢查——手動改過 KV、測試資料殘留、
    // 或之後 regionGroups 改了 key 名稱，都可能讓 savedRegion 存著一個現在根本不存在的分區
    // key（實際發生過："__TEST_REGION_VERIFY__" 被誤寫進今天的 plan:{date}）。這種值如果直接
    // 套用，filterMode 會變成 'region' 但 renderRecommend() 用
    // `list.filter(item => item.region === selectedRegionKey)` 篩，篩到的候選店永遠是 0 家
    // （沒有任何店的 region 會等於一個不存在的 key），畫面看起來像「全部候選店消失」，使用者
    // 完全看不出原因。套用前先比對 planData.todayRegions（這次回應實際算出來的分區清單，
    // key 來源跟 planner-config.js 的 regionGroups 一致）存不存在這個 key，不存在就當作沒選過，
    // 不要盲目相信 KV 裡存的值。
    const validRegionKeys_ = new Set((plan.todayRegions || []).map(g => g.key));
    if (plan.savedRegion && validRegionKeys_.has(plan.savedRegion)) {
      selectedRegionKey = plan.savedRegion;
    } else {
      if (plan.savedRegion) {
        console.warn('savedRegion 不是目前有效的分區 key，已忽略並重置成「全部」', plan.savedRegion, [...validRegionKeys_]);
      }
      selectedRegionKey = null;
    }
    filterMode = selectedRegionKey ? 'region' : 'all';

    // 2026-11-27 使用者實測抓到：worker.js /api/plan 回的 anchors 已經正確排除「移除」標記的店，
    // 但 loadPlan() 在這之前呼叫的 mergeWeeklyAnchors() 會直接從 /api/followups 重新抓「今天到期
    // 的待追蹤」加進 anchors，完全不知道這家店剛被使用者用①的✕標記移除過——結果移除標記在
    // 伺服器端是對的，syncTodayList_() 卻又因為 anchors 裡混進這筆而把它加回今日清單。這裡是
    // 最後一道防線：不管是哪個來源把已移除的 id 混進 anchors，重建清單前都先剔除。
    const removedIdSet_ = new Set((plan.todayPlanRemovedIds || []).map(m => m.storeId));
    if (removedIdSet_.size) anchors = anchors.filter(a => !removedIdSet_.has(a.id));

    const removedAsRows = (plan.todayPlanRemovedIds || []).map(m => ({ ...m, status: '移除' }));
    await applyTodayPlanRows_([...(plan.todayPlanRows || []), ...removedAsRows]);

    // orderMode 本身存在 KV（跟 region 同一個 plan:{date} key），不是今日行程表的欄位——今日行程
    // 表有存每列的「預計到達」，所以即使沒有車程資料（lastRouteLegMinutes 沒有持久化），也能直接
    // 顯示還原的到達時間，不用重新打一次 Routes API，只是之後改任何時間相關設定都要重新計算。
    if ((plan.savedOrderMode === 'route' || plan.savedOrderMode === 'manual') && todayList.some(r => r.arrival != null)) {
      orderMode = plan.savedOrderMode;
      // applyTodayPlanRows_ 剛剛已經畫過一次（orderMode 還是舊值），這裡 orderMode 改了要再畫一次
      // 讓小計列的「依路線順序／順序已手動調整」字樣對得上，一樣要在關閉自動存檔的狀態下做。
      renderTodayList_();
    }
  } finally {
    popSuppressAutoSave_();
  }
}

// 「確定今天的行程」：立即存檔（不等 debounce）＋整天標已確定。不綁計算路線成不成功，
// 有清單就能按（跟外勤模式對接是階段三的事，這裡先只處理存檔跟標記）。
async function confirmTodayPlan() {
  if (!todayList.length) return;
  const btn = document.getElementById('btn-confirm-route');
  await withBusy(btn, '存檔中…', async () => {
    dayConfirmed = true;
    todayPlanDirty_ = true; // 確保走 flushTodayPlanSave_ 的單一在途存檔保護，不會跟debounce疊加送出
    await flushTodayPlanSave_();
    toast('已確定今天的行程');
  });
}

// 只重算時間，不重打 Routes API（除非是手動拖曳剛發生，見 recalcManualOrderTimes_ 那支才會打）——
// 用上次拿到的每段車程分鐘數（lastRouteLegMinutes）配合目前的出發時間/各站停留分鐘重新往下推。
// 用 lastRouteResolvedIds（Set）判斷哪些站真的有車程資料可以消耗，不是用「前N個」這種位置假設——
// 手動拖曳模式下，定位失敗的站可能出現在清單中間，不能假設它們都在最後面。
function todayListFinishMin_() {
  let cum = departMin;
  let legIdx = 0;
  todayList.forEach(row => {
    if (!lastRouteResolvedIds.has(row.id)) { row.arrival = null; return; }
    cum += lastRouteLegMinutes[legIdx++];
    row.arrival = Math.round(cum);
    cum += effectiveStayMin_(row);
  });
  return Math.round(cum + lastRouteLegMinutes[legIdx]);
}
let lastComputedFinishMin_ = null; // renderTodayListSummary_ 顯示用，跟 #finish-time-value 同一個數字來源
function recomputeTodayListTimes_() {
  const finishEl = document.getElementById('finish-time-value');
  if (!lastRouteLegMinutes || !lastRouteResolvedIds || !todayList.length) {
    todayList.forEach(row => { row.arrival = null; });
    lastComputedFinishMin_ = null;
    if (finishEl) { finishEl.textContent = '—'; finishEl.classList.remove('late'); }
    renderTodayList_();
    return;
  }
  const homeArrival = todayListFinishMin_();
  lastComputedFinishMin_ = homeArrival;
  if (finishEl) { finishEl.textContent = fmtMin(homeArrival); finishEl.classList.toggle('late', homeArrival > 17 * 60 + 30); }
  renderTodayList_();
}

async function removeTodayListRow_(id) {
  // 系統自動帶入的項目（送貨/待追蹤/本週排/寄賣對帳）被拿掉時要留「移除」標記，下次存檔才不會
  // 被 Worker 的 /api/plan 又當成預設值重新加回來；使用者自己手動勾的②項目（第②欄/選區）
  // 直接刪除那一列就好，不用留標記（規格 2026-11-06 補充第2點）。
  const row = todayList.find(r => r.id === id);
  const source = todayListRowSource_(id);
  if (row && TODAY_PLAN_ANCHOR_SOURCES_.includes(source)) {
    removedAnchorMarkers_.push({ storeId: id, name: row.name, source });
  }

  const ai = anchors.findIndex(a => a.id === id);
  if (ai >= 0) anchors.splice(ai, 1);
  selectedCol2Ids.delete(id);
  todayList = todayList.filter(r => r.id !== id);
  renderAnchors(); renderRecommend(); renderSuggest();
  if (viewMode === 'map') renderMap();
  invalidateRouteIfStopsChanged_();
  recomputeTodayListTimes_(); // 同步執行，結尾已經呼叫過 renderTodayList_()→scheduleTodayPlanSave_()
  await flushTodayPlanSave_(); // 修#1：✕ 是離散動作，立即存檔，不等 2 秒 debounce
  toast('已從今日清單移除');
}

// 其他文字完全沒有路徑寫進「今日行程」表，重新整理就不見了（todayListRowToPayload_ 其實有把
// purposeNote/otherPurposeText 包進 payload，欄位本身沒問題，純粹是沒人去觸發存檔）。

// 手動拖曳改順序：HTML5 原生 drag/drop，委派在 document.body（今日清單整段 innerHTML 重繪也不用
// 重新綁定）。放下後立刻調整 todayList 陣列順序＋標記 orderMode='manual'、清空到達時間（舊的
// 車程數字跟新順序對不上，顯示錯的時間比不顯示更糟），畫面先顯示新順序但時間是「—」。
// 停手 1 秒後（debounce，見 scheduleManualRecalc_）才真的打一次 Routes API（optimizeWaypointOrder:
// false，不能重排）拿新順序各段的車程分鐘數回來補時間——連續拖好幾次只會在停手後打一次，不是
// 每放下一次就打一次。
let tlDragId_ = null;
let tlManualRecalcTimer_ = null;
function reorderTodayListManually_(targetId) {
  if (!tlDragId_ || tlDragId_ === targetId) return;
  const fromIdx = todayList.findIndex(r => r.id === tlDragId_);
  const toIdx = todayList.findIndex(r => r.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = todayList.splice(fromIdx, 1);
  todayList.splice(toIdx, 0, moved);
  orderMode = 'manual';
  savePlanState(); // orderMode 存在 KV plan:{date}，順序本身存在今日行程表（renderTodayList_ 的 scheduleTodayPlanSave_）
  lastRouteLegMinutes = null;
  lastRouteResolvedIds = null;
  // 2026-11-05 修正：重算期間（debounce 1 秒＋Routes API 回應，大約1~4秒）「預估收工」不能停在
  // 拖曳前的舊數字——recomputeTodayListTimes_() 在 lastRouteLegMinutes 是 null 時會把
  // #finish-time-value 清成「—」，原本這裡只呼叫 renderTodayList_()，沒有同步清掉那個欄位。
  recomputeTodayListTimes_();
  scheduleManualRecalc_();
}
function scheduleManualRecalc_() {
  clearTimeout(tlManualRecalcTimer_);
  tlManualRecalcTimer_ = setTimeout(() => { recalcManualOrderTimes_(); }, 1000);
}

// 用「目前 todayList 的順序」（不重排）打一次 Routes API 拿車程，只為了算時間——跟 calcRoute()
// 的差別：intermediates 不設 optimizeWaypointOrder（固定 false），且不會重新排 todayList 的順序
// （定位失敗的站就留在原本的位置，不像 calcRoute 那樣挪到最後面，因為手動模式下順序是使用者自己
// 排的，不該因為某一站定位失敗就被我們動位置）。
async function recalcManualOrderTimes_() {
  if (!todayList.length) return;
  const warnEl = document.getElementById('today-list-warnings');
  const btn = document.getElementById('btn-calc-route');
  if (warnEl) warnEl.innerHTML = '';
  if (btn) { btn.disabled = true; btn.textContent = '重算時間中…'; }
  try {
    await loadAllPharmacies();
    const locations = await Promise.all(todayList.map(row => resolveStoreLocation_(row.id, row.name)));
    const warnings = [];
    const resolved = [];
    todayList.forEach((row, i) => {
      const loc = locations[i];
      row.locateMethod = loc.method;
      if (loc.lat && loc.lng) resolved.push({ row, loc });
      else if (loc.warning) warnings.push(loc.warning);
    });
    if (!resolved.length) throw new Error('所有站點都定位失敗，無法重算時間');

    const intermediates = resolved.map(r => ({ location: { latLng: { latitude: r.loc.lat, longitude: r.loc.lng } } }));
    const routeResp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GMAPS_KEY,
        'X-Goog-FieldMask': 'routes.legs.distanceMeters,routes.legs.duration',
      },
      body: JSON.stringify({
        origin: { address: ORIGIN_ADDR }, destination: { address: DEST_ADDR },
        intermediates, travelMode: 'DRIVE', optimizeWaypointOrder: false, // 手動順序，不能重排
      }),
    });
    if (!routeResp.ok) {
      const errData = await routeResp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${routeResp.status}`);
    }
    const routeData = await routeResp.json();
    if (!routeData.routes?.length) throw new Error('找不到路線');
    const legs = routeData.routes[0].legs;
    lastRouteTotalKm = Math.round(legs.reduce((sum, leg) => sum + leg.distanceMeters, 0) / 1000);
    lastRouteLegMinutes = legs.map(leg => parseInt(leg.duration) / 60);
    lastRouteResolvedIds = new Set(resolved.map(r => r.row.id));
    lastRouteStopIds = todayList.map(r => r.id).sort().join(',');

    recomputeTodayListTimes_();
    window._confirmedRoute = todayList.map((row, i) => ({
      id: row.id, name: row.name, isAnchor: anchors.some(a => a.id === row.id),
      seq: i + 1, arrival: row.arrival, locateMethod: row.locateMethod,
    }));
    renderMapRoutePanel();
    if (viewMode === 'map') renderMap();
    if (warnEl && warnings.length) {
      warnEl.innerHTML = `<div class="route-warning-banner">${warnings.map(w => escapeHtml(w)).join('<br>')}</div>`;
    }
  } catch (e) {
    if (warnEl) warnEl.innerHTML = `<div class="empty-hint">重算時間失敗：${escapeHtml(e.message)}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '計算路線'; }
  }
}

// 「計算路線」按鈕的實際進入點：手動調整過順序時先問使用者要保留順序只重算時間、還是整個

// 距最近錨點的直線距離——沒有錨點或查不到座標時顯示「—」，不強行猜座標（跟 withinAnchorRadius 同一套保守原則）。
function distanceToNearestAnchorText(id) {
  const byId = {}; (allPharmaciesCache || []).forEach(p => { byId[p.id] = p; });
  const target = byId[id];
  if (!target?.lat || !target?.lng || !anchors.length) return '—';
  let min = Infinity;
  anchors.forEach(a => {
    const ph = byId[a.id];
    if (!ph?.lat || !ph?.lng) return;
    const d = haversineKm(target.lat, target.lng, ph.lat, ph.lng);
    if (d < min) min = d;
  });
  return isFinite(min) ? (Math.round(min * 10) / 10) + ' 公里' : '—';
}

    html = `<div class="map-info-card">

        <button class="map-info-btn" data-action="open-drawer" data-id="${escapeHtml(data.id)}">看檔案</button>
        <button class="map-info-btn" data-action="remove-anchor" data-id="${escapeHtml(data.id)}">移除</button>
      </div>
    </div>`;
  } else {

    const checked = selectedCol2Ids.has(data.id);
    const statusLine = isNewStore ? `階段：${escapeHtml(item.stage || '—')}` : `分級：${escapeHtml(item.tier || '—')}`;
    html = `<div class="map-info-card">
      <div class="map-info-name">${escapeHtml(data.name)}</div>

      <div class="map-info-actions">

        <button class="map-info-btn" data-action="open-drawer" data-id="${escapeHtml(data.id)}">看檔案</button>
      </div>
    </div>`;

  srMapInfoWindow.setContent(html);
  srMapInfoWindow.open({ map: srMap, anchor: marker });
}

async function renderMap() {
  await Promise.all([loadGoogleMapsSdk(), loadAllPharmacies()]);
  if (!srMap) {
    srMap = new google.maps.Map(document.getElementById('sr-map'), {
      center: { lat: 25.065, lng: 121.658 }, zoom: 11,
      mapTypeControl: false, streetViewControl: false,
      styles: [{ featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }],
    });
    srMapInfoWindow = new google.maps.InfoWindow();
  }
  srMapInfoWindow.close();
  srMapMarkers.forEach(m => m.setMap(null)); srMapMarkers = [];
  srMapCircles.forEach(c => c.setMap(null)); srMapCircles = [];
  if (srMapPolyline) { srMapPolyline.setMap(null); srMapPolyline = null; }

  const route = window._confirmedRoute || null;
  const seqById = {}; (route || []).forEach(s => { seqById[s.id] = s.seq; });

  // ①②③ 要畫的店統一先定位一次（跟 calcRoute 共用 resolveStoreLocation_，新店/只有地址的店
  // 這裡也畫得出來；查過的存在 geocodeCache_，同一家店不會重複打 API，2026-11-04 使用者要求）。
  const visible = visibleRecommendList();
  const nameById_ = {};
  anchors.forEach(a => { nameById_[a.id] = a.name; });
  visible.forEach(item => { nameById_[item.id] = item.name; });
  (planData?.recommended || []).forEach(item => { if (!nameById_[item.id]) nameById_[item.id] = item.name; });
  const neededIds_ = new Set([...anchors.map(a => a.id), ...selectedCol2Ids, ...visible.map(item => item.id)]);
  const locById = {};
  await Promise.all([...neededIds_].map(async id => { locById[id] = await resolveStoreLocation_(id, nameById_[id] || id); }));

  const bounds = new google.maps.LatLngBounds();
  let anyBounds = false;
  function extend(lat, lng) { bounds.extend({ lat, lng }); anyBounds = true; }

  // ① 錨點：28px 深色圓、白色站號（還沒計算路線前沒有站號）＋ 2 公里範圍圈
  anchors.forEach(a => {
    const loc = locById[a.id];
    if (!loc?.lat || !loc?.lng) return;
    const marker = new google.maps.Marker({
      position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: a.name, zIndex: 20,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: cssVar('--sr-ink'), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
      label: seqById[a.id] ? { text: String(seqById[a.id]), color: cssVar('--sr-on-dark'), fontSize: '11px', fontWeight: 'bold' } : null,
    });
    marker.addListener('click', () => openMapInfo(marker, { id: a.id, name: a.name, kind: 'anchor', anchorMeta: a }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
    // 2 公里範圍圈：DESIGN.md 寫虛線，google.maps.Circle 不支援虛線樣式（要畫虛線得改用 Polygon
    // 近似圓形並掛 icons，複雜度高很多）——這次先用純色細圈代替，保守簡化，之後要再精緻化再改（WORKLOG 記錄）。
    const circle = new google.maps.Circle({
      map: srMap, center: { lat: loc.lat, lng: loc.lng }, radius: RADIUS_KM * 1000,
      strokeColor: cssVar('--sr-primary'), strokeOpacity: 0.8, strokeWeight: 2,
      fillColor: cssVar('--sr-primary-tint'), fillOpacity: 0.12, clickable: false,
    });
    srMapCircles.push(circle);
  });

  // ② 補的站：已勾選加入路線、但不是錨點的店，28px primary 色圓
  const visibleById = {}; visible.forEach(x => { visibleById[x.id] = x; });
  selectedCol2Ids.forEach(id => {
    const loc = locById[id];
    if (!loc?.lat || !loc?.lng) return;
    const item = visibleById[id] || (planData?.recommended || []).find(x => x.id === id);
    const marker = new google.maps.Marker({
      position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: item?.name || id, zIndex: 15,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: cssVar('--sr-primary'), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
      label: seqById[id] ? { text: String(seqById[id]), color: cssVar('--sr-on-dark'), fontSize: '11px', fontWeight: 'bold' } : null,
    });
    marker.addListener('click', () => openMapInfo(marker, { id, name: item?.name || id, kind: 'selected', item }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
  });

  // ③ 候選店（清單目前顯示、尚未勾選）：14px 小圓，正式客戶依 4.4 倍數分級上色，開發中空心圓
  visible.forEach(item => {
    if (selectedCol2Ids.has(item.id)) return; // ②已經畫過
    const loc = locById[item.id];
    if (!loc?.lat || !loc?.lng) return;
    const isNewStore = item.type === 'new-store';
    const icon = isNewStore
      ? { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: cssVar('--sr-bg'), fillOpacity: 1, strokeColor: cssVar('--sr-ink'), strokeWeight: 2 }
      : { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: cssVar(ratioColorVar(ratioTierOf(item.ratio))), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1 };
    const marker = new google.maps.Marker({ position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: item.name, icon, zIndex: 10 });
    marker.addListener('click', () => openMapInfo(marker, { id: item.id, name: item.name, kind: 'candidate', item }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
  });

  // ④ 路線線：直線段連接目前已算好的站點順序，不是實際路網線（不解析 Routes API 回傳的
  // encoded polyline，避免多引入 Maps JavaScript 的 geometry library，保守簡化，WORKLOG 記錄）
  if (route && route.length > 1) {
    const path = route.map(s => { const loc = locById[s.id]; return loc?.lat && loc?.lng ? { lat: loc.lat, lng: loc.lng } : null; }).filter(Boolean);
    if (path.length > 1) {
      srMapPolyline = new google.maps.Polyline({ path, geodesic: true, strokeColor: cssVar('--sr-primary'), strokeOpacity: 0.9, strokeWeight: 4, map: srMap });
    }
  }

  if (anyBounds) srMap.fitBounds(bounds, 60);
  renderMapRoutePanel();
}

window.SRNav.loadBadges();

// 2026-11-04 使用者要求修正：原本 calcRoute() 只查 /pharmacies（正式客戶表），新店不在那張表
// 就直接掉進「只用店名」查 Geocoding API——這把 GMAPS_KEY 設了 HTTP referrer 限制，Geocoding
// API 這類「伺服器端」API 一律拒絕 referrer 限制的 key（不管誰呼叫都一樣，見下面 geocodeQuery_
// 註解），所以舊版 geocodeStore_() 其實從來沒有成功查過，一律落入查無結果的 fallback（直接把
// 店名字串當地址丟給 Routes API），是 Routes API 自己內部解析地址字串時選錯城市（查到外縣市
// 同名藥局，例如「專心藥局」），不是我們自己查到錯的結果。統一定位邏輯：①客戶表緯度經度
// （直接信任，這張表本身的資料品質由下面的「只讀檢查報告」另外處理，不在這裡驗證）→②地址
// （客戶表 or planData.recommended 新店項目，哪裡有地址就用哪裡；地址開頭沒有縣市就自動補
// 「縣市＋行政區」）→③最後才用店名。②③都要打 Places API (New) 拿到實際座標，並檢查是否落在
// 服務範圍內（24.6~25.35, 120.9~122.0），超出範圍或查無結果就回傳 warning，呼叫端
// （calcRoute/renderMap）負責不使用這個結果。calcRoute()／renderMap() 共用同一套，不要各自寫一份。
const SERVICE_AREA_BOUNDS_ = { minLat: 24.6, maxLat: 25.35, minLng: 120.9, maxLng: 122.0 };
function inServiceArea_(lat, lng) {
  return lat >= SERVICE_AREA_BOUNDS_.minLat && lat <= SERVICE_AREA_BOUNDS_.maxLat &&
         lng >= SERVICE_AREA_BOUNDS_.minLng && lng <= SERVICE_AREA_BOUNDS_.maxLng;
}
function extractCityFromAddress_(address) {
  const m = String(address || '').match(/[一-龥]{2,3}[縣市]/);
  return m ? m[0] : '不明縣市';
}
// 「臺北市」(異體字) vs 「台北市」視為同一個，判斷地址開頭是否已經有縣市時要先正規化，
// 不然會把「臺北市…」誤判成沒有縣市，又重複補一次「台北市」上去。
function normalizeCityChar_(s) {
  return String(s || '').replace(/臺/g, '台');
}
// 查地址/店名的座標，用 Places API (New) 的 Text Search，不是 Geocoding API——2026-11-04 實測
// 發現這把 GMAPS_KEY 設了 HTTP referrer 限制，Geocoding API／舊版 Places API 這類「伺服器端」
// API 一律拒絕 referrer 限制的 key（Google 平台規則，跟是誰呼叫、有沒有送 Referer header 都
// 無關，連後端呼叫也一樣被擋，回應是「API keys with referer restrictions cannot be used with
// this API」）；Places API (New) 才支援 referrer 限制的 key，但要先在 Google Cloud Console 把
// 這把 key 的「API 限制」清單加上 Places API (New)，沒開會收到 API_KEY_SERVICE_BLOCKED。
// locationBias 只是偏好提示（跟原本 Geocoding API 的 bounds 參數一樣不是硬性範圍），呼叫端要
// 自己用 inServiceArea_() 檢查結果。
async function geocodeQuery_(query) {
  const r = await fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': GMAPS_KEY,
      'X-Goog-FieldMask': 'places.location,places.formattedAddress',
    },
    body: JSON.stringify({
      textQuery: query,
      languageCode: 'zh-TW',
      regionCode: 'TW',
      locationBias: { rectangle: { low: { latitude: 24.9, longitude: 121.4 }, high: { latitude: 25.2, longitude: 121.75 } } },
    }),
  });
  const d = await r.json();
  const place = d.places?.[0];
  if (!place?.location) return null;
  return { lat: place.location.latitude, lng: place.location.longitude, formattedAddress: place.formattedAddress || '' };
}

// 查過的店存在這裡，同一次瀏覽（重新整理會清空）不重複打 API——calcRoute／renderMap 共用。
const geocodeCache_ = {};

// 新店定位查到之後存回 Worker（geo:<id> KV，不設過期），下次 /api/plan 會直接附上 lat/lng，
// 地圖模式就不用每次重新整理都重打 Places API（每日上限 300 次）。失敗（例如剛好超過額度）
// 不影響這次畫面，記個 console.warn 就好，下次還是會再查一次。不等它完成（fire-and-forget）。
function saveGeoToServer_(id, address, lat, lng) {
  post('/api/geo', { id, address: address || '', lat, lng }).catch(e => {
    console.warn('/api/geo 存檔失敗（不影響這次畫面，下次會再查一次）', id, e);
  });
}

// 回傳 { lat, lng, method: 'coord'|'address'|'name', warning: string|null }。
// lat/lng 為 null 代表這家店這次定位失敗（超出範圍或查無結果），呼叫端要跳過、不要拿去算路線/畫地圖。
async function resolveStoreLocation_(id, name) {
  if (geocodeCache_[id]) return geocodeCache_[id];

  const ph = (allPharmaciesCache || []).find(p => p.id === id);
  const rec = (planData?.recommended || []).find(item => item.id === id);

  // ① 客戶表座標，或 /api/plan 已經附上的新店座標（後端 geo:<id> 永久快取）：直接信任
  if (ph?.lat && ph?.lng) {
    const result = { lat: ph.lat, lng: ph.lng, method: 'coord', warning: null };
    geocodeCache_[id] = result;
    return result;
  }
  if (rec?.lat && rec?.lng) {
    const result = { lat: rec.lat, lng: rec.lng, method: 'coord', warning: null };
    geocodeCache_[id] = result;
    return result;
  }

  // ② 地址：客戶表 or planData.recommended（新店項目）哪裡有地址就用哪裡
  const originalAddress = ph?.address || rec?.address || '';
  let address = originalAddress;
  const city = ph?.city || rec?.city || '';
  const district = ph?.district || rec?.district || '';
  if (address && city && !normalizeCityChar_(address).startsWith(normalizeCityChar_(city))) {
    address = city + district + address; // 地址開頭沒有縣市，自動補上
  }
  if (address) {
    const geo = await geocodeQuery_(address);
    if (geo && inServiceArea_(geo.lat, geo.lng)) {
      const result = { lat: geo.lat, lng: geo.lng, method: 'address', warning: null };
      geocodeCache_[id] = result;
      saveGeoToServer_(id, originalAddress, geo.lat, geo.lng);
      return result;
    }
    if (geo) {
      // 地址查到了，但結果超出服務範圍——地址本身可能有問題，不要再退回去用店名猜（那正是原本
      // 誤查到外縣市同名店的那條路），直接標可疑。可疑的不存進永久快取，下次還是會再查一次。
      const result = {
        lat: null, lng: null, method: 'address',
        warning: `⚠ 定位可疑：${name}（查到${extractCityFromAddress_(geo.formattedAddress)}），請確認地址`,
      };
      geocodeCache_[id] = result;
      return result;
    }
    // 地址完全查無結果（可能地址打錯/不完整），才退到用店名試最後一次
  }

  // ③ 店名
  const geo = await geocodeQuery_(name + ' 台灣');
  if (geo && inServiceArea_(geo.lat, geo.lng)) {
    const result = { lat: geo.lat, lng: geo.lng, method: 'name', warning: null };
    geocodeCache_[id] = result;
    saveGeoToServer_(id, originalAddress, geo.lat, geo.lng);
    return result;
  }
  const result = {
    lat: null, lng: null, method: 'name',
    warning: geo
      ? `⚠ 定位可疑：${name}（查到${extractCityFromAddress_(geo.formattedAddress)}），請確認地址`
      : `⚠ 定位可疑：${name}（查無結果），請確認地址`,
  };
  geocodeCache_[id] = result; // 查無結果／可疑都不存進永久快取
  return result;
}

let lastRouteTotalKm = null;

async function calcRoute() {
  const btn = document.getElementById('btn-calc-route');
  const warnEl = document.getElementById('today-list-warnings');
  // 用店家代號去重：同一家店從①②欄都加進來時，只送一個站點給 Routes API，不要重複算、
  // 重複停留兩次（今日清單規格 1-1「同一家店不得重複」，原本這裡沒去重，是潛在的重複站 bug）。
  const stopMap = new Map();
  anchors.forEach(a => { if (!stopMap.has(a.id)) stopMap.set(a.id, { id: a.id, name: a.name, isAnchor: true }); });
  (planData?.recommended || []).filter(item => selectedCol2Ids.has(item.id)).forEach(item => {
    if (!stopMap.has(item.id)) stopMap.set(item.id, { id: item.id, name: item.name, isAnchor: false });
    else stopMap.get(item.id).isAnchor = true; // 本來就是錨點，不要因為②欄也勾了就被蓋掉
  });
  const allStops = [...stopMap.values()];
  if (!allStops.length) { alert('第①②欄還沒有選任何店家'); return; }

  btn.disabled = true; btn.textContent = '計算中…';
  if (warnEl) warnEl.innerHTML = '';
  try {
    await loadAllPharmacies(); // 確保 allPharmaciesCache 已載好，resolveStoreLocation_ 才查得到客戶表座標/地址

    // 統一定位邏輯（見 resolveStoreLocation_ 註解）：定位失敗（超出服務範圍或查無結果）的站不送進
    // Routes API 算路線，改收進 warnings 顯示紅字提示，不讓一家店定位錯誤拖垮整條路線的計算。
    const locations = await Promise.all(allStops.map(s => resolveStoreLocation_(s.id, s.name)));
    const warnings = [];
    const stops = [];
    allStops.forEach((s, i) => {
      const loc = locations[i];
      if (loc.lat && loc.lng) stops.push({ ...s, loc });
      else if (loc.warning) warnings.push(loc.warning);
    });
    if (!stops.length) throw new Error('所有站點都定位失敗，無法計算路線');

    const intermediates = stops.map(s => ({ location: { latLng: { latitude: s.loc.lat, longitude: s.loc.lng } } }));

    const routeResp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GMAPS_KEY,
        'X-Goog-FieldMask': 'routes.polyline,routes.legs.distanceMeters,routes.legs.duration,routes.optimizedIntermediateWaypointIndex',
      },
      body: JSON.stringify({
        origin: { address: ORIGIN_ADDR }, destination: { address: DEST_ADDR },
        intermediates, travelMode: 'DRIVE', optimizeWaypointOrder: true,
      }),
    });
    if (!routeResp.ok) {
      const errData = await routeResp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${routeResp.status}`);
    }
    const routeData = await routeResp.json();
    if (!routeData.routes?.length) throw new Error('找不到路線');
    const route0 = routeData.routes[0];
    const orderRaw = route0.optimizedIntermediateWaypointIndex;
    const order = (Array.isArray(orderRaw) && orderRaw.length === stops.length) ? orderRaw : stops.map((_, i) => i);
    const legs = route0.legs;
    const reordered = order.map(i => stops[i]).filter(Boolean);
    lastRouteTotalKm = Math.round(legs.reduce((sum, leg) => sum + leg.distanceMeters, 0) / 1000);
    // 站數+1：出發→站1、站1→站2…、最後一站→目的地。recomputeTodayListTimes_/todayListFinishMin_
    // 用這份資料配合目前的出發時間/停留分鐘重算，之後只改時間相關設定都不用再打一次這支 API。
    lastRouteLegMinutes = legs.map(leg => parseInt(leg.duration) / 60);

    // 把今日清單重新排成路線順序：定位失敗的站（warnings 裡那些）留在清單裡但排到最後面，
    // 不會因為沒算進路線就整個消失——使用者還是看得到、知道要自己確認地址。
    const resolvedIds = reordered.map(s => s.id);
    const locateMethodById = {}; reordered.forEach(s => { locateMethodById[s.id] = s.loc.method; });
    const resolvedRows = resolvedIds.map(id => todayList.find(r => r.id === id)).filter(Boolean);
    const unresolvedRows = todayList.filter(r => !resolvedIds.includes(r.id));
    todayList = [...resolvedRows, ...unresolvedRows];
    todayList.forEach(row => { row.locateMethod = locateMethodById[row.id] || null; });
    orderMode = 'route';
    savePlanState(); // orderMode 存在 KV plan:{date}
    lastRouteResolvedIds = new Set(resolvedIds);
    lastRouteStopIds = todayList.map(r => r.id).sort().join(',');

    recomputeTodayListTimes_();

    window._confirmedRoute = todayList.map((row, i) => ({
      id: row.id, name: row.name, isAnchor: anchors.some(a => a.id === row.id),
      seq: i + 1, arrival: row.arrival, locateMethod: row.locateMethod,
    }));
    renderMapRoutePanel();
    if (viewMode === 'map') renderMap();

    if (warnEl && warnings.length) {
      warnEl.innerHTML = `<div class="route-warning-banner">${warnings.map(w => escapeHtml(w)).join('<br>')}</div>`;
    }
  } catch (e) {
    if (warnEl) warnEl.innerHTML = `<div class="empty-hint">路線計算失敗：${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '計算路線';
  }
}

</script>
