<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartRoute｜今天</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
  /* Phase 2 骨架：三欄版面＋主選單＋頁首列。資料渲染留給步驟 3～5 補。 */
  * { box-sizing: border-box; }

  /* 主選單（.nav／.nav-tabs／.nav-tab…）2026-11-03 搬到 design-tokens.css 集中管理＋加 RWD，
     不要在這裡重複寫一份（原本7個頁面各自複製，見 docs/SPEC.md 待辦）。 */
  .plan-date-input {
    height: 32px; font-size: var(--sr-text-sm); border: 1px solid var(--sr-line);
    border-radius: var(--sr-radius-md); padding: 0 var(--sr-space-4); font-family: var(--sr-font);
  }
  .find-pharmacy-input {
    width: 200px; height: 36px; background: var(--sr-bg-subtle); border: 1px solid var(--sr-line);
    border-radius: var(--sr-radius-md); padding: 0 var(--sr-space-4); font-size: var(--sr-text-sm);
    font-family: var(--sr-font);
  }
  /* 窄螢幕：nav-right 本身固定不縮（上面），但找藥局框 200px 太寬，縮小讓 nav-brand/nav-right 還留得下 */
  @media (max-width: 700px) {
    .find-pharmacy-input { width: 110px; }
  }

  /* ---------- 頁首列（DESIGN.md 2.2） ---------- */
  .page-header {
    display: flex; align-items: center; gap: var(--sr-space-7);
    padding: var(--sr-space-4) var(--sr-space-8);
    border-bottom: 1px solid var(--sr-line);
  }
  .page-header-date { font-size: var(--sr-text-xl); font-weight: var(--sr-weight-bold); }
  .page-header-route-points { font-size: var(--sr-text-sm); color: var(--sr-ink-2); }
  .page-header-placeholder { font-size: var(--sr-text-xs); color: var(--sr-ink-3); border: 1px dashed var(--sr-line-dashed); border-radius: var(--sr-radius-sm); padding: 2px 8px; }
  .data-time-badge { font-size: var(--sr-text-xs); color: var(--sr-ink-3); }
  .view-toggle { display: flex; border: 1px solid var(--sr-ink); border-radius: 6px; overflow: hidden; }
  .view-toggle-btn { height: 28px; padding: 0 var(--sr-space-5); font-size: var(--sr-text-xs); background: var(--sr-bg); border: none; color: var(--sr-ink); cursor: pointer; font-family: var(--sr-font); }
  .view-toggle-btn.active { background: var(--sr-ink); color: var(--sr-on-dark); font-weight: var(--sr-weight-bold); }
  .view-toggle-btn:disabled { color: var(--sr-ink-3); cursor: not-allowed; }
  .finish-time-block { margin-left: auto; text-align: right; }
  .finish-time-label { font-size: var(--sr-text-xs); color: var(--sr-ink-3); }
  .finish-time-value { font-size: var(--sr-text-2xl); font-weight: var(--sr-weight-bold); }
  .finish-time-value.late { color: var(--sr-danger); }

  /* ---------- 三欄（DESIGN.md 2.11） ----------
     寬度 ≥1200px：nav／頁首固定高度，.columns 吃掉剩下的視窗高度，三欄各自在欄內捲動──
     第②欄店家多的時候只有②自己變長，不會把整頁往下推，第③欄路線永遠留在看得到的範圍。
     寬度 <1200px：退回正常文件流（頁面本身捲動），三欄直接疊起來，不做固定高度裁切。 */
  body { display: flex; flex-direction: column; overflow-x: hidden; } /* 2026-11-02：整頁不能水平捲動，容器各自處理自己的捲動 */
  .columns {
    display: flex; flex-direction: column;
  }
  .col { border-right: 1px solid var(--sr-line); border-bottom: 1px solid var(--sr-line); }
  .col:last-child { border-right: none; border-bottom: none; }
  .col-1 { background: var(--sr-bg-subtle); }
  .col-body { padding: var(--sr-space-7); }

  @media (min-width: 1200px) {
    html, body { height: 100%; }
    body { height: 100vh; overflow: hidden; }
    .columns {
      display: grid;
      grid-template-columns: minmax(var(--sr-col-min), 1fr) minmax(var(--sr-col-min), 1.3fr) minmax(var(--sr-col-min), 1fr);
      flex: 1; min-height: 0; overflow: hidden;
    }
    .col { border-bottom: none; height: 100%; overflow-y: auto; }
  }

  /* ---------- 步驟標題（DESIGN.md 2.6） ---------- */
  .step-title { display: flex; align-items: center; gap: var(--sr-space-4); margin-bottom: var(--sr-space-6); }
  .step-num {
    width: var(--sr-step-size); height: var(--sr-step-size); border-radius: 50%;
    background: var(--sr-ink); color: var(--sr-on-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--sr-text-sm); font-weight: var(--sr-weight-bold); flex-shrink: 0;
  }
  .step-label { font-size: var(--sr-text-lg); font-weight: var(--sr-weight-bold); }

  .empty-hint {
    font-size: var(--sr-text-sm); color: var(--sr-ink-3);
    border: 1px dashed var(--sr-line-dashed); border-radius: var(--sr-radius-md);
    padding: var(--sr-space-6); text-align: center;
  }

  /* ---------- 今天可以跑的區（2026-11-02，放在①上方） ---------- */
  .region-overview { margin-bottom: var(--sr-space-7); }
  .region-overview-title { font-size: var(--sr-text-lg); font-weight: var(--sr-weight-bold); margin-bottom: var(--sr-space-4); }
  .region-card {
    border: 1px solid var(--sr-line); border-radius: var(--sr-radius-md); background: var(--sr-bg);
    padding: var(--sr-space-4) var(--sr-space-5); margin-bottom: var(--sr-space-3);
    display: flex; align-items: center; justify-content: space-between; gap: var(--sr-space-4);
  }
  .region-card-main { min-width: 0; }
  .region-card-label { font-size: var(--sr-text-sm); font-weight: var(--sr-weight-bold); }
  .region-card-stats { font-size: var(--sr-text-xs); color: var(--sr-ink-2); margin-top: 2px; }
  .region-card-minutes { font-size: var(--sr-text-2xs); color: var(--sr-ink-3); margin-top: 2px; }
  .region-card-btn {
    height: var(--sr-btn-h-sm); padding: 0 var(--sr-space-5); border-radius: var(--sr-radius-md);
    font-size: var(--sr-text-2xs); font-weight: var(--sr-weight-bold); cursor: pointer; font-family: var(--sr-font);
    background: var(--sr-bg); border: 1px solid var(--sr-ink); color: var(--sr-ink); flex-shrink: 0;
  }
  .region-card-btn:hover { background: var(--sr-bg-subtle); }
  .region-card.empty { opacity: 0.5; }

  /* ---------- 篩選膠囊（DESIGN.md 2.4） ---------- */
  .filter-pills { display: flex; gap: var(--sr-space-3); margin-bottom: var(--sr-space-6); }
  .filter-pill {
    height: 24px; padding: 0 var(--sr-space-5); border-radius: var(--sr-radius-pill);
    font-size: var(--sr-text-xs); background: var(--sr-bg); border: 1px solid var(--sr-line);
    color: var(--sr-ink-2); cursor: pointer; font-family: var(--sr-font);
  }
  .filter-pill.active { background: var(--sr-ink); color: var(--sr-on-dark); border-color: var(--sr-ink); }
  .filter-pill:disabled { opacity: 0.4; cursor: not-allowed; }
  .rec-section-title { font-size: var(--sr-text-sm); font-weight: var(--sr-weight-bold); color: var(--sr-ink-2); margin: var(--sr-space-6) 0 var(--sr-space-4); }
  .rec-section-title:first-of-type { margin-top: 0; }

  /* ---------- 推薦列（DESIGN.md 2.8） ---------- */
  .rec-row {
    display: grid; grid-template-columns: 24px 1fr 120px; gap: var(--sr-space-5);
    align-items: start; padding: var(--sr-space-5); margin-bottom: var(--sr-space-3);
    border: 1px solid var(--sr-line); border-radius: var(--sr-radius-md); background: var(--sr-bg);
  }
  .rec-row.selected { border-color: var(--sr-ink); background: var(--sr-bg-selected); }
  .rec-row.blocked { border: 1px dashed var(--sr-danger); opacity: 0.55; }
  .rec-check { width: 18px; height: 18px; margin-top: 2px; }
  .rec-name-line { display: flex; align-items: baseline; gap: var(--sr-space-3); flex-wrap: wrap; }
  .rec-name { font-size: var(--sr-text-md); font-weight: var(--sr-weight-bold); color: var(--sr-ink); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; font-family: var(--sr-font); }
  .rec-dist { font-size: var(--sr-text-xs); color: var(--sr-ink-3); }
  .rec-badges { display: flex; gap: var(--sr-space-2); flex-wrap: wrap; margin: 4px 0; }
  .badge-tier { background: var(--sr-ink); color: var(--sr-on-dark); font-size: var(--sr-text-2xs); padding: 1px 7px; border-radius: var(--sr-radius-sm); font-weight: var(--sr-weight-bold); }
  .badge-alert { background: var(--sr-danger-tint); color: var(--sr-danger); font-size: var(--sr-text-2xs); padding: 1px 7px; border-radius: var(--sr-radius-sm); font-weight: var(--sr-weight-bold); }
  .badge-consignment { background: var(--sr-bg-muted); color: var(--sr-ink-2); font-size: var(--sr-text-2xs); padding: 1px 7px; border-radius: var(--sr-radius-sm); font-weight: var(--sr-weight-bold); }
  .badge-consignment.due { background: var(--sr-danger-tint); color: var(--sr-danger); }
  .rec-reason { font-size: var(--sr-text-sm); color: var(--sr-ink-2); }
  .rec-rule { font-size: var(--sr-text-xs); font-weight: var(--sr-weight-bold); color: var(--sr-danger); margin-top: 2px; }
  .rec-bars { display: flex; flex-direction: column; gap: 4px; }
  .rec-bar-label { font-size: var(--sr-text-2xs); color: var(--sr-ink-3); }
  .rec-bar-track { height: 6px; background: var(--sr-bg-track); border-radius: 3px; overflow: hidden; }
  .rec-bar-fill { height: 100%; background: var(--sr-ink); }

  /* ---------- 兩週小日曆（DESIGN.md 2.10，先只做日期格＋今天外框，件數標記留待之後） ---------- */
  .mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: var(--sr-space-7); }
  .mini-cal-cell {
    height: 40px; border-radius: var(--sr-radius-sm); background: var(--sr-bg);
    display: flex; align-items: center; justify-content: center; font-size: var(--sr-text-xs);
    cursor: pointer; border: 1px solid transparent;
  }
  .mini-cal-cell.today { border: 2px solid var(--sr-primary); font-weight: var(--sr-weight-bold); }
  .mini-cal-cell.selected { background: var(--sr-primary-tint); }
  .mini-cal-cell:hover { background: var(--sr-bg-selected); }

  /* ---------- 錨點卡（DESIGN.md 2.7） ---------- */
  .anchor-card {
    background: var(--sr-bg); border: 1px solid var(--sr-line); border-radius: var(--sr-radius-md);
    padding: var(--sr-space-5) var(--sr-space-6); margin-bottom: var(--sr-space-3); position: relative;
  }
  /* 右邊留 36px 給 ✕ 按鈕，類型標籤不會被疊到 */
  .anchor-line1 { display: flex; align-items: center; justify-content: space-between; gap: var(--sr-space-3); padding-right: 36px; }
  .anchor-name { font-size: var(--sr-text-md); font-weight: var(--sr-weight-bold); }
  .anchor-type { background: var(--sr-ink); color: var(--sr-on-dark); font-size: var(--sr-text-xs); padding: 1px 8px; border-radius: var(--sr-radius-sm); flex-shrink: 0; }
  .anchor-line2 { font-size: var(--sr-text-sm); color: var(--sr-ink-2); margin-top: 2px; }
  .anchor-line3 { font-size: var(--sr-text-xs); color: var(--sr-ink-3); margin-top: 2px; }
  .anchor-dad-reminder {
    margin-top: var(--sr-space-3); padding: var(--sr-space-3) var(--sr-space-4);
    background: var(--sr-danger-tint); border-radius: var(--sr-radius-sm);
    font-size: var(--sr-text-xs); color: var(--sr-danger); font-weight: var(--sr-weight-bold);
  }
  .anchor-dad-reminder div + div { margin-top: 2px; }
  .anchor-remove {
    position: absolute; top: 4px; right: 4px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--sr-ink-3); cursor: pointer; font-size: 14px; font-family: var(--sr-font);
  }
  .anchor-remove:hover { background: var(--sr-bg-subtle); border-radius: var(--sr-radius-sm); }

  /* ---------- 建議加入（寄賣/對帳，可收合） ---------- */
  .suggest-block { border-top: 1px solid var(--sr-line-soft); padding-top: var(--sr-space-6); margin-top: var(--sr-space-6); }
  .suggest-title { font-size: var(--sr-text-sm); font-weight: var(--sr-weight-bold); color: var(--sr-ink-2); margin-bottom: var(--sr-space-4); }
  .suggest-card {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sr-space-4);
    border: 1px dashed var(--sr-line-dashed); border-radius: var(--sr-radius-md);
    padding: var(--sr-space-4) var(--sr-space-5); margin-bottom: var(--sr-space-3);
  }
  .suggest-info { font-size: var(--sr-text-sm); }
  .suggest-name { font-weight: var(--sr-weight-bold); }
  .suggest-detail { font-size: var(--sr-text-xs); color: var(--sr-ink-2); }
  .btn-add-anchor {
    height: 28px; padding: 0 var(--sr-space-5); border-radius: var(--sr-radius-md);
    border: 1px solid var(--sr-ink); background: var(--sr-bg); font-size: var(--sr-text-xs);
    font-weight: var(--sr-weight-bold); cursor: pointer; flex-shrink: 0; font-family: var(--sr-font);
  }
  .btn-add-anchor:hover { background: var(--sr-bg-subtle); }
  .suggest-more-link { font-size: var(--sr-text-sm); color: var(--sr-primary); cursor: pointer; background: none; border: none; padding: 0; font-family: var(--sr-font); }

  /* ---------- 手動搜尋加入 ---------- */
  .manual-add-block { border-top: 1px solid var(--sr-line-soft); padding-top: var(--sr-space-6); margin-top: var(--sr-space-6); }
  .manual-add-input {
    width: 100%; height: var(--sr-input-h); border: 1px solid var(--sr-line); border-radius: var(--sr-radius-md);
    padding: 0 var(--sr-space-5); font-size: var(--sr-text-sm); font-family: var(--sr-font); box-sizing: border-box;
  }
  .manual-add-results { margin-top: var(--sr-space-3); max-height: 220px; overflow-y: auto; }
  .manual-add-result-row {
    display: flex; align-items: center; justify-content: space-between; padding: var(--sr-space-3) var(--sr-space-4);
    border-bottom: 1px solid var(--sr-line-row); font-size: var(--sr-text-sm); cursor: pointer;
  }
  .manual-add-result-row:hover { background: var(--sr-bg-subtle); }
  .manual-add-tag { font-size: var(--sr-text-2xs); color: var(--sr-ink-3); }

  /* ---------- 第③欄按鈕（DESIGN.md 2.3） ---------- */
  .btn-calc-route, .btn-confirm-route {
    width: 100%; border-radius: var(--sr-radius-md); font-weight: var(--sr-weight-bold);
    font-family: var(--sr-font); cursor: pointer;
  }
  .btn-calc-route { height: var(--sr-btn-h); background: var(--sr-bg); border: 1px solid var(--sr-ink); color: var(--sr-ink); }
  .btn-calc-route:hover { background: var(--sr-bg-subtle); }
  .btn-calc-route:disabled { opacity: 0.5; cursor: default; }
  .btn-confirm-route { height: var(--sr-btn-h-lg); background: var(--sr-primary); border: none; color: var(--sr-on-dark); margin-top: var(--sr-space-6); }
  .btn-confirm-route:hover { background: var(--sr-primary-hover); }

  /* ---------- 路線清單（DESIGN.md 2.9） ---------- */
  .route-stop-row { display: flex; align-items: center; gap: var(--sr-space-4); padding: var(--sr-space-3) 0; border-bottom: 1px solid var(--sr-line-row); }
  .route-stop-time { width: 44px; font-size: var(--sr-text-sm); color: var(--sr-ink-2); flex-shrink: 0; }
  .route-stop-name { flex: 1; font-size: var(--sr-text-base); }
  .route-stop-name.anchor { font-weight: var(--sr-weight-bold); }
  .route-stop-tag { font-size: var(--sr-text-2xs); border: 1px solid var(--sr-line); border-radius: var(--sr-radius-sm); padding: 1px 6px; color: var(--sr-ink-2); }
  .route-stop-method { font-size: var(--sr-text-2xs); color: var(--sr-ink-3); flex-shrink: 0; white-space: nowrap; }
  .route-stop-method.by-name { color: var(--sr-billing-soft); font-weight: var(--sr-weight-bold); }
  .route-warning-banner { font-size: var(--sr-text-sm); color: var(--sr-danger); font-weight: var(--sr-weight-bold); margin-bottom: var(--sr-space-4); line-height: var(--sr-leading-tight); }
  .route-summary { margin-top: var(--sr-space-6); font-size: var(--sr-text-sm); color: var(--sr-ink-2); }

  /* ---------- 第③欄：今日清單（docs/今日清單_規格.md 階段一） ---------- */
  .tl-summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sr-space-4);
    font-size: var(--sr-text-sm); color: var(--sr-ink-2); padding-bottom: var(--sr-space-4);
    border-bottom: 1px solid var(--sr-line-soft);
  }
  .tl-summary strong { color: var(--sr-ink); font-weight: var(--sr-weight-bold); }
  .tl-depart-input, .tl-stay-input {
    border: 1px solid var(--sr-line); border-radius: var(--sr-radius-sm); font-family: var(--sr-font);
    font-size: var(--sr-text-sm); padding: 1px 4px;
  }
  .tl-depart-input { width: 88px; }
  .tl-stay-input { width: 44px; text-align: right; }
  .tl-order-mode { font-size: var(--sr-text-2xs); color: var(--sr-ink-3); }
  .tl-actions { display: flex; gap: var(--sr-space-3); margin-top: var(--sr-space-4); }
  .tl-actions .btn-calc-route { flex: 1; }

  .tl-row {
    border: 1px solid var(--sr-line-row); border-radius: var(--sr-radius-md);
    padding: var(--sr-space-4); margin-bottom: var(--sr-space-4); cursor: grab;
  }
  .tl-row.rule-blocked { border-color: var(--sr-danger); background: color-mix(in srgb, var(--sr-danger) 6%, var(--sr-bg)); }
  .tl-row.dragging { opacity: 0.4; }
  .tl-row-top { display: flex; align-items: center; gap: var(--sr-space-3); }
  .tl-seq { width: 22px; flex-shrink: 0; font-size: var(--sr-text-sm); color: var(--sr-ink-3); font-weight: var(--sr-weight-bold); }
  .tl-name { flex: 1; font-size: var(--sr-text-base); font-weight: var(--sr-weight-bold); }
  .tl-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tl-tag { font-size: var(--sr-text-2xs); border: 1px solid var(--sr-line); border-radius: var(--sr-radius-sm); padding: 1px 6px; color: var(--sr-ink-2); white-space: nowrap; }
  .tl-remove { border: none; background: none; cursor: pointer; font-size: var(--sr-text-sm); color: var(--sr-ink-3); flex-shrink: 0; }
  .tl-remove:hover { color: var(--sr-danger); }

  .tl-purposes { display: flex; flex-wrap: wrap; gap: var(--sr-space-3); margin-top: var(--sr-space-3); }
  .tl-purpose-chip {
    display: inline-flex; align-items: center; gap: 3px; font-size: var(--sr-text-2xs);
    border: 1px solid var(--sr-line); border-radius: var(--sr-radius-sm); padding: 2px 6px; cursor: pointer;
  }
  .tl-purpose-chip.checked { border-color: var(--sr-primary); color: var(--sr-primary); font-weight: var(--sr-weight-bold); }
  .tl-other-text, .tl-note {
    width: 100%; box-sizing: border-box; margin-top: var(--sr-space-3); border: 1px solid var(--sr-line-soft);
    border-radius: var(--sr-radius-sm); padding: 3px var(--sr-space-3); font-size: var(--sr-text-2xs); font-family: var(--sr-font);
  }
  .tl-auto-task { margin-top: var(--sr-space-3); font-size: var(--sr-text-2xs); color: var(--sr-ink-2); }
  .tl-rule-conflict { margin-top: var(--sr-space-3); font-size: var(--sr-text-2xs); color: var(--sr-danger); font-weight: var(--sr-weight-bold); }
  .tl-rule-note { margin-top: var(--sr-space-3); font-size: var(--sr-text-2xs); color: var(--sr-ink-3); }
  .tl-row-bottom { display: flex; align-items: center; gap: var(--sr-space-4); margin-top: var(--sr-space-3); font-size: var(--sr-text-2xs); color: var(--sr-ink-3); }
  .tl-arrival { font-weight: var(--sr-weight-bold); color: var(--sr-ink); }
  .tl-method.by-name { color: var(--sr-billing-soft); font-weight: var(--sr-weight-bold); }

  /* ---------- 順序已手動調整時「計算路線」的二選一（跟 funnel.html 的 .sr-modal 同一套命名，
     這個檔案沒有共用元件，各頁各自定義一份，見其他重複 helper 同慣例） ---------- */
  .sr-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 9500; }
  .sr-modal { width: var(--sr-dialog-w); max-width: 92vw; background: var(--sr-bg); border-radius: var(--sr-radius-xl); padding: var(--sr-space-8); font-family: var(--sr-font); }
  .sr-modal-title { font-size: var(--sr-text-lg); font-weight: var(--sr-weight-bold); margin-bottom: var(--sr-space-6); }
  .sr-modal-actions { display: flex; flex-direction: column; gap: var(--sr-space-4); margin-top: var(--sr-space-4); }
  .sr-modal-actions button { width: 100%; height: var(--sr-btn-h-lg); border-radius: var(--sr-radius-md); font-weight: var(--sr-weight-bold); font-family: var(--sr-font); cursor: pointer; }

<script>
const WORKER = window.SR_WORKER_URL;

// 2026-11-01：主選單改共用元件（planner-nav.js），extraRight 放這頁才有的規劃日期選擇器／找藥局框，
// 要在 initHeader() 用到 #plan-date-input 之前先把 nav 灌進去，不然抓不到元素。
window.SRNav.render({
  active: 'today',
  extraRight: `
    <input type="date" id="plan-date-input" class="plan-date-input">
    <input type="text" id="find-pharmacy-input" class="find-pharmacy-input" placeholder="找藥局" disabled title="店家檔案抽屜做好後開放">
  `,
});

function fmtHeaderDate(d) {
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}（${wd}）`;
}
function fmtDs(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getPlanDate() {
  const url = new URL(location.href);
  const qs = url.searchParams.get('date');
  const input = document.getElementById('plan-date-input').value;
  const ds = input || qs || fmtDs(new Date());
  return ds;
}

function initHeader() {
  const url = new URL(location.href);
  const qs = url.searchParams.get('date');
  const initial = qs || fmtDs(new Date());
  document.getElementById('plan-date-input').value = initial;
  document.getElementById('page-header-date').textContent = fmtHeaderDate(new Date(initial.replace(/-/g, '/')));
  document.getElementById('plan-date-input').addEventListener('change', () => {
    const ds = document.getElementById('plan-date-input').value;
    const url2 = new URL(location.href);
    url2.searchParams.set('date', ds);
    location.href = url2.toString();
  });
}

async function get(path) {
  const r = await fetch(WORKER + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(WORKER + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!r.ok) {
    const t = await r.text();
    let msg = t || ('HTTP ' + r.status);
    try { const j = JSON.parse(t); if (j?.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

initHeader();

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 跟 planner-shared.js 的 gvizDateToIso() 同一份邏輯（故意複製，不共用——planner.html 目前沒有
// 載入 planner-shared.js，見該檔案檔頭註解）。待追蹤「期限」從 gviz 讀回來可能是原始字面值
// "Date(2026,10,16)"，要轉成 YYYY-MM-DD 才能跟 getPlanDate() 比對。
function gvizDateToIso(s) {
  if (!s) return null;
  const m = String(s).match(/^Date\((\d+),(\d+),(\d+)\)$/);
  if (m) return `${m[1]}-${String(Number(m[2]) + 1).padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  const d = new Date(String(s).replace(/\//g, '-'));
  return isNaN(d) ? null : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 2026-10-28：任何會寫入資料的按鈕都要經過這裡——按下立刻 disabled + 改文字，避免使用者看不到反應
// 連點好幾次（實測踩到：A8 新增待追蹤連點5次，因為按鈕沒變化，以為沒反應，結果建了5筆一樣的資料）。
async function withBusy(btn, busyLabel, fn) {
  if (!btn || btn.disabled) return;
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyLabel;
  try {
    await fn();
  } catch (e) {
    alert('失敗：' + e.message);
  } finally {
    // 成功或失敗都還原：大部分呼叫端會整個重繪把這顆按鈕換掉（還原一個已經不在畫面上的
    // 元素沒有影響），但像「確定，送到手機外勤模式」這種固定不重繪的按鈕，不還原就會卡死。
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'sr-toast-planner';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ══════════════════════════════
// 事件委派：所有動態產生的列表（推薦列、錨點卡、建議加入、手動搜尋結果、小日曆）一律用
// data-action + data-id，不要用 onclick="fn(${JSON.stringify(id)})" 這種字串拼接組 inline onclick
// ——店名、備註等欄位只要含雙引號，塞進雙引號包住的 onclick 屬性裡就會把屬性截斷，瀏覽器 console
// 會丟 SyntaxError，整個按鈕失效（2026-10-28 實測踩到：C133 這類店名或代號組出來的 onclick 壞掉）。
// 監聽掛在 document.body 上，列表重新整理（innerHTML 整個換掉）後不用重新綁定，天然就是委派模式。
// ══════════════════════════════
document.body.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if (action === 'open-drawer') openStoreDrawer(id);
  else if (action === 'remove-anchor') withBusy(t, '移除中…', () => removeAnchor(id));
  else if (action === 'toggle-group') toggleGroupExpand(t.dataset.group);
  else if (action === 'set-filter-mode') setFilterMode(t.dataset.mode);
  else if (action === 'goto-date') goToDate(t.dataset.date);
  else if (action === 'toggle-suggest-expand') toggleSuggestExpand();
  else if (action === 'add-suggested-anchor') {
    const item = (planData?.recommended || []).find(x => x.id === id);
    if (item) {
      const cb = consignmentBadge(item);
      withBusy(t, '加入中…', () => addAnchor({ id: item.id, name: item.name, source: cb.label, item: cb.detail, deadline: null }));
    }
  } else if (action === 'pick-manual-add') {
    const p = (allPharmaciesCache || []).find(x => x.id === id);
    if (p) withBusy(t, '加入中…', () => pickManualAdd(p));
  } else if (action === 'pick-region') {
    withBusy(t, '加入中…', () => pickRegion(t.dataset.key));
  } else if (action === 'remove-today') {
    withBusy(t, '移除中…', () => removeTodayListRow_(id));
  } else if (action === 'manual-order-keep') {
    closeManualOrderModal_();
    clearTimeout(tlManualRecalcTimer_); // 避免跟剛好還在跑的拖曳 debounce 重複打一次 API
    recalcManualOrderTimes_();
  } else if (action === 'manual-order-reopt') {
    closeManualOrderModal_();
    clearTimeout(tlManualRecalcTimer_);
    calcRoute();
  }
});
document.body.addEventListener('change', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  if (action === 'toggle-col2') toggleCol2(t.dataset.id);
  else if (action === 'toggle-tl-purpose') toggleTodayPurpose_(t.dataset.id, t.dataset.purpose);
  else if (action === 'tl-stay-min') setTodayStayMin_(t.dataset.id, t.value);
});
// 備註類文字欄位用 input（即時存進狀態，不觸發重算/重畫），出發時間用 input 讓拖拉時間選擇器
// 即時反應——這兩類都不會造成輸入中被重繪打斷游標的問題（note/other-text 不重畫；depart-time
// 是瀏覽器原生 time picker，不是使用者逐字打字）。
document.body.addEventListener('input', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  if (action === 'tl-note') setTodayNote_(t.dataset.id, t.value);
  else if (action === 'tl-other-text') setTodayOtherText_(t.dataset.id, t.value);
  else if (t.id === 'depart-time-input') setDepartTime_(t.value);
});

// 今日清單手動拖曳排序（HTML5 原生 drag/drop，委派在 document.body）。
document.body.addEventListener('dragstart', (e) => {
  const row = e.target.closest('.tl-row');
  if (!row) return;
  tlDragId_ = row.dataset.tlId;
  row.classList.add('dragging');
});
document.body.addEventListener('dragend', (e) => {
  const row = e.target.closest('.tl-row');
  if (row) row.classList.remove('dragging');
  tlDragId_ = null;
});
document.body.addEventListener('dragover', (e) => {
  if (e.target.closest('.tl-row')) e.preventDefault(); // 允許 drop
});
document.body.addEventListener('drop', (e) => {
  const row = e.target.closest('.tl-row');
  if (!row) return;
  e.preventDefault();
  reorderTodayListManually_(row.dataset.tlId);
});

// ══════════════════════════════
// 全域狀態
// ══════════════════════════════
let planData = null;       // /api/plan 的完整回應
let anchors = [];          // 第①欄目前的錨點清單（系統自動＋手動加入的，含寄賣/對帳「加入今天」移過來的）
let selectedCol2Ids = new Set(); // 第②欄目前勾選、要排進路線的店家 id

function anchorIds() { return new Set(anchors.map(a => a.id)); }

// ══════════════════════════════
// 第②欄：順路可以補
// ══════════════════════════════
function tierBadgeHtml(tier) {
  return `<span class="badge-tier">${tier}</span>`;
}
function alertBadgeHtml(alert) {
  return alert ? `<span class="badge-alert">${alert}</span>` : '';
}
// 寄賣/簽約徽章：不是後端算好的單一欄位，用 isContracted/contractAmount/consignmentAllTotal/
// consignmentStaleCount 這幾個現成欄位在前端判斷該顯示哪種狀態（跟 handlePlannerPlan 組 reason 文字用的
// 判斷條件完全一致，只是這裡額外需要一個「有沒有觸發」的布林值，給收合的建議加入清單排序用）。
function consignmentBadge(item) {
  if (item.isContracted) {
    const triggered = item.consignmentAllTotal >= item.contractAmount * 1.4;
    if (!triggered) return { html: '', triggered: false, sortValue: 0 };
    return {
      html: `<span class="badge-consignment due">該對帳：寄賣中 $${item.consignmentAllTotal.toLocaleString()} / 切口 $${item.contractAmount.toLocaleString()}</span>`,
      triggered: true, sortValue: 2, label: '該對帳', detail: `寄賣中 $${item.consignmentAllTotal.toLocaleString()} / 切口 $${item.contractAmount.toLocaleString()}`,
    };
  }
  if (item.consignmentStaleCount > 0) {
    return {
      html: `<span class="badge-consignment due">寄賣${item.consignmentStaleCount}張待整理，最久${item.consignmentStaleMaxMonths}個月</span>`,
      triggered: true, sortValue: 1, staleTotal: item.consignmentStaleTotal,
      label: '寄賣待整理', detail: `${item.consignmentStaleCount}張，最久${item.consignmentStaleMaxMonths}個月，共 $${item.consignmentStaleTotal.toLocaleString()}`,
    };
  }
  return { html: '', triggered: false, sortValue: 0 };
}

function barHtml(label, ratio, max) {
  const pct = Math.max(0, Math.min(100, (ratio / max) * 100));
  return `<div class="rec-bars-item"><div class="rec-bar-label">${label}</div>
    <div class="rec-bar-track"><div class="rec-bar-fill" style="width:${pct}%"></div></div></div>`;
}

const RADIUS_KM = 2;
let filterMode = 'all'; // 'all' | 'radius'
const groupExpanded = { customer: false, newStore: false }; // 「還不急」收合狀態，兩區各自獨立

function haversineKm(lat1, lng1, lat2, lng2) {
  const toRad = x => x * Math.PI / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// 錨點 2 公里內：用目前錨點清單裡每一家的座標（從 /pharmacies 查），算店家到「最近一個錨點」的距離。
// 錨點或店家查不到座標的那一組就跳過不比較（視為距離無限遠），不強行猜座標。
function withinAnchorRadius(itemId) {
  if (!allPharmaciesCache) return true; // 座標還沒載入完成前，先不過濾，避免閃爍成空清單
  const byId = {}; allPharmaciesCache.forEach(p => { byId[p.id] = p; });
  const target = byId[itemId];
  if (!target?.lat || !target?.lng) return false;
  return anchors.some(a => {
    const ph = byId[a.id];
    if (!ph?.lat || !ph?.lng) return false;
    return haversineKm(target.lat, target.lng, ph.lat, ph.lng) <= RADIUS_KM;
  });
}

function recRowHtml(item) {
  const blocked = item.ruleStatus?.status === '擋住';
  const selected = selectedCol2Ids.has(item.id);
  // 新店開發（藥局每日異動追蹤篩選分頁，type==='new-store'）跟正式客戶（type==='customer'）
  // 是 handlePlannerPlan 裡兩條完全獨立的邏輯分支，欄位長得不一樣：新店沒有 tier/alert/isContracted
  // 這些分級欄位，只有 stage/interval。兩種要分開渲染，不能共用同一套徽章邏輯。
  const isNewStore = item.type === 'new-store';
  const badgesHtml = isNewStore
    ? `<span class="badge-tier">${escapeHtml(item.stage)}</span>`
    : `${tierBadgeHtml(item.tier)}${alertBadgeHtml(item.alert)}${consignmentBadge(item).html}`;
  const ruleLine = (item.ruleStatus?.rules?.length)
    ? `<div class="rec-rule">規則：${escapeHtml(item.ruleStatus.rules.join('、'))}</div>` : '';
  // 新店開發才顯示地址（篩選分頁有完整地址欄；正式客戶這裡沒有，維持原本不顯示）
  const addressLine = (isNewStore && item.address)
    ? `<div class="rec-reason">${escapeHtml(item.address)}</div>` : '';
  return `<div class="rec-row ${selected ? 'selected' : ''} ${blocked ? 'blocked' : ''}" data-id="${escapeHtml(item.id)}">
    <input type="checkbox" class="rec-check" data-action="toggle-col2" data-id="${escapeHtml(item.id)}"
      ${selected ? 'checked' : ''} ${blocked ? 'disabled title="規則擋住，無法加入"' : ''}>
    <div>
      <div class="rec-name-line">
        <button class="rec-name" data-action="open-drawer" data-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}</button>
      </div>
      <div class="rec-badges">${badgesHtml}</div>
      ${addressLine}
      <div class="rec-reason">${escapeHtml(item.reason)}</div>
      ${ruleLine}
    </div>
    <div class="rec-bars">
      ${barHtml('倍數 ' + item.ratio + '×', item.ratio, 2)}
      ${!isNewStore && item.followupMultiplier > 1 ? barHtml('待追蹤', 1, 1) : barHtml('待追蹤', 0, 1)}
    </div>
  </div>`;
}

// 一組（正式客戶或新店開發）的渲染：倍數≥1 直接列出，<1 收在「還不急（N家）」，點了才展開。
function groupHtml(items, groupKey, sectionTitle) {
  if (!items.length) return '';
  const due = items.filter(x => x.ratio >= 1);
  const notYet = items.filter(x => x.ratio < 1);
  const expanded = groupExpanded[groupKey];
  return `<div class="rec-section-title">${sectionTitle}</div>` +
    due.map(recRowHtml).join('') +
    (notYet.length
      ? `<button class="suggest-more-link" data-action="toggle-group" data-group="${groupKey}">${expanded ? '收起' : '還不急（' + notYet.length + ' 家）'}</button>` +
        (expanded ? notYet.map(recRowHtml).join('') : '')
      : '');
}
function toggleGroupExpand(groupKey) {
  groupExpanded[groupKey] = !groupExpanded[groupKey];
  renderRecommend();
  if (viewMode === 'map') renderMap();
}

function setFilterMode(mode) {
  if (mode === 'radius' && !anchors.length) return; // 沒有錨點時這顆膠囊是灰的，點了也不動作
  filterMode = mode;
  renderRecommend();
  if (viewMode === 'map') renderMap();
}

function renderRecommend() {
  const root = document.getElementById('recommend-root');
  if (!planData) { root.innerHTML = '<div class="empty-hint">載入中…</div>'; return; }
  const excludeIds = anchorIds();
  let list = (planData.recommended || []).filter(item => !excludeIds.has(item.id));
  if (filterMode === 'radius') list = list.filter(item => withinAnchorRadius(item.id));

  const pillsHtml = `<div class="filter-pills">
    <button class="filter-pill ${filterMode === 'all' ? 'active' : ''}" data-action="set-filter-mode" data-mode="all">全部</button>
    <button class="filter-pill ${filterMode === 'radius' ? 'active' : ''}" ${anchors.length ? '' : 'disabled'} data-action="set-filter-mode" data-mode="radius">錨點 ${RADIUS_KM} 公里內</button>
  </div>`;

  if (!list.length) { root.innerHTML = pillsHtml + '<div class="empty-hint">沒有符合條件的推薦店家</div>'; return; }

  const customerList = list.filter(x => x.type === 'customer');
  const newStoreList = list.filter(x => x.type === 'new-store');

  // 2026-11-02 使用者要求：新店開發移到正式客戶上面
  root.innerHTML = pillsHtml +
    groupHtml(newStoreList, 'newStore', '新店開發') +
    groupHtml(customerList, 'customer', '正式客戶');
}

function renderMiniCal() {
  const root = document.getElementById('mini-cal-root');
  const selectedDs = getPlanDate();
  const todayDs = fmtDs(new Date());
  const start = new Date(selectedDs.replace(/-/g, '/'));
  start.setDate(start.getDate() - start.getDay() - 7); // 往前抓到上週的週日，湊滿兩週
  let html = '';
  for (let i = 0; i < 14; i++) {

function goToDate(ds) {

// 用店家 id 找，不是陣列 index——index 在清單重新排序/篩選後會對不上，id 才穩定（見2026-10-28事件委派改版）。
// async＋await savePlanState：store-drawer.js 的「加入今天」會 await window.addAnchor(...)，
// 要等真的存檔完成（或失敗）才能讓它的按鈕解除忙碌狀態。
async function removeAnchor(id) {
  const i = anchors.findIndex(a => a.id === id);
  if (i < 0) return;
  anchors.splice(i, 1);
  renderAnchors();
  renderRecommend();
  renderSuggest();
  if (viewMode === 'map') renderMap();

  await savePlanState();
  toast('已移除');
}

async function addAnchor(a) {
  if (anchors.some(x => x.id === a.id)) return; // 同一天同一家店不重複加
  anchors.push(a);
  renderAnchors();
  renderRecommend();
  renderSuggest();
  if (viewMode === 'map') renderMap();
  await syncTodayList_();
  await savePlanState();
  toast('已加入今天');
}

// 寄賣待整理／該對帳：不自動進錨點，這裡只收合顯示建議，按「加入今天」才真的移入第①欄（見批准的計畫）。
function renderSuggest() {
  const root = document.getElementById('suggest-root');
  if (!planData) { root.innerHTML = ''; return; }
  const excludeIds = anchorIds();
  const candidates = (planData.recommended || [])
    .filter(item => !excludeIds.has(item.id))
    .map(item => ({ item, cb: consignmentBadge(item) }))
    .filter(x => x.cb.triggered)
    .sort((a, b) => (b.cb.sortValue - a.cb.sortValue) || ((b.cb.staleTotal || 0) - (a.cb.staleTotal || 0)));

  if (!candidates.length) { root.innerHTML = ''; return; }

  const expanded = root.dataset.expanded === '1';
  const shown = expanded ? candidates : candidates.slice(0, 3);

  root.innerHTML = `<div class="suggest-title">建議加入（寄賣待整理／該對帳，共 ${candidates.length} 家）</div>` +
    shown.map(({ item, cb }) => `
      <div class="suggest-card">
        <div class="suggest-info">
          <div class="suggest-name">${escapeHtml(item.name)}</div>
          <div class="suggest-detail">${escapeHtml(cb.detail)}</div>
        </div>
        <button class="btn-add-anchor" data-action="add-suggested-anchor" data-id="${escapeHtml(item.id)}">加入今天</button>
      </div>`).join('') +
    (candidates.length > 3
      ? `<button class="suggest-more-link" data-action="toggle-suggest-expand">${expanded ? '收起' : '看全部 ' + candidates.length + ' 家'}</button>`
      : '');
}
function toggleSuggestExpand() {
  const root = document.getElementById('suggest-root');
  root.dataset.expanded = root.dataset.expanded === '1' ? '0' : '1';
  renderSuggest();
}

async function loadAllPharmacies() {

function excludeReasonOf(p) {

// ══════════════════════════════
// 存檔（KV）：anchors 或 route 任何變動都存一次，重新整理頁面能恢復
// ══════════════════════════════
let savingPlan = false;
let savePending = false; // 存檔中又有新的變動進來時，不要默默丟掉——記下來，這次存完立刻再存一次最新狀態
async function savePlanState() {
  if (savingPlan) { savePending = true; return; }
  savingPlan = true;
  try {
    await post('/api/plan', { date: getPlanDate(), anchors, route: window._confirmedRoute || null });
  } catch (e) {
    console.error('存檔失敗', e);
    throw e;
  } finally {
    savingPlan = false;
  }
  if (savePending) {
    savePending = false;
    await savePlanState();
  }
}

// 把「本週頁」已經排在今天這個日期的待追蹤事項自動帶進①今天一定要去（2026-11-03 使用者要求）。
// weekly.html 的 day.region 只是行政分區標籤，不是具體店家清單——真正「某天排了哪家店」要用
// /api/followups 裡 deadlineType==='指定日期前' 且 deadline===今天 的待追蹤事項，storeId 跟
// anchors[].id 是同一種 Customer_ID 格式（見研究結論）。純讀取：只在記憶體裡補進 anchors，
// 不呼叫 savePlanState()，要等使用者自己動手（移除/手動加入任一錨點）才會存檔，不能一開頁
// 就把本週頁排的東西寫回 /api/plan。
async function mergeWeeklyAnchors() {
  try {
    const followupsData = await get('/api/followups');
    const todayDs = getPlanDate();
    const existingIds = new Set(anchors.map(a => a.id));
    (followupsData.followups || []).forEach(f => {
      if (f.status !== '未完成' || f.deadlineType !== '指定日期前' || !f.deadline) return;
      if (gvizDateToIso(f.deadline) !== todayDs) return;
      if (!f.storeId || existingIds.has(f.storeId)) return;
      existingIds.add(f.storeId);
      anchors.push({ id: f.storeId, name: f.storeName, source: '本週排', item: f.item, deadline: null });
    });
  } catch (e) {
    console.error('帶入本週排程失敗', e);
  }
}

// Plan C（2026-11-04）：worker.js 的 /api/plan 現在會回 cachedAt（這次組合回應裡最舊的一份
// 資料是什麼時候抓的）。顯示給使用者看，超過10分鐘就在30秒後自動補抓一次新的——只補一次，
// 不是每10分鐘就重複打，避免整天開著分頁時，worker.js 背景重讀寫KV的次數疊加太高（估算見
// worker.js warmPlannerCaches_ 附近的註解）。
const STALE_AUTO_REFRESH_MS = 10 * 60 * 1000;
let staleRefreshScheduled_ = false;
function showDataTime_(cachedAt, reloadFn) {
  const el = document.getElementById('data-time-badge');
  if (!cachedAt) { if (el) el.textContent = ''; return; }
  const d = new Date(cachedAt);
  if (el) el.textContent = `資料時間 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (!staleRefreshScheduled_ && Date.now() - cachedAt > STALE_AUTO_REFRESH_MS) {
    staleRefreshScheduled_ = true;
    setTimeout(async () => { await reloadFn(); toast('已更新'); }, 30000);
  }
}

async function loadPlan() {
  try {
    const [plan] = await Promise.all([get('/api/plan?date=' + getPlanDate()), loadAllPharmacies()]);
    planData = plan;
    if (Array.isArray(plan.config?.visitPurposes) && plan.config.visitPurposes.length) {
      VISIT_PURPOSES = plan.config.visitPurposes; // 正本在 planner-config.js，API 讀得到就優先用這份
    }
    anchors = planData.anchors || [];
    await mergeWeeklyAnchors();
    showDataTime_(plan.cachedAt, loadPlan);
    renderMiniCal();
    renderAnchors();
    renderRecommend();
    renderSuggest();
    renderRegionOverview();
    if (viewMode === 'map') renderMap();
    // 換日期/重新整理：今日清單整個重新合成。跟原本「按計算路線前都顯示空白提示」的行為一致——
    // plan:{date} 存的 route 沒有附車程分鐘數，重開頁面後沒辦法不重打 Routes API 就還原到達時間，
    // 所以跟原本 route-root 一樣，重新整理後要重新按一次「計算路線」才會有順序跟時間（不是退步，
    // 是這次之前本來就沒做到的事，stage 1 規格也沒有要求要做這塊，不在這次範圍內）。
    todayList = [];
    orderMode = 'unordered';
    lastRouteLegMinutes = null;
    lastRouteTotalKm = null;
    window._confirmedRoute = null;
    await syncTodayList_();
  } catch (e) {
    document.getElementById('recommend-root').innerHTML =
      `<div class="empty-hint">載入失敗：${e.message}</div>`;
  }
}

// 4.4 顏色分級門檻，跟 worker.js PLANNER_CONFIG.ratioColorThresholds 同一組數字——前端沒有 import
// 設定檔，照這個檔案其他 helper（haversineKm 等）既有的「刻意複製一份」慣例，之後門檻調整兩邊要一起改。
function ratioTierOf(ratio) {
  if (ratio >= 1.5) return 'very-late';
  if (ratio >= 1.0) return 'late';
  if (ratio >= 0.5) return 'soon';
  return 'early';
}
function ratioColorVar(tier) {
  return tier === 'very-late' ? '--sr-ratio-4' : tier === 'late' ? '--sr-ratio-3' : tier === 'soon' ? '--sr-ratio-2' : '--sr-ratio-1';
}
// marker 顏色只能吃實際色碼，不能直接吃 CSS 變數名——讀 design-tokens.css 當下算好的值，
// 不要另外寫死 hex（CLAUDE.md「新頁面一律引用 design-tokens.css 的變數」）。
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// 跟 renderRecommend() 的篩選鏈（排除錨點／filterMode／分級收合狀態）刻意保持一致，故意複製一份
// 不是抽共用函式——renderRecommend() 之後單獨改動時這裡要記得一起看（跟檔案其他重複 helper 同慣例）。
function visibleRecommendList() {
  if (!planData) return [];
  const excludeIds = anchorIds();
  let list = (planData.recommended || []).filter(item => !excludeIds.has(item.id));
  if (filterMode === 'radius') list = list.filter(item => withinAnchorRadius(item.id));
  const customerList = list.filter(x => x.type === 'customer');
  const newStoreList = list.filter(x => x.type === 'new-store');
  function part(items, groupKey) {
    const due = items.filter(x => x.ratio >= 1);
    const notYet = items.filter(x => x.ratio < 1);
    return groupExpanded[groupKey] ? due.concat(notYet) : due;
  }
  return part(newStoreList, 'newStore').concat(part(customerList, 'customer'));
}

function loadGoogleMapsSdk() {
  return new Promise(resolve => {
    if (window.google?.maps) { resolve(); return; }
    const prev = window._onGMapReady;
    window._onGMapReady = function () { if (prev) prev(); resolve(); };
    if (!document.getElementById('gmap-script')) {
      const s = document.createElement('script'); s.id = 'gmap-script';
      s.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&callback=_onGMapReady&language=zh-TW`;
      document.head.appendChild(s);
    }
  });
}

// locateMethod：'coord'=客戶表座標／'address'=地址定位／'name'=只能用店名定位（見
// resolveStoreLocation_）。用店名定位的最不可靠，字標黃色（--sr-billing-soft，專案裡色票最接近
// 黃色的 token，design-tokens.css 沒有定義另一個黃色，2026-11-04）提醒使用者留意。
function locateMethodLabel_(method) {
  return method === 'coord' ? '座標' : method === 'address' ? '地址' : method === 'name' ? '店名' : '';
}
function routeListHtml(route) {
  if (!route || !route.length) return '<div class="empty-hint">在清單模式選好店家並按「計算路線」</div>';
  return route.map(s => `<div class="route-stop-row">
      <span class="route-stop-time">${s.arrival ? fmtMin(s.arrival) : ''}</span>
      <span class="route-stop-name ${s.isAnchor ? 'anchor' : ''}">${escapeHtml(s.name)}</span>
      ${s.isAnchor ? '<span class="route-stop-tag">錨點</span>' : ''}
      ${s.locateMethod ? `<span class="route-stop-method${s.locateMethod === 'name' ? ' by-name' : ''}">用${locateMethodLabel_(s.locateMethod)}定位</span>` : ''}
    </div>`).join('');
}
function renderMapRoutePanel() {
  const root = document.getElementById('map-route-root');
  if (root) root.innerHTML = routeListHtml(window._confirmedRoute);
}

// ══════════════════════════════
// 第③欄：今日清單（docs/今日清單_規格.md 階段一，2026-11-04）
// 取代原本只顯示「計算路線後的站序」的 route-root，改成①②欄一有變動就立即反映的清單，含拜訪
// 目的/備註/停留分鐘/規則衝突。純前端狀態（todayList），階段二才會存進試算表——跟 anchors/
// selectedCol2Ids 不一樣，todayList 不直接存 KV，是由這兩者「合成」出來的畫面狀態，每次①②欄
// 變動都用 syncTodayList_() 重新合成一次，但保留使用者已經手動改過的目的/備註/停留分鐘（不會
// 因為勾了別的店就被重置）。
// ══════════════════════════════
let todayList = [];           // 每列：見 buildTodayListRow_ 的欄位說明
let departMin = START_MIN;    // 出發時間（分鐘數），小計列可以改，取代原本到處直接讀 START_MIN
let orderMode = 'unordered';  // 'unordered'｜'route'｜'manual'：決定小計列文字跟是否顯示到達時間
let lastRouteLegMinutes = null; // 上次呼叫 Routes API 拿到的每段車程分鐘數——自動排序（calcRoute）
                                 // 跟手動拖曳後重算（recalcManualOrderTimes_）共用同一份資料結構。
let lastRouteResolvedIds = null; // 上面那份車程資料實際對應到哪些站（Set，定位失敗的站沒有送進
                                  // Routes API，不在這裡面）——todayListFinishMin_ 用這個決定要不要
                                  // 消耗一段車程，不是直接假設「前 N 個都算進去了」，手動模式下未定位
                                  // 失敗的站可能出現在清單中間，不能用位置判斷。
let lastRouteStopIds = null;    // 算出 lastRouteLegMinutes 時的站點 id 集合（字串，逗號排序後
                                 // 拼接）——①②欄變動把站點加進/移出清單後，跟這份不一樣就代表
                                 // lastRouteLegMinutes 已經過期，不能再拿來算時間，見 invalidateRouteIfStopsChanged_。

// 站點集合（誰在今日清單裡）跟上次算路線時不一樣了，就讓「依路線順序」的時間資料整組失效，
// 改回「未排序」並提示使用者重新按「計算路線」——寧可不顯示時間，也不要顯示用錯的站點組合算出來、
// 看起來正常但其實不對的到達時間。
function invalidateRouteIfStopsChanged_() {
  if (orderMode === 'unordered') return; // 手動模式('manual')站點變動時也要重新判斷，不是只有 'route'
  const currentIds = todayList.map(r => r.id).sort().join(',');
  if (currentIds === lastRouteStopIds) return;
  orderMode = 'unordered';
  lastRouteLegMinutes = null;
  lastRouteResolvedIds = null;
  lastRouteTotalKm = null;
  todayList.forEach(row => { row.arrival = null; });
}

function anchorSourceTag_(source) {
  if (source === '送貨') return '送貨';
  if (source === '待追蹤') return '待追蹤';
  if (source === '本週排') return '本週排';
  if (source === '今天可以跑的區') return '新店'; // 這個來源目前只用來批量加新店候選
  if (source === '手動') return '錨點'; // store-drawer.js「加入今天」
  if (source === '該對帳' || source === '寄賣待整理') return '寄賣對帳'; // 建議加入卡片（cb.label）
  return '錨點'; // 不認得的來源，保守歸類成「錨點」，不要漏標
}

// 這家店為什麼在今日清單裡（可能同時符合第①②欄多個來源，標籤要全部列出來）。
function todayListTypeTags_(id) {
  const tags = new Set();
  anchors.filter(a => a.id === id).forEach(a => tags.add(anchorSourceTag_(a.source)));
  if (selectedCol2Ids.has(id)) {
    const item = (planData?.recommended || []).find(x => x.id === id);
    tags.add(item?.type === 'new-store' ? '新店' : '客戶');
  }
  return [...tags];
}

function purposeDef_(key) { return VISIT_PURPOSES.find(p => p.key === key); }
function purposeStayMin_(key) { return purposeDef_(key)?.stayMin ?? 20; }
function effectiveStayMin_(row) {
  if (row.manualStayMin != null) return row.manualStayMin;
  if (!row.purposes.length) return 20;
  return Math.max(...row.purposes.map(purposeStayMin_));
}

// 自動預選拜訪目的（使用者可以改）：正式客戶→例行拜訪；新店→新店開發；送貨來源→送貨；
// 寄賣待整理/該對帳/事項文字含「請款」的待追蹤→對帳請款；符合多條就全部預選。
function autoPreselectPurposes_(row) {
  const rec = (planData?.recommended || []).find(x => x.id === row.id);
  const preset = new Set();
  if (rec?.type === 'customer') preset.add('例行拜訪');
  if (rec?.type === 'new-store') preset.add('新店開發');
  if (row.typeTags.includes('送貨')) preset.add('送貨');
  if (rec && consignmentBadge(rec).triggered) preset.add('對帳請款');
  if (row.typeTags.includes('寄賣對帳')) preset.add('對帳請款');
  if (row.typeTags.includes('待追蹤')) {
    const a = anchors.find(x => x.id === row.id && x.source === '待追蹤');
    if (a?.item && String(a.item).includes('請款')) preset.add('對帳請款');
  }
  if (!preset.size) preset.add('例行拜訪'); // 保底，不要有列完全沒有目的
  row.purposes = [...preset];
}

// 「這站要做的事」自動組合：寄賣→對帳N張$金額；送貨→送貨（目前沒有單日訂單金額可用，
// 業務親送自動進錨點時 worker.js 沒有附金額，要顯示金額得先補後端欄位，階段一先不做）；
// 負責人是老爸的店→帳單還老爸／收款交老爸；待追蹤→事項第一行。符合多條就全部列出來。
function buildAutoTask_(row) {
  const parts = [];
  const rec = (planData?.recommended || []).find(x => x.id === row.id);
  if (rec) {
    const cb = consignmentBadge(rec);
    if (cb.triggered) {
      if (rec.consignmentStaleCount > 0) parts.push(`對帳 ${rec.consignmentStaleCount} 張 $${(rec.consignmentStaleTotal || 0).toLocaleString()}`);
      else if (rec.isContracted) parts.push(`對帳 $${(rec.consignmentAllTotal || 0).toLocaleString()}`);
    }
  }
  if (row.typeTags.includes('送貨')) parts.push('送貨');
  if (isDadStore(row.id)) parts.push('帳單還老爸、收款交老爸');
  if (row.typeTags.includes('待追蹤')) {
    const a = anchors.find(x => x.id === row.id && x.source === '待追蹤');
    if (a?.item) parts.push(String(a.item).split('\n')[0]);
  }
  return parts.join('、');
}

// 店家規則狀態：先查 planData.recommended 有沒有現成的 ruleStatus（/api/plan 已經附帶，絕大多數
// 情況走這裡，不用再打一次 API）；找不到（例如手動加入的老爸/新竹/不拜訪客戶，這些被 /api/plan
// 排除在推薦清單外）才打 /api/store 拿該店的規則清單自己算一次——不能直接當「可以去」，否則漏掉
// 真的有規則衝突的店。查詢失敗時明確標「未知」，不偽裝成「可以去」。
const ruleStatusFallbackCache_ = {};
const WEEKDAY_NAMES_TL_ = ['日', '一', '二', '三', '四', '五', '六'];
function matchesWeekdayClient_(weekdaysStr, planDate) {
  if (!weekdaysStr) return false;
  return String(weekdaysStr).split(/[、,]/).map(s => s.trim()).includes(WEEKDAY_NAMES_TL_[planDate.getDay()]);
}
function matchesMonthDayClient_(monthDaysStr, planDate) {
  if (!monthDaysStr) return false;
  const m = String(monthDaysStr).match(/^(\d+)\s*-\s*(\d+)$/);
  if (!m) return false;
  const day = planDate.getDate();
  return day >= parseInt(m[1], 10) && day <= parseInt(m[2], 10);
}
function evalRuleStatusClient_(rules, planDate) {
  const matched = rules.filter(r => {
    if (!r.weekdays && !r.monthDays) return true;
    return matchesWeekdayClient_(r.weekdays, planDate) || matchesMonthDayClient_(r.monthDays, planDate);
  });
  if (!matched.length) return { status: '可以去', rules: [] };
  if (matched.some(r => r.action === '擋住')) return { status: '擋住', rules: matched.map(r => r.note).filter(Boolean) };
  if (matched.some(r => r.action === '自動調整')) return { status: '自動調整', rules: matched.map(r => r.note).filter(Boolean) };
  return { status: '提醒', rules: matched.map(r => r.note).filter(Boolean) };
}
async function resolveRuleStatus_(id) {
  const rec = (planData?.recommended || []).find(x => x.id === id);
  if (rec?.ruleStatus) return rec.ruleStatus;
  if (ruleStatusFallbackCache_[id]) return ruleStatusFallbackCache_[id];
  try {
    const data = await get('/api/store?id=' + encodeURIComponent(id));
    const planDateObj = new Date(getPlanDate().replace(/-/g, '/'));
    const status = evalRuleStatusClient_(data.rules || [], planDateObj);
    ruleStatusFallbackCache_[id] = status;
    return status;
  } catch (e) {
    console.warn('店家規則狀態查詢失敗，標記為未知（不當成可以去）', id, e);
    return { status: '未知', rules: [] };
  }
}

async function buildTodayListRow_(id) {
  const ph = (allPharmaciesCache || []).find(p => p.id === id);
  const rec = (planData?.recommended || []).find(x => x.id === id);
  const anchor = anchors.find(a => a.id === id);
  const row = {
    id,
    name: ph?.name || rec?.name || anchor?.name || id,
    address: ph?.address || rec?.address || '',
    typeTags: [],
    purposes: [], purposesTouched: false,
    otherPurposeText: '', purposeNote: '',
    manualStayMin: null,
    autoTask: '', ruleStatus: null,
    arrival: null, locateMethod: null,
  };
  await refreshTodayListRowMeta_(row);
  return row;
}
async function refreshTodayListRowMeta_(row) {
  row.typeTags = todayListTypeTags_(row.id);
  row.ruleStatus = await resolveRuleStatus_(row.id);
  row.autoTask = buildAutoTask_(row);
  if (!row.purposesTouched) autoPreselectPurposes_(row);
}

// ①②欄任何變動後都呼叫這支，把 anchors∪selectedCol2Ids 合成一次今日清單——同一家店同時出現在
// ①②欄只留一列（用店家代號去重，規格提到的「新開店家沒代號用地址判斷」在目前所有加入①②欄的
// 路徑裡都一定會帶 id，沒有真的會發生的 id-less 情況，先不多寫一套用不到的分支；如果之後有新的
// 「直接輸入店名/地址、完全不經過既有清單」的加入方式，要在這裡補上地址去重）。
async function syncTodayList_() {
  const desiredIds = new Set([...anchors.map(a => a.id), ...selectedCol2Ids]);
  todayList = todayList.filter(row => desiredIds.has(row.id));

  const existingIds = new Set(todayList.map(r => r.id));
  const orderedCandidateIds = [...anchors.map(a => a.id), ...selectedCol2Ids];
  const seen = new Set();
  for (const id of orderedCandidateIds) {
    if (seen.has(id) || existingIds.has(id)) continue;
    seen.add(id);
    todayList.push(await buildTodayListRow_(id));
  }
  for (const row of todayList) {
    if (!seen.has(row.id)) await refreshTodayListRowMeta_(row); // 新列剛 build 過，不用重算一次
  }

  invalidateRouteIfStopsChanged_();
  recomputeTodayListTimes_();
}

function todayListBillingTotal_() {
  let total = 0;
  todayList.forEach(row => {
    const rec = (planData?.recommended || []).find(x => x.id === row.id);
    if (!rec) return;
    const cb = consignmentBadge(rec);
    if (!cb.triggered) return;
    total += rec.consignmentStaleCount > 0 ? (rec.consignmentStaleTotal || 0) : (rec.consignmentAllTotal || 0);
  });
  return total;
}

function renderTodayListSummary_() {
  const el = document.getElementById('today-list-summary');
  if (!el) return;
  if (!todayList.length) { el.innerHTML = '<div class="empty-hint">還沒有任何店家</div>'; return; }
  const counts = {};
  todayList.forEach(row => row.typeTags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const countsText = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join('・');
  const billingTotal = todayListBillingTotal_();
  const orderLabel = orderMode === 'route' ? '依路線順序' : orderMode === 'manual' ? '順序已手動調整' : '未排序';
  // 不在這裡重算——recomputeTodayListTimes_() 已經算過一次並存進 lastComputedFinishMin_，
  // 這裡只負責顯示，避免跟那支各自算一次、萬一邏輯以後分岔就兜不起來。
  const finishText = lastComputedFinishMin_ != null ? fmtMin(lastComputedFinishMin_) : '—（按計算路線）';
  el.innerHTML = `
    <span><strong>${todayList.length} 家</strong>${countsText ? '｜' + escapeHtml(countsText) : ''}${lastRouteTotalKm != null ? `・${lastRouteTotalKm} km` : ''}</span>
    ${billingTotal ? `<span>預估對帳 $${billingTotal.toLocaleString()}</span>` : ''}
    <span>出發 <input type="time" class="tl-depart-input" id="depart-time-input" value="${fmtMin(departMin)}"></span>
    <span>預估收工 ${finishText}</span>
    <span class="tl-order-mode">（${orderLabel}）</span>`;
}

function ruleConflictHtml_(row) {
  if (!row.ruleStatus) return '';
  if (row.ruleStatus.status === '擋住') {
    return `<div class="tl-rule-conflict">⛔ 規則衝突：${row.ruleStatus.rules.map(escapeHtml).join('；') || '店家規則禁止今天拜訪'}</div>`;
  }
  if (row.ruleStatus.status === '提醒' || row.ruleStatus.status === '自動調整') {
    return `<div class="tl-rule-note">⚠ ${row.ruleStatus.rules.map(escapeHtml).join('；')}</div>`;
  }
  if (row.ruleStatus.status === '未知') {
    return `<div class="tl-rule-note">規則狀態查詢失敗，請自行確認是否可以拜訪</div>`;
  }
  return '';
}

function todayListRowHtml_(row, index) {
  const seqLabel = orderMode === 'unordered' ? String(index + 1) : `#${index + 1}`;
  const arrivalText = row.arrival ? fmtMin(row.arrival) : (orderMode === 'unordered' ? '未排序' : '—');
  const stayMin = effectiveStayMin_(row);
  const hasOther = row.purposes.includes('其他');
  return `<div class="tl-row${row.ruleStatus?.status === '擋住' ? ' rule-blocked' : ''}" draggable="true" data-tl-id="${escapeHtml(row.id)}">
    <div class="tl-row-top">
      <span class="tl-seq">${seqLabel}</span>
      <span class="tl-name">${escapeHtml(row.name)}</span>
      <span class="tl-tags">${row.typeTags.map(t => `<span class="tl-tag">${escapeHtml(t)}</span>`).join('')}</span>
      <button class="tl-remove" data-action="remove-today" data-id="${escapeHtml(row.id)}" title="移除（同步取消①②欄勾選）">✕</button>
    </div>
    <div class="tl-purposes">
      ${VISIT_PURPOSES.map(p => `<label class="tl-purpose-chip${row.purposes.includes(p.key) ? ' checked' : ''}">
        <input type="checkbox" data-action="toggle-tl-purpose" data-id="${escapeHtml(row.id)}" data-purpose="${escapeHtml(p.key)}" ${row.purposes.includes(p.key) ? 'checked' : ''}>${escapeHtml(p.key)}
      </label>`).join('')}
    </div>
    ${hasOther ? `<input type="text" class="tl-other-text" data-action="tl-other-text" data-id="${escapeHtml(row.id)}" placeholder="其他：請輸入" value="${escapeHtml(row.otherPurposeText)}">` : ''}
    <input type="text" class="tl-note" data-action="tl-note" data-id="${escapeHtml(row.id)}" placeholder="目的備註（例如帶新品試用包）" value="${escapeHtml(row.purposeNote)}">
    ${row.autoTask ? `<div class="tl-auto-task">${escapeHtml(row.autoTask)}</div>` : ''}
    ${ruleConflictHtml_(row)}
    <div class="tl-row-bottom">
      <span>停留 <input type="number" class="tl-stay-input" min="5" step="5" data-action="tl-stay-min" data-id="${escapeHtml(row.id)}" value="${stayMin}">分</span>
      ${row.locateMethod ? `<span class="tl-method${row.locateMethod === 'name' ? ' by-name' : ''}">用${locateMethodLabel_(row.locateMethod)}定位</span>` : ''}
      <span class="tl-arrival">${arrivalText}</span>
    </div>
  </div>`;
}

function renderTodayList_() {
  renderTodayListSummary_();
  const root = document.getElementById('today-list-root');
  if (!root) return;
  if (!todayList.length) { root.innerHTML = '<div class="empty-hint">在第①②欄選好店家後，這裡會立即出現清單</div>'; return; }
  root.innerHTML = todayList.map((row, i) => todayListRowHtml_(row, i)).join('');
}

// 只重算時間，不重打 Routes API（除非是手動拖曳剛發生，見 recalcManualOrderTimes_ 那支才會打）——
// 用上次拿到的每段車程分鐘數（lastRouteLegMinutes）配合目前的出發時間/各站停留分鐘重新往下推。
// 用 lastRouteResolvedIds（Set）判斷哪些站真的有車程資料可以消耗，不是用「前N個」這種位置假設——
// 手動拖曳模式下，定位失敗的站可能出現在清單中間，不能假設它們都在最後面。
function todayListFinishMin_() {
  let cum = departMin;
  let legIdx = 0;
  todayList.forEach(row => {
    if (!lastRouteResolvedIds.has(row.id)) { row.arrival = null; return; }
    cum += lastRouteLegMinutes[legIdx++];
    row.arrival = Math.round(cum);
    cum += effectiveStayMin_(row);
  });
  return Math.round(cum + lastRouteLegMinutes[legIdx]);
}
let lastComputedFinishMin_ = null; // renderTodayListSummary_ 顯示用，跟 #finish-time-value 同一個數字來源
function recomputeTodayListTimes_() {
  const finishEl = document.getElementById('finish-time-value');
  if (!lastRouteLegMinutes || !lastRouteResolvedIds || !todayList.length) {
    todayList.forEach(row => { row.arrival = null; });
    lastComputedFinishMin_ = null;
    if (finishEl) { finishEl.textContent = '—'; finishEl.classList.remove('late'); }
    renderTodayList_();
    return;
  }
  const homeArrival = todayListFinishMin_();
  lastComputedFinishMin_ = homeArrival;
  if (finishEl) { finishEl.textContent = fmtMin(homeArrival); finishEl.classList.toggle('late', homeArrival > 17 * 60 + 30); }
  renderTodayList_();
}

async function removeTodayListRow_(id) {
  const ai = anchors.findIndex(a => a.id === id);
  if (ai >= 0) anchors.splice(ai, 1);

// 用「目前 todayList 的順序」（不重排）打一次 Routes API 拿車程，只為了算時間——跟 calcRoute()
// 的差別：intermediates 不設 optimizeWaypointOrder（固定 false），且不會重新排 todayList 的順序
// （定位失敗的站就留在原本的位置，不像 calcRoute 那樣挪到最後面，因為手動模式下順序是使用者自己
// 排的，不該因為某一站定位失敗就被我們動位置）。
async function recalcManualOrderTimes_() {
  if (!todayList.length) return;
  const warnEl = document.getElementById('today-list-warnings');
  const btn = document.getElementById('btn-calc-route');
  if (warnEl) warnEl.innerHTML = '';
  if (btn) { btn.disabled = true; btn.textContent = '重算時間中…'; }
  try {
    await loadAllPharmacies();
    const locations = await Promise.all(todayList.map(row => resolveStoreLocation_(row.id, row.name)));
    const warnings = [];
    const resolved = [];
    todayList.forEach((row, i) => {
      const loc = locations[i];
      row.locateMethod = loc.method;
      if (loc.lat && loc.lng) resolved.push({ row, loc });
      else if (loc.warning) warnings.push(loc.warning);
    });
    if (!resolved.length) throw new Error('所有站點都定位失敗，無法重算時間');

    const intermediates = resolved.map(r => ({ location: { latLng: { latitude: r.loc.lat, longitude: r.loc.lng } } }));
    const routeResp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GMAPS_KEY,
        'X-Goog-FieldMask': 'routes.legs.distanceMeters,routes.legs.duration',
      },
      body: JSON.stringify({
        origin: { address: ORIGIN_ADDR }, destination: { address: DEST_ADDR },
        intermediates, travelMode: 'DRIVE', optimizeWaypointOrder: false, // 手動順序，不能重排
      }),
    });
    if (!routeResp.ok) {
      const errData = await routeResp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${routeResp.status}`);
    }
    const routeData = await routeResp.json();
    if (!routeData.routes?.length) throw new Error('找不到路線');
    const legs = routeData.routes[0].legs;
    lastRouteTotalKm = Math.round(legs.reduce((sum, leg) => sum + leg.distanceMeters, 0) / 1000);
    lastRouteLegMinutes = legs.map(leg => parseInt(leg.duration) / 60);
    lastRouteResolvedIds = new Set(resolved.map(r => r.row.id));
    lastRouteStopIds = todayList.map(r => r.id).sort().join(',');

    recomputeTodayListTimes_();
    window._confirmedRoute = todayList.map((row, i) => ({
      id: row.id, name: row.name, isAnchor: anchors.some(a => a.id === row.id),
      seq: i + 1, arrival: row.arrival, locateMethod: row.locateMethod,
    }));
    renderMapRoutePanel();
    if (viewMode === 'map') renderMap();
    if (warnEl && warnings.length) {
      warnEl.innerHTML = `<div class="route-warning-banner">${warnings.map(w => escapeHtml(w)).join('<br>')}</div>`;
    }
  } catch (e) {
    if (warnEl) warnEl.innerHTML = `<div class="empty-hint">重算時間失敗：${escapeHtml(e.message)}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '計算路線'; }
  }
}

function distanceToNearestAnchorText(id) {
  const byId = {}; (allPharmaciesCache || []).forEach(p => { byId[p.id] = p; });
  const target = byId[id];
  if (!target?.lat || !target?.lng || !anchors.length) return '—';
  let min = Infinity;
  anchors.forEach(a => {
    const ph = byId[a.id];
    if (!ph?.lat || !ph?.lng) return;
    const d = haversineKm(target.lat, target.lng, ph.lat, ph.lng);
    if (d < min) min = d;
  });
  return isFinite(min) ? (Math.round(min * 10) / 10) + ' 公里' : '—';
}

async function renderMap() {
  await Promise.all([loadGoogleMapsSdk(), loadAllPharmacies()]);
  if (!srMap) {
    srMap = new google.maps.Map(document.getElementById('sr-map'), {
      center: { lat: 25.065, lng: 121.658 }, zoom: 11,

    });

  }
  srMapInfoWindow.close();
  srMapMarkers.forEach(m => m.setMap(null)); srMapMarkers = [];
  srMapCircles.forEach(c => c.setMap(null)); srMapCircles = [];
  if (srMapPolyline) { srMapPolyline.setMap(null); srMapPolyline = null; }

  const route = window._confirmedRoute || null;
  const seqById = {}; (route || []).forEach(s => { seqById[s.id] = s.seq; });

  // ①②③ 要畫的店統一先定位一次（跟 calcRoute 共用 resolveStoreLocation_，新店/只有地址的店
  // 這裡也畫得出來；查過的存在 geocodeCache_，同一家店不會重複打 API，2026-11-04 使用者要求）。
  const visible = visibleRecommendList();
  const nameById_ = {};
  anchors.forEach(a => { nameById_[a.id] = a.name; });
  visible.forEach(item => { nameById_[item.id] = item.name; });
  (planData?.recommended || []).forEach(item => { if (!nameById_[item.id]) nameById_[item.id] = item.name; });
  const neededIds_ = new Set([...anchors.map(a => a.id), ...selectedCol2Ids, ...visible.map(item => item.id)]);
  const locById = {};
  await Promise.all([...neededIds_].map(async id => { locById[id] = await resolveStoreLocation_(id, nameById_[id] || id); }));

  const bounds = new google.maps.LatLngBounds();
  let anyBounds = false;
  function extend(lat, lng) { bounds.extend({ lat, lng }); anyBounds = true; }

  // ① 錨點：28px 深色圓、白色站號（還沒計算路線前沒有站號）＋ 2 公里範圍圈
  anchors.forEach(a => {
    const loc = locById[a.id];
    if (!loc?.lat || !loc?.lng) return;
    const marker = new google.maps.Marker({
      position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: a.name, zIndex: 20,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: cssVar('--sr-ink'), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
      label: seqById[a.id] ? { text: String(seqById[a.id]), color: cssVar('--sr-on-dark'), fontSize: '11px', fontWeight: 'bold' } : null,
    });
    marker.addListener('click', () => openMapInfo(marker, { id: a.id, name: a.name, kind: 'anchor', anchorMeta: a }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
    // 2 公里範圍圈：DESIGN.md 寫虛線，google.maps.Circle 不支援虛線樣式（要畫虛線得改用 Polygon
    // 近似圓形並掛 icons，複雜度高很多）——這次先用純色細圈代替，保守簡化，之後要再精緻化再改（WORKLOG 記錄）。
    const circle = new google.maps.Circle({
      map: srMap, center: { lat: loc.lat, lng: loc.lng }, radius: RADIUS_KM * 1000,
      strokeColor: cssVar('--sr-primary'), strokeOpacity: 0.8, strokeWeight: 2,
      fillColor: cssVar('--sr-primary-tint'), fillOpacity: 0.12, clickable: false,
    });
    srMapCircles.push(circle);
  });

  // ② 補的站：已勾選加入路線、但不是錨點的店，28px primary 色圓
  const visibleById = {}; visible.forEach(x => { visibleById[x.id] = x; });
  selectedCol2Ids.forEach(id => {
    const loc = locById[id];
    if (!loc?.lat || !loc?.lng) return;
    const item = visibleById[id] || (planData?.recommended || []).find(x => x.id === id);
    const marker = new google.maps.Marker({
      position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: item?.name || id, zIndex: 15,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: cssVar('--sr-primary'), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
      label: seqById[id] ? { text: String(seqById[id]), color: cssVar('--sr-on-dark'), fontSize: '11px', fontWeight: 'bold' } : null,
    });
    marker.addListener('click', () => openMapInfo(marker, { id, name: item?.name || id, kind: 'selected', item }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
  });

  // ③ 候選店（清單目前顯示、尚未勾選）：14px 小圓，正式客戶依 4.4 倍數分級上色，開發中空心圓
  visible.forEach(item => {
    if (selectedCol2Ids.has(item.id)) return; // ②已經畫過
    const loc = locById[item.id];
    if (!loc?.lat || !loc?.lng) return;
    const isNewStore = item.type === 'new-store';
    const icon = isNewStore
      ? { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: cssVar('--sr-bg'), fillOpacity: 1, strokeColor: cssVar('--sr-ink'), strokeWeight: 2 }
      : { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: cssVar(ratioColorVar(ratioTierOf(item.ratio))), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1 };
    const marker = new google.maps.Marker({ position: { lat: loc.lat, lng: loc.lng }, map: srMap, title: item.name, icon, zIndex: 10 });
    marker.addListener('click', () => openMapInfo(marker, { id: item.id, name: item.name, kind: 'candidate', item }));
    srMapMarkers.push(marker);
    extend(loc.lat, loc.lng);
  });

  // ④ 路線線：直線段連接目前已算好的站點順序，不是實際路網線（不解析 Routes API 回傳的
  // encoded polyline，避免多引入 Maps JavaScript 的 geometry library，保守簡化，WORKLOG 記錄）
  if (route && route.length > 1) {
    const path = route.map(s => { const loc = locById[s.id]; return loc?.lat && loc?.lng ? { lat: loc.lat, lng: loc.lng } : null; }).filter(Boolean);
    if (path.length > 1) {
      srMapPolyline = new google.maps.Polyline({ path, geodesic: true, strokeColor: cssVar('--sr-primary'), strokeOpacity: 0.9, strokeWeight: 4, map: srMap });
    }
  }

  if (anyBounds) srMap.fitBounds(bounds, 60);
  renderMapRoutePanel();
}

function normalizeCityChar_(s) {

}
// 查地址/店名的座標，用 Places API (New) 的 Text Search，不是 Geocoding API——2026-11-04 實測
// 發現這把 GMAPS_KEY 設了 HTTP referrer 限制，Geocoding API／舊版 Places API 這類「伺服器端」
// API 一律拒絕 referrer 限制的 key（Google 平台規則，跟是誰呼叫、有沒有送 Referer header 都
// 無關，連後端呼叫也一樣被擋，回應是「API keys with referer restrictions cannot be used with
// this API」）；Places API (New) 才支援 referrer 限制的 key，但要先在 Google Cloud Console 把
// 這把 key 的「API 限制」清單加上 Places API (New)，沒開會收到 API_KEY_SERVICE_BLOCKED。
// locationBias 只是偏好提示（跟原本 Geocoding API 的 bounds 參數一樣不是硬性範圍），呼叫端要
// 自己用 inServiceArea_() 檢查結果。
async function geocodeQuery_(query) {
  const r = await fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': GMAPS_KEY,
      'X-Goog-FieldMask': 'places.location,places.formattedAddress',
    },
    body: JSON.stringify({
      textQuery: query,
      languageCode: 'zh-TW',
      regionCode: 'TW',
      locationBias: { rectangle: { low: { latitude: 24.9, longitude: 121.4 }, high: { latitude: 25.2, longitude: 121.75 } } },
    }),
  });
  const d = await r.json();
  const place = d.places?.[0];
  if (!place?.location) return null;
  return { lat: place.location.latitude, lng: place.location.longitude, formattedAddress: place.formattedAddress || '' };
}

// 查過的店存在這裡，同一次瀏覽（重新整理會清空）不重複打 API——calcRoute／renderMap 共用。
const geocodeCache_ = {};

// 新店定位查到之後存回 Worker（geo:<id> KV，不設過期），下次 /api/plan 會直接附上 lat/lng，
// 地圖模式就不用每次重新整理都重打 Places API（每日上限 300 次）。失敗（例如剛好超過額度）
// 不影響這次畫面，記個 console.warn 就好，下次還是會再查一次。不等它完成（fire-and-forget）。
function saveGeoToServer_(id, address, lat, lng) {
  post('/api/geo', { id, address: address || '', lat, lng }).catch(e => {
    console.warn('/api/geo 存檔失敗（不影響這次畫面，下次會再查一次）', id, e);
  });
}

// 回傳 { lat, lng, method: 'coord'|'address'|'name', warning: string|null }。
// lat/lng 為 null 代表這家店這次定位失敗（超出範圍或查無結果），呼叫端要跳過、不要拿去算路線/畫地圖。
async function resolveStoreLocation_(id, name) {
  if (geocodeCache_[id]) return geocodeCache_[id];

  const ph = (allPharmaciesCache || []).find(p => p.id === id);
  const rec = (planData?.recommended || []).find(item => item.id === id);

  // ① 客戶表座標，或 /api/plan 已經附上的新店座標（後端 geo:<id> 永久快取）：直接信任
  if (ph?.lat && ph?.lng) {
    const result = { lat: ph.lat, lng: ph.lng, method: 'coord', warning: null };
    geocodeCache_[id] = result;
    return result;
  }
  if (rec?.lat && rec?.lng) {
    const result = { lat: rec.lat, lng: rec.lng, method: 'coord', warning: null };
    geocodeCache_[id] = result;
    return result;
  }

  // ② 地址：客戶表 or planData.recommended（新店項目）哪裡有地址就用哪裡
  const originalAddress = ph?.address || rec?.address || '';
  let address = originalAddress;
  const city = ph?.city || rec?.city || '';
  const district = ph?.district || rec?.district || '';
  if (address && city && !normalizeCityChar_(address).startsWith(normalizeCityChar_(city))) {
    address = city + district + address; // 地址開頭沒有縣市，自動補上
  }
  if (address) {
    const geo = await geocodeQuery_(address);
    if (geo && inServiceArea_(geo.lat, geo.lng)) {
      const result = { lat: geo.lat, lng: geo.lng, method: 'address', warning: null };
      geocodeCache_[id] = result;
      saveGeoToServer_(id, originalAddress, geo.lat, geo.lng);
      return result;
    }
    if (geo) {
      // 地址查到了，但結果超出服務範圍——地址本身可能有問題，不要再退回去用店名猜（那正是原本
      // 誤查到外縣市同名店的那條路），直接標可疑。可疑的不存進永久快取，下次還是會再查一次。
      const result = {
        lat: null, lng: null, method: 'address',
        warning: `⚠ 定位可疑：${name}（查到${extractCityFromAddress_(geo.formattedAddress)}），請確認地址`,
      };
      geocodeCache_[id] = result;
      return result;
    }
    // 地址完全查無結果（可能地址打錯/不完整），才退到用店名試最後一次
  }

  // ③ 店名
  const geo = await geocodeQuery_(name + ' 台灣');
  if (geo && inServiceArea_(geo.lat, geo.lng)) {
    const result = { lat: geo.lat, lng: geo.lng, method: 'name', warning: null };
    geocodeCache_[id] = result;
    saveGeoToServer_(id, originalAddress, geo.lat, geo.lng);
    return result;
  }
  const result = {
    lat: null, lng: null, method: 'name',
    warning: geo
      ? `⚠ 定位可疑：${name}（查到${extractCityFromAddress_(geo.formattedAddress)}），請確認地址`
      : `⚠ 定位可疑：${name}（查無結果），請確認地址`,
  };
  geocodeCache_[id] = result; // 查無結果／可疑都不存進永久快取
  return result;
}

let lastRouteTotalKm = null;

async function calcRoute() {
  const btn = document.getElementById('btn-calc-route');
  const warnEl = document.getElementById('today-list-warnings');
  // 用店家代號去重：同一家店從①②欄都加進來時，只送一個站點給 Routes API，不要重複算、
  // 重複停留兩次（今日清單規格 1-1「同一家店不得重複」，原本這裡沒去重，是潛在的重複站 bug）。
  const stopMap = new Map();
  anchors.forEach(a => { if (!stopMap.has(a.id)) stopMap.set(a.id, { id: a.id, name: a.name, isAnchor: true }); });
  (planData?.recommended || []).filter(item => selectedCol2Ids.has(item.id)).forEach(item => {
    if (!stopMap.has(item.id)) stopMap.set(item.id, { id: item.id, name: item.name, isAnchor: false });
    else stopMap.get(item.id).isAnchor = true; // 本來就是錨點，不要因為②欄也勾了就被蓋掉
  });
  const allStops = [...stopMap.values()];
  if (!allStops.length) { alert('第①②欄還沒有選任何店家'); return; }

  btn.disabled = true; btn.textContent = '計算中…';
  if (warnEl) warnEl.innerHTML = '';
  document.getElementById('btn-confirm-route').style.display = 'none';
  try {
    await loadAllPharmacies(); // 確保 allPharmaciesCache 已載好，resolveStoreLocation_ 才查得到客戶表座標/地址

    // 統一定位邏輯（見 resolveStoreLocation_ 註解）：定位失敗（超出服務範圍或查無結果）的站不送進
    // Routes API 算路線，改收進 warnings 顯示紅字提示，不讓一家店定位錯誤拖垮整條路線的計算。
    const locations = await Promise.all(allStops.map(s => resolveStoreLocation_(s.id, s.name)));
    const warnings = [];
    const stops = [];
    allStops.forEach((s, i) => {
      const loc = locations[i];
      if (loc.lat && loc.lng) stops.push({ ...s, loc });
      else if (loc.warning) warnings.push(loc.warning);
    });
    if (!stops.length) throw new Error('所有站點都定位失敗，無法計算路線');

    const intermediates = stops.map(s => ({ location: { latLng: { latitude: s.loc.lat, longitude: s.loc.lng } } }));

    const routeResp = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GMAPS_KEY,
        'X-Goog-FieldMask': 'routes.polyline,routes.legs.distanceMeters,routes.legs.duration,routes.optimizedIntermediateWaypointIndex',
      },
      body: JSON.stringify({
        origin: { address: ORIGIN_ADDR }, destination: { address: DEST_ADDR },
        intermediates, travelMode: 'DRIVE', optimizeWaypointOrder: true,
      }),
    });
    if (!routeResp.ok) {
      const errData = await routeResp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${routeResp.status}`);
    }
    const routeData = await routeResp.json();
    if (!routeData.routes?.length) throw new Error('找不到路線');
    const route0 = routeData.routes[0];
    const orderRaw = route0.optimizedIntermediateWaypointIndex;
    const order = (Array.isArray(orderRaw) && orderRaw.length === stops.length) ? orderRaw : stops.map((_, i) => i);
    const legs = route0.legs;
    const reordered = order.map(i => stops[i]).filter(Boolean);
    lastRouteTotalKm = Math.round(legs.reduce((sum, leg) => sum + leg.distanceMeters, 0) / 1000);
    // 站數+1：出發→站1、站1→站2…、最後一站→目的地。recomputeTodayListTimes_/todayListFinishMin_
    // 用這份資料配合目前的出發時間/停留分鐘重算，之後只改時間相關設定都不用再打一次這支 API。
    lastRouteLegMinutes = legs.map(leg => parseInt(leg.duration) / 60);

    // 把今日清單重新排成路線順序：定位失敗的站（warnings 裡那些）留在清單裡但排到最後面，
    // 不會因為沒算進路線就整個消失——使用者還是看得到、知道要自己確認地址。
    const resolvedIds = reordered.map(s => s.id);
    const locateMethodById = {}; reordered.forEach(s => { locateMethodById[s.id] = s.loc.method; });
    const resolvedRows = resolvedIds.map(id => todayList.find(r => r.id === id)).filter(Boolean);
    const unresolvedRows = todayList.filter(r => !resolvedIds.includes(r.id));
    todayList = [...resolvedRows, ...unresolvedRows];
    todayList.forEach(row => { row.locateMethod = locateMethodById[row.id] || null; });
    orderMode = 'route';
    lastRouteResolvedIds = new Set(resolvedIds);
    lastRouteStopIds = todayList.map(r => r.id).sort().join(',');

    recomputeTodayListTimes_();

    window._confirmedRoute = todayList.map((row, i) => ({
      id: row.id, name: row.name, isAnchor: anchors.some(a => a.id === row.id),
      seq: i + 1, arrival: row.arrival, locateMethod: row.locateMethod,
    }));
    renderMapRoutePanel();
    if (viewMode === 'map') renderMap();

    if (warnEl && warnings.length) {
      warnEl.innerHTML = `<div class="route-warning-banner">${warnings.map(w => escapeHtml(w)).join('<br>')}</div>`;
    }
    document.getElementById('btn-confirm-route').style.display = '';
  } catch (e) {
    if (warnEl) warnEl.innerHTML = `<div class="empty-hint">路線計算失敗：${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '計算路線';
  }
}

async function confirmRoute() {
  if (!window._confirmedRoute) return;
  const btn = document.getElementById('btn-confirm-route');
  await withBusy(btn, '存檔中…', async () => {
    await savePlanState();
    toast('已存檔（手機外勤模式讀取這份路線的部分之後會另外接）');
  });
}
</script>
