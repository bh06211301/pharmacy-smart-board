<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>外勤模式 💊</title>
<style>
:root {
  --bg:#f0f2f8;--white:#fff;--border:#e4e7f0;
  --accent:#3b6ef5;--green:#10b981;--orange:#f97316;
  --red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;
  --text:#101828;--muted:#6b7280;
  --radius:16px;
  --shadow:0 2px 12px rgba(16,24,40,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,'SF Pro Display','Inter',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;max-width:480px;margin:0 auto;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  padding:16px 20px 18px;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.header-title{color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-date{color:rgba(255,255,255,.6);font-size:11px;font-weight:500}
.header-badges{display:flex;gap:8px;align-items:center}
.hbadge{
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  color:#fff;padding:5px 11px;border-radius:20px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;
}
.progress-info{display:flex;justify-content:space-between;margin-bottom:7px}
.progress-label{color:rgba(255,255,255,.7);font-size:12px}
.progress-count{color:#fff;font-size:12px;font-weight:700}
.progress-track{height:8px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}
.progress-fill{
  height:100%;background:linear-gradient(90deg,#10b981,#34d399);
  border-radius:10px;transition:width .6s cubic-bezier(.34,1.56,.64,1);
  width:0%;
}

/* ── CONTENT ── */
.content{padding:16px;padding-bottom:90px}
.section-title{
  font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:12px;margin-top:4px;
}

/* ── PHARMACY CARD ── */
.ph-card{
  background:var(--white);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;
  box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
  border-left:4px solid transparent;
}
.ph-card:active{transform:scale(.985)}
.ph-card.done{opacity:.55}
.ph-card.done::after{
  content:'✓ 完成';position:absolute;top:14px;right:14px;
  background:var(--green);color:#fff;
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
}

.card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.char-emoji{font-size:52px;line-height:1;flex-shrink:0;user-select:none}
.card-meta{flex:1;min-width:0}
.card-name{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.type-badge{
  font-size:11px;font-weight:700;padding:2px 9px;
  border-radius:10px;white-space:nowrap;
}
.district-tag{font-size:12px;color:var(--muted)}
.hearts{font-size:17px;letter-spacing:1px;line-height:1}

/* ── MOOD BUBBLE ── */
.mood-bubble{
  background:#f8f9ff;border:1px solid var(--border);
  border-radius:12px;border-bottom-left-radius:4px;
  padding:11px 14px;margin-bottom:12px;
  display:flex;align-items:flex-start;gap:9px;
}
.mood-emoji{font-size:26px;flex-shrink:0;margin-top:1px;user-select:none}
.mood-text{font-size:14px;color:var(--text);line-height:1.55;font-style:italic}

/* ── CARD STATS ── */
.card-stats{display:flex;gap:18px;margin-bottom:14px}
.cs-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.cs-item strong{color:var(--text);font-weight:600}

/* ── CHECK-IN BUTTON ── */
.checkin-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;user-select:none;
}
.checkin-btn:active{transform:scale(.97);opacity:.9}
.pts-tag{
  background:rgba(255,255,255,.25);padding:2px 8px;
  border-radius:10px;font-size:12px;
}

/* ── MISSION COMPLETE BANNER ── */
.mission-banner{
  background:linear-gradient(135deg,#064e3b,#065f46);
  border-radius:var(--radius);padding:28px 24px;
  text-align:center;color:#fff;margin-bottom:12px;
  display:none;
}
.mission-banner.show{display:block}
.mission-banner .trophy{font-size:56px;margin-bottom:10px}
.mission-banner h2{font-size:22px;font-weight:800;margin-bottom:6px}
.mission-banner p{font-size:14px;opacity:.8;line-height:1.5}
.mission-stats{
  display:flex;gap:12px;justify-content:center;margin-top:16px;
}
.mstat{
  background:rgba(255,255,255,.15);border-radius:10px;
  padding:8px 16px;font-size:13px;font-weight:700;
}

/* ── STATS PAGE ── */
.stats-wrap{display:none}
.stats-wrap.active{display:block}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat-box{
  background:var(--white);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);text-align:center;
}
.stat-box .num{font-size:42px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-box .lbl{font-size:12px;color:var(--muted)}
.shield-explain{
  background:var(--white);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
  display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;
}
.shield-explain .icon{font-size:36px;flex-shrink:0}
.shield-explain .info h3{font-size:14px;font-weight:700;margin-bottom:4px}
.shield-explain .info p{font-size:12px;color:var(--muted);line-height:1.55}
.best-streak-box{
  background:linear-gradient(135deg,var(--accent),var(--purple));
  border-radius:var(--radius);padding:20px;
  color:#fff;text-align:center;box-shadow:var(--shadow);
}
.best-streak-box .num{font-size:48px;font-weight:800;margin-bottom:4px}
.best-streak-box .lbl{font-size:13px;opacity:.85}

/* ── LOADING ── */
.loading-wrap{padding:40px;text-align:center;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px;
}

/* ── CHECK-IN OVERLAY ── */
.checkin-overlay{
  position:fixed;inset:0;
  background:rgba(10,12,30,.88);backdrop-filter:blur(6px);
  z-index:500;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px 32px;
}
.checkin-overlay.open{display:flex}

@keyframes bounceIn{
  0%{transform:scale(0);opacity:0}
  55%{transform:scale(1.25)}
  100%{transform:scale(1);opacity:1}
}
@keyframes slideUp{
  from{transform:translateY(24px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
@keyframes pulse{
  0%,100%{transform:scale(1)}50%{transform:scale(1.05)}
}

.ov-char{font-size:80px;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both;margin-bottom:4px;user-select:none}
.ov-mood{font-size:40px;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;margin-bottom:16px;user-select:none}
.ov-name{color:rgba(255,255,255,.6);font-size:13px;font-weight:600;margin-bottom:6px;animation:slideUp .4s ease .15s both}
.ov-msg{color:#fff;font-size:19px;font-weight:700;text-align:center;margin-bottom:6px;animation:slideUp .4s ease .2s both}
.ov-sub{color:rgba(255,255,255,.65);font-size:14px;text-align:center;margin-bottom:22px;animation:slideUp .4s ease .3s both;font-style:italic}
.ov-points{
  background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#fff;font-size:24px;font-weight:800;
  padding:10px 32px;border-radius:20px;margin-bottom:14px;
  animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) .4s both;
}
.ov-hearts{font-size:22px;margin-bottom:28px;animation:slideUp .4s ease .5s both;letter-spacing:2px}
.ov-btn{
  background:#fff;color:var(--text);border:none;
  padding:14px 36px;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  animation:slideUp .4s ease .6s both;
  width:100%;max-width:280px;
}
.ov-btn:active{transform:scale(.97)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--white);border-top:1px solid var(--border);
  display:flex;padding:8px 0 env(safe-area-inset-bottom,8px);
  box-shadow:0 -4px 12px rgba(0,0,0,.06);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px;cursor:pointer;border:none;background:none;
  color:var(--muted);font-size:10px;font-weight:600;transition:color .15s;
  text-decoration:none;
}
.nav-btn .ni{font-size:22px}
.nav-btn.active{color:var(--accent)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--text);color:#fff;
  padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  z-index:900;white-space:nowrap;
  opacity:0;transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">💊 今日外勤</div>
      <div class="header-date" id="header-date"></div>
    </div>
    <div class="header-badges">
      <div class="hbadge">🔥 <span id="streak-num">0</span> 天</div>
      <div class="hbadge">🛡️ <span id="shield-num">0</span></div>
    </div>
  </div>
  <div class="progress-info">
    <span class="progress-label">今日使命</span>
    <span class="progress-count"><span id="done-num">0</span> / <span id="total-num">—</span> 家</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill"></div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- MAIN: 今日使命 -->
  <div id="main-wrap">
    <div class="section-title">今日優先拜訪</div>
    <div id="mission-banner" class="mission-banner">
      <div class="trophy">🏆</div>
      <h2>今日使命達成！</h2>
      <p id="mission-msg">所有優先藥局都拜訪完了，辛苦了！</p>
      <div class="mission-stats">
        <div class="mstat">✅ <span id="mb-done">0</span> 家</div>
        <div class="mstat">⭐ <span id="mb-pts">0</span> 分</div>
        <div class="mstat">🔥 <span id="mb-streak">0</span> 天連勝</div>
      </div>
    </div>
    <div id="cards-wrap">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div>載入今日藥局中...</div>
      </div>
    </div>
  </div>

  <!-- STATS: 我的統計 -->
  <div id="stats-wrap" class="stats-wrap">
    <div class="section-title">今日成果</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="num" id="s-done" style="color:var(--green)">0</div>
        <div class="lbl">完成拜訪</div>
      </div>
      <div class="stat-box">
        <div class="num" id="s-pts" style="color:var(--yellow)">0</div>
        <div class="lbl">今日積分</div>
      </div>
    </div>
    <div class="section-title" style="margin-top:8px">連勝系統</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="num" style="color:var(--orange)">🔥 <span id="s-streak">0</span></div>
        <div class="lbl">目前連勝天數</div>
      </div>
      <div class="stat-box">
        <div class="num" style="font-size:32px">🛡️ <span id="s-shields">0</span></div>
        <div class="lbl">保護盾</div>
      </div>
    </div>
    <div class="shield-explain">
      <div class="icon">🛡️</div>
      <div class="info">
        <h3>保護盾是什麼？</h3>
        <p>每連勝 5 天自動獲得 1 個保護盾。<br>
        某天沒達標時，自動消耗 1 個盾保護連勝不中斷。<br>
        讓系統更人性化，壞日子不用擔心。</p>
      </div>
    </div>
    <div class="best-streak-box">
      <div class="num">🏅 <span id="s-best">0</span></div>
      <div class="lbl">歷史最長連勝</div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
    <span class="ni">🗺️</span>今日使命
  </button>
  <button class="nav-btn" id="nav-stats" onclick="switchTab('stats')">
    <span class="ni">📊</span>我的統計
  </button>
  <a class="nav-btn" href="index.html">
    <span class="ni">🖥️</span>桌機版
  </a>
</div>

<!-- CHECK-IN OVERLAY -->
<div class="checkin-overlay" id="ov">
  <div class="ov-char" id="ov-char">🦊</div>
  <div class="ov-mood" id="ov-mood">😄</div>
  <div class="ov-name" id="ov-name">康健藥局</div>
  <div class="ov-msg" id="ov-msg">謝謝你來看我！</div>
  <div class="ov-sub" id="ov-sub">感情值 +1</div>
  <div class="ov-points" id="ov-pts">+20 分</div>
  <div class="ov-hearts" id="ov-hearts">❤️❤️❤️❤️❤️</div>
  <button class="ov-btn" onclick="closeCheckin()">繼續下一家 →</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://still-meadow-0efd.bh06211301.workers.dev';
let cards = [];
let today = null;
let streak = null;

// ── DATE ──────────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function yesterdayStr() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}
function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
}

// ── STREAK ────────────────────────────────────────────────────
function loadStreak() {
  const raw = localStorage.getItem('field_streak');
  return raw ? JSON.parse(raw) : { count: 0, lastDate: null, shields: 0, best: 0 };
}
function saveStreak(s) { localStorage.setItem('field_streak', JSON.stringify(s)); }

function loadToday() {
  const t = todayStr();
  const raw = localStorage.getItem('field_today');
  if (raw) {
    const d = JSON.parse(raw);
    if (d.date === t) return d;
  }
  return { date: t, done: [], pts: 0 };
}
function saveToday(d) { localStorage.setItem('field_today', JSON.stringify(d)); }

function initStreak() {
  const s = loadStreak();
  const t = todayStr(), y = yesterdayStr();
  if (s.lastDate && s.lastDate !== t && s.lastDate !== y) {
    if (s.shields > 0) { s.shields--; }
    else { s.count = 0; }
    saveStreak(s);
  }
  return s;
}

function onMissionComplete() {
  const s = loadStreak();
  const t = todayStr(), y = yesterdayStr();
  if (s.lastDate === t) return s;
  if (s.lastDate === y || s.count === 0) s.count++;
  else s.count = 1;
  s.lastDate = t;
  if (s.count > s.best) s.best = s.count;
  if (s.count % 5 === 0) {
    s.shields++;
    showToast(`🛡️ 獲得保護盾！連勝 ${s.count} 天達成`);
  }
  saveStreak(s);
  return s;
}

// ── CHARACTER ─────────────────────────────────────────────────
function charType(daysSince, totalAmt) {
  const d = daysSince, a = totalAmt || 0;
  if (d === null || d === undefined)
    return { emoji: '🐣', label: '新朋友', color: '#d97706', bg: '#fffbeb' };
  if (a > 20000 && d < 30)
    return { emoji: '🦁', label: '大金主', color: '#ea580c', bg: '#fff7ed' };
  if (a > 20000 && d >= 30)
    return { emoji: '🦊', label: '神秘大戶', color: '#7c3aed', bg: '#f5f3ff' };
  if (d > 90)
    return { emoji: '🍂', label: '快失聯', color: '#dc2626', bg: '#fef2f2' };
  if (a === 0)
    return { emoji: '🐢', label: '慢熱型', color: '#059669', bg: '#f0fdf4' };
  if (d <= 7)
    return { emoji: '🐘', label: '老朋友', color: '#2563eb', bg: '#eff6ff' };
  return { emoji: '🐘', label: '老朋友', color: '#6b7280', bg: '#f9fafb' };
}

function charMood(daysSince) {
  const d = daysSince;
  if (d === null || d === undefined)
    return { emoji: '😄', say: '你好你好！我還不認識你呢～', after: '感謝你第一次來看我！' };
  if (d <= 7)
    return { emoji: '😄', say: '嘿嘿你又來啦！', after: '我就知道你不會忘記我！' };
  if (d <= 14)
    return { emoji: '😊', say: '最近還不錯喔，謝謝你過來', after: '下次還要來哦！' };
  if (d <= 21)
    return { emoji: '🙂', say: '有空多過來坐坐', after: '哎，終於等到你了' };
  if (d <= 30)
    return { emoji: '🥺', say: '有點想你了...', after: '還好你沒忘記我！' };
  if (d <= 60)
    return { emoji: '😤', say: `都快一個月了你去哪了！`, after: '好吧...算你及時趕到' };
  if (d <= 90)
    return { emoji: '😢', say: '我以為你不來了...', after: '謝謝你還記得我...' };
  return { emoji: '😶', say: '...（沉默）', after: '...你終於來了' };
}

function hearts(daysSince) {
  const d = daysSince;
  if (d === null || d === undefined) return 0;
  if (d <= 7)  return 5;
  if (d <= 14) return 4;
  if (d <= 21) return 3;
  if (d <= 30) return 2;
  if (d <= 60) return 1;
  return 0;
}

function renderHearts(n) {
  return '❤️'.repeat(n) + '🖤'.repeat(5 - n);
}

function calcPts(daysSince, neverVisited, hasPending) {
  let p = 10;
  if (neverVisited) p += 15;
  if (hasPending)   p += 10;
  const d = daysSince;
  if (d === null || d === undefined) return p;
  if (d > 60)      p += 30;
  else if (d > 30) p += 20;
  else if (d > 14) p += 10;
  return p;
}

// ── RENDER ────────────────────────────────────────────────────
function renderCard(ph) {
  const isDone = today.done.includes(ph.id);
  const ct = charType(ph.daysSince, ph.totalAmount);
  const mood = charMood(ph.daysSince);
  const h = hearts(ph.daysSince);
  const pts = calcPts(ph.daysSince, ph.neverVisited, ph.hasPending);
  const dText = ph.daysSince !== null && ph.daysSince !== undefined
    ? `${ph.daysSince} 天前` : '從未拜訪';
  const aText = ph.totalAmount
    ? `$${(ph.totalAmount / 1000).toFixed(0)}k` : '—';

  return `
  <div class="ph-card${isDone ? ' done' : ''}" id="c-${ph.id}"
       style="border-left-color:${ct.color}">
    <div class="card-top">
      <div class="char-emoji">${ct.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${ph.name}</div>
        <div class="card-tags">
          <span class="type-badge" style="background:${ct.bg};color:${ct.color}">${ct.label}</span>
          <span class="district-tag">${ph.district || ''}</span>
        </div>
        <div class="hearts">${renderHearts(h)}</div>
      </div>
    </div>
    <div class="mood-bubble">
      <div class="mood-emoji">${mood.emoji}</div>
      <div class="mood-text">「${mood.say}」</div>
    </div>
    <div class="card-stats">
      <div class="cs-item">📅 <strong>${dText}</strong></div>
      <div class="cs-item">💰 <strong>${aText}</strong></div>
      ${ph.hasPending ? '<div class="cs-item">📌 <strong>有待追蹤</strong></div>' : ''}
    </div>
    ${!isDone ? `
    <button class="checkin-btn" onclick="doCheckin('${ph.id}')">
      打卡完成
      <span class="pts-tag">+${pts} 分</span>
    </button>` : ''}
  </div>`;
}

function render() {
  const wrap = document.getElementById('cards-wrap');
  if (!cards.length) {
    wrap.innerHTML = '<div class="loading-wrap">找不到今日推薦藥局</div>';
    return;
  }
  wrap.innerHTML = cards.map(renderCard).join('');
  updateProgress();
}

function updateProgress() {
  const done = today.done.length;
  const total = cards.length;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('done-num').textContent = done;
  document.getElementById('total-num').textContent = total;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pts').textContent = today.pts;
  document.getElementById('s-streak').textContent = streak.count;
  document.getElementById('s-shields').textContent = streak.shields;
  document.getElementById('s-best').textContent = streak.best;
  document.getElementById('streak-num').textContent = streak.count;
  document.getElementById('shield-num').textContent = streak.shields;
  if (done >= total && total > 0) showMissionComplete();
}

function showMissionComplete() {
  const banner = document.getElementById('mission-banner');
  banner.classList.add('show');
  document.getElementById('mb-done').textContent = today.done.length;
  document.getElementById('mb-pts').textContent = today.pts;
  document.getElementById('mb-streak').textContent = streak.count;
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── CHECK-IN ──────────────────────────────────────────────────
function doCheckin(id) {
  if (today.done.includes(id)) return;

  const ph = cards.find(p => p.id === id);
  if (!ph) return;

  const ct = charType(ph.daysSince, ph.totalAmount);
  const mood = charMood(ph.daysSince);
  const pts = calcPts(ph.daysSince, ph.neverVisited, ph.hasPending);
  const newH = Math.min(hearts(ph.daysSince) + 1, 5);

  document.getElementById('ov-char').textContent = ct.emoji;
  document.getElementById('ov-mood').textContent = '😄';
  document.getElementById('ov-name').textContent = ph.name;
  document.getElementById('ov-msg').textContent = mood.after;
  document.getElementById('ov-sub').textContent = `感情值 +1`;
  document.getElementById('ov-pts').textContent = `+${pts} 分`;
  document.getElementById('ov-hearts').textContent = renderHearts(newH);

  document.getElementById('ov').classList.add('open');
  if (navigator.vibrate) navigator.vibrate(40);

  today.done.push(id);
  today.pts += pts;
  saveToday(today);

  document.getElementById(`c-${id}`)?.classList.add('done');

  if (today.done.length >= cards.length) {
    streak = onMissionComplete();
  }

  updateProgress();
}

function closeCheckin() {
  document.getElementById('ov').classList.remove('open');
  render();
}

// ── TAB ───────────────────────────────────────────────────────
function switchTab(tab) {
  const isHome = tab === 'home';
  document.getElementById('main-wrap').style.display = isHome ? '' : 'none';
  document.getElementById('stats-wrap').classList.toggle('active', !isHome);
  document.getElementById('nav-home').classList.toggle('active', isHome);
  document.getElementById('nav-stats').classList.toggle('active', !isHome);
  if (!isHome) updateProgress();
}

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── LOAD DATA ─────────────────────────────────────────────────
async function loadData() {
  try {
    const [recRes, stRes] = await Promise.all([
      fetch(WORKER + '/recommend-today'),
      fetch(WORKER + '/customer-status').catch(() => null)
    ]);

    const recJson = await recRes.json();
    const stJson  = stRes ? await stRes.json().catch(() => ({})) : {};
    const statuses = stJson.statuses || {};

    const recs = recJson.recommended || recJson.recommendations || recJson || [];

    cards = recs
      .filter(p => statuses[p.id] !== 'dead')
      .slice(0, 8)
      .map(p => ({
        id:          p.id,
        name:        p.name,
        district:    p.district || '',
        daysSince:   p.daysSince,
        totalAmount: p.totalAmount || 0,
        hasPending:  p.hasPending || false,
        neverVisited:p.neverVisited || false,
      }));

    render();
  } catch (err) {
    document.getElementById('cards-wrap').innerHTML =
      '<div class="loading-wrap">⚠️ 載入失敗，請重新整理</div>';
  }
}

// ── INIT ──────────────────────────────────────────────────────
streak = initStreak();
today  = loadToday();

document.getElementById('header-date').textContent = fmtDate(todayStr());
document.getElementById('streak-num').textContent = streak.count;
document.getElementById('shield-num').textContent = streak.shields;
document.getElementById('done-num').textContent   = today.done.length;
document.getElementById('s-pts').textContent      = today.pts;
document.getElementById('s-streak').textContent   = streak.count;
document.getElementById('s-shields').textContent  = streak.shields;
document.getElementById('s-best').textContent     = streak.best;

loadData();
</script>
